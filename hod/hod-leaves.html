<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Leave Approvals - WizUP HOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/premium-dashboard.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; background: url("../assets/images/bg1.jpg") center/cover no-repeat fixed; color: #fff; font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; }
        .header { height: 70px; padding: 0 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(0, 150, 199, 0.2); background: rgba(5, 5, 20, 0.7); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6); position: sticky; top: 0; z-index: 1000; }
        .logo { width: 44px; height: auto; filter: drop-shadow(0 0 8px rgba(0, 150, 199, 0.3)); }
        
        .user-profile { display: flex; align-items: center; gap: 12px; padding: 6px 18px 6px 7px; background: rgba(255, 255, 255, 0.05); border-radius: 99px; border: 1px solid rgba(0, 150, 199, 0.25); cursor: pointer; transition: 0.3s; }
        .up-avatar { width: 32px; height: 32px; border-radius: 50%; background: #0096C7; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-family: 'Outfit'; font-size: 14px; }
        .up-name { font-size: 13px; font-weight: 700; color: #fff; font-family: 'Outfit'; }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .page-header { margin-bottom: 30px; display: flex; justify-content: space-between; align-items: flex-end; }
        .page-title { font-family: 'Outfit'; font-size: 32px; font-weight: 900; margin: 0; display: flex; align-items: center; gap: 12px; }
        .page-sub { font-size: 13px; color: rgba(255,255,255,0.4); margin-top: 4px; }

        .card { background: rgba(5, 5, 20, 0.65); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; overflow: hidden; }
        
        .leave-table { width: 100%; border-collapse: collapse; }
        .leave-table th { padding: 18px 24px; text-align: left; font-size: 11px; font-weight: 800; text-transform: uppercase; color: rgba(255,255,255,0.4); letter-spacing: 1.5px; border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.02); }
        .leave-table td { padding: 20px 24px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        .leave-table tr:hover td { background: rgba(0, 150, 199, 0.05); }

        .status-badge { padding: 6px 14px; border-radius: 99px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; border: 1px solid transparent; }
        .status-pending { background: rgba(234, 179, 8, 0.15); color: #facc15; border-color: rgba(234, 179, 8, 0.3); }
        .status-approved { background: rgba(34, 197, 94, 0.15); color: #4ade80; border-color: rgba(34, 197, 94, 0.3); }
        .status-rejected { background: rgba(239, 68, 68, 0.15); color: #f87171; border-color: rgba(239, 68, 68, 0.3); }

        .action-row { display: flex; gap: 8px; }
        .action-btn { width: 34px; height: 34px; border-radius: 10px; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .btn-approve { background: rgba(34, 197, 94, 0.1); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.2); }
        .btn-approve:hover { background: #22c55e; color: #000; transform: translateY(-2px); }
        .btn-reject { background: rgba(239, 68, 68, 0.1); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }
        .btn-reject:hover { background: #ef4444; color: #fff; transform: translateY(-2px); }

        .loading-shimmer { padding: 100px 0; text-align: center; color: rgba(255,255,255,0.2); font-size: 14px; }
    </style>
</head>
<body>
    <header class="header">
        <img src="../assets/images/LOGO1.png" alt="WizUP" class="logo" />
        <div class="h-actions" style="display:flex; gap:15px; align-items:center;">
            <a href="hod-dashboard.html" style="color:rgba(255,255,255,0.6); text-decoration:none; font-size:12px; font-weight:700;">Dashboard</a>
            <div class="user-profile">
                <div class="up-avatar" id="uInitial">H</div>
                <div class="up-name" id="uName">HOD Admin</div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <div>
                <h1 class="page-title"><i class="fa-solid fa-clipboard-list" style="color: #0096C7;"></i> Leave Approvals</h1>
                <p class="page-sub">Manage departmental leave requests from faculty and staff members.</p>
            </div>
        </div>

        <div class="card">
            <div id="loading" class="loading-shimmer">
                <i class="fa-solid fa-spinner fa-spin" style="font-size:24px; margin-bottom:10px;"></i><br>Syncing Leave Registry...
            </div>
            <table class="leave-table" id="leaveTable" style="display:none;">
                <thead>
                    <tr>
                        <th>Requester</th>
                        <th>Type & Reason</th>
                        <th>Duration</th>
                        <th>Status</th>
                        <th>Executive Action</th>
                    </tr>
                </thead>
                <tbody id="leaveGrid">
                    <!-- Dynamic Rows -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://vqxhbfbpqwpdbmgtdcik.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxeGhiZmJwcXdwZGJtZ3RkY2lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4MTY1MTMsImV4cCI6MjA4NzM5MjUxM30.U9wuwWRDsUqKef93fl0C1DLu9l_hQ5zKMT9KhOt24xE";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        let currentHODProfile = null;

        async function init() {
            try {
                const { data: { session } } = await db.auth.getSession();
                if (!session) { window.location.href = "hod-signin.html"; return; }
                
                const { data: profile, error } = await db.from('profiles').select('*').eq('id', session.user.id).single();
                if(error) throw error;
                if(!profile || profile.role !== 'hod') { alert("Academic Session Invalid: Authentication as HOD required."); window.location.href = "../index.html"; return; }
                
                currentHODProfile = profile;
                document.getElementById('uName').textContent = profile.full_name;
                document.getElementById('uInitial').textContent = profile.full_name[0].toUpperCase();
                
                loadLeaves();
            } catch (err) {
                console.error("Administrative Sync Failure:", err);
                document.getElementById('loading').innerHTML = `<i class="fa-solid fa-triangle-exclamation" style="color:#ef4444; font-size:24px;"></i><br>CLOUD SYNC FAILED<br><small>${err.message}</small>`;
                alert("Registry Refresh Timeout: " + err.message);
            }
        }

        async function loadLeaves() {
            try {
                if(!currentHODProfile || !currentHODProfile.department_id) {
                    document.getElementById('loading').innerHTML = `<i class="fa-solid fa-user-slash" style="color:#f59e0b; font-size:24px;"></i><br>DEPARTMENTAL GAP<br><small>HOD Profile incomplete. ID: ${currentHODProfile ? currentHODProfile.id : 'N/A'}</small>`;
                    return;
                }

                const { data: leaves, error } = await db.from('leave_requests').select('*, requested_by(full_name, role, department_id)').eq('status', 'pending').order('created_at', { ascending: false });
                
                if(error) throw error;

                document.getElementById('loading').style.display = 'none';
                document.getElementById('leaveTable').style.display = 'table';
                
                const tbody = document.getElementById('leaveGrid');
                if(!leaves || leaves.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:40px; color:rgba(255,255,255,0.2);">No pending leave requests in your department.</td></tr>`;
                    return;
                }

                tbody.innerHTML = leaves.map(l => {
                    const sCls = `status-${l.status.toLowerCase()}`;
                    const dateRange = `${new Date(l.start_date).toLocaleDateString()} - ${new Date(l.end_date).toLocaleDateString()}`;
                    
                    return `
                        <tr>
                            <td>
                                <div style="font-weight:700; color:#fff;">${l.requested_by?.full_name || 'Staff Member'}</div>
                                <div style="font-size:11px; color:rgba(255,150,199,0.5); font-weight:800; text-transform:uppercase;">${l.requested_by?.role || 'FACULTY'}</div>
                            </td>
                            <td>
                                <div style="font-weight:600; font-size:13px;">${(l.type || 'General').toUpperCase()} Leave</div>
                                <div style="font-size:11px; color:rgba(255,255,255,0.4); max-width:250px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">
                                    ${(l.reason || '').split(' [PROOF: ')[0] || 'No justification provided'}
                                </div>
                                ${(() => {
                                    const match = l.reason?.match(/\[PROOF:\s*(https?:\/\/[^\]\s]+)\]/);
                                    return match ? `
                                        <a href="${match[1]}" target="_blank" style="display:inline-flex; align-items:center; gap:6px; background:rgba(251,36,255,0.25); color:#fb24ff; border:1px solid rgba(251,36,255,0.4); padding:6px 12px; border-radius:10px; margin-top:8px; font-size:10px; font-weight:900; text-decoration:none;">
                                            <i class="fa-solid fa-signature"></i> ATTACHMENT VIEW
                                        </a>` : `<div style="font-size:10px; color:rgba(255,255,255,0.15); margin-top:8px;"><i class="fa-solid fa-circle-exclamation"></i> No Documentation Provided</div>`;
                                })()}
                            </td>
                            <td>
                                <div style="font-weight:600;">${dateRange}</div>
                            </td>
                            <td>
                                <span class="status-badge ${sCls}">${l.status}</span>
                            </td>
                            <td>
                                <div class="action-row">
                                    ${l.status === 'pending' ? `
                                        <button class="action-btn btn-approve" onclick="updateStatus('${l.id}', 'approved')" title="Forward to E-Governance"><i class="fa-solid fa-file-export"></i></button>
                                        <button class="action-btn btn-reject" onclick="promptReject('${l.id}')" title="Reject with Reason"><i class="fa-solid fa-ban"></i></button>
                                    ` : '<span style="font-size:11px; color:rgba(255,255,255,0.2);">Governance Complete ✔</span>'}
                                </div>
                            </td>
                        </tr>
                    `;
                }).join('');
            } catch (err) {
                console.error("Supabase Request Error:", err);
                document.getElementById('loading').innerHTML = `<i class="fa-solid fa-circle-xmark" style="color:#ef4444; font-size:24px;"></i><br>CLOUD SYNC FAILED<br><small>${err.message}</small>`;
                alert("Registry Refresh Mission-Critical Failure: " + err.message);
            }
        }

        async function promptReject(id) {
            const hReason = prompt("Enter the decline rationale for this candidate:");
            if(!hReason) return;
            
            // 🛡️ HYBRID RATIONALE: Append rationale to the reason column since decline_reason is missing from schema
            const { data: leaf } = await db.from('leave_requests').select('reason').eq('id', id).single();
            const newReason = `${leaf.reason} | REJECTED: ${hReason}`;

            const { error } = await db.from('leave_requests').update({ status: 'rejected', reason: newReason }).eq('id', id);
            if(error) { alert("Operation failed: " + error.message); return; }
            loadLeaves();
        }

        async function updateStatus(id, status) {
            const { error } = await db.from('leave_requests').update({ status }).eq('id', id);
            if(error) { alert("Operation failed: " + error.message); return; }
            loadLeaves();
        }

        window.onload = init;
    </script>
</body>
</html>
