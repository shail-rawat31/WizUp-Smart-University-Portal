<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Student Management - WizUP HOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/premium-dashboard.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; background: url("../assets/images/bg1.jpg") center/cover no-repeat fixed; color: #fff; font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; }
        .header { height: 70px; padding: 0 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(0, 150, 199, 0.2); background: rgba(5, 5, 20, 0.7); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6); position: sticky; top: 0; z-index: 1000; }
        
        .user-profile { display: flex; align-items: center; gap: 12px; padding: 6px 18px 6px 7px; background: rgba(255, 255, 255, 0.05); border-radius: 99px; border: 1px solid rgba(0, 150, 199, 0.25); cursor: pointer; transition: 0.3s; }
        .up-avatar { width: 32px; height: 32px; border-radius: 50%; background: #0096C7; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-family: 'Outfit'; font-size: 14px; }
        .up-name { font-size: 13px; font-weight: 700; color: #fff; font-family: 'Outfit'; }

        .container { max-width: 1250px; margin: 30px auto; padding: 0 20px; }
        .page-header { margin-bottom: 30px; display: flex; justify-content: space-between; align-items: flex-end; }
        .page-title { font-family: 'Outfit'; font-size: 28px; font-weight: 900; margin: 0; display: flex; align-items: center; gap: 12px; }
        .page-sub { font-size: 13px; color: rgba(255,255,255,0.4); margin-top: 4px; }

        .card { background: rgba(5, 5, 20, 0.65); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; overflow: hidden; }
        .search-row { padding: 15px 24px; background: rgba(255,255,255,0.02); border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; gap: 15px; }
        .search-box { flex: 1; position: relative; }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.3); }
        .search-box input { width: 100%; height: 40px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 10px; padding: 0 40px; color: #fff; outline: none; font-size: 13px; }

        .data-table { width: 100%; border-collapse: collapse; }
        .data-table th { padding: 18px 24px; text-align: left; font-size: 11px; font-weight: 800; text-transform: uppercase; color: rgba(255,255,255,0.4); letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.02); }
        .data-table td { padding: 18px 24px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; }
        .data-table tr:hover td { background: rgba(0, 150, 199, 0.05); }

        .risk-tag { padding: 4px 10px; border-radius: 99px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
        .risk-low { background: rgba(34, 197, 94, 0.15); color: #4ade80; border: 1px solid rgba(34, 197, 94, 0.2); }
        .risk-high { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.2); }

        .loading-shimmer { padding: 100px 0; text-align: center; color: rgba(255,255,255,0.2); font-size: 14px; }
    </style>
</head>
<body>
    <header class="header">
        <img src="../assets/images/LOGO1.png" alt="WizUP" style="width:44px" />
        <div class="h-actions" style="display:flex; gap:15px; align-items:center;">
            <a href="hod-dashboard.html" style="color:rgba(255,255,255,0.6); text-decoration:none; font-size:12px; font-weight:700;">Dashboard</a>
            <div class="user-profile">
                <div class="up-avatar" id="uInitial">H</div>
                <div class="up-name" id="uName">HOD Admin</div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <div>
                <h1 class="page-title"><i class="fa-solid fa-user-graduate" style="color: #0096C7;"></i> Student Executive Directory</h1>
                <p class="page-sub">Departmental registry and academic risk monitoring for all enrolled candidates.</p>
            </div>
        </div>

        <div class="card">
            <div class="search-row">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="stuSearch" placeholder="Search by name, roll no or batch..." oninput="handleSearch()">
                </div>
            </div>
            
            <div id="loading" class="loading-shimmer"><i class="fa-solid fa-sync fa-spin"></i><br>Consulting University Database...</div>
            
            <table class="data-table" id="stuTable" style="display:none;">
                <thead>
                    <tr>
                        <th>Student Identity</th>
                        <th>Roll Number</th>
                        <th>Academic Batch</th>
                        <th>Attendance (%)</th>
                        <th>Risk Status</th>
                    </tr>
                </thead>
                <tbody id="stuGrid">
                    <!-- Dynamic Data -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://vqxhbfbpqwpdbmgtdcik.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxeGhiZmJwcXdwZGJtZ3RkY2lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4MTY1MTMsImV4cCI6MjA4NzM5MjUxM30.U9wuwWRDsUqKef93fl0C1DLu9l_hQ5zKMT9KhOt24xE";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allStudents = [];

        async function init() {
            const { data: { session } } = await db.auth.getSession();
            if (!session) { window.location.href = "hod-signin.html"; return; }
            
            const { data: profile } = await db.from('profiles').select('*').eq('id', session.user.id).single();
            if(!profile || profile.role !== 'hod') { window.location.href = "../index.html"; return; }
            
            document.getElementById('uName').textContent = profile.full_name;
            document.getElementById('uInitial').textContent = profile.full_name[0].toUpperCase();
            
            loadStudents(profile.department);
        }

        async function loadStudents(dept) {
            const { data: students, error } = await db.from('profiles').select('*').eq('role', 'student').eq('department', dept).order('full_name');
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('stuTable').style.display = 'table';
            
            allStudents = students || [];
            renderStudents(allStudents);
        }

        function renderStudents(list) {
            const tbody = document.getElementById('stuGrid');
            if(!list.length) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; color:rgba(255,255,255,0.2); padding:40px;">No students found in registered registry.</td></tr>`;
                return;
            }

            tbody.innerHTML = list.map(s => {
                const att = (Math.random() * (95 - 60) + 60).toFixed(1); // Placeholder for dynamic att calc
                const risk = parseFloat(att) < 75 ? 'risk-high' : 'risk-low';
                const riskLbl = parseFloat(att) < 75 ? 'DETENTION RISK' : 'STABLE';

                return `
                    <tr>
                        <td style="font-weight:700; color:#fff;">${s.full_name}</td>
                        <td style="font-family:monospace; color:rgba(255,255,255,0.4);">${s.roll_no || 'R-10' + Math.floor(Math.random()*90)}</td>
                        <td style="font-weight:700; color:#0096C7;">B.Tech MCA - Sem IV</td>
                        <td style="font-weight:900; color:${parseFloat(att) < 75 ? '#f87171' : '#4ade80'};">${att}%</td>
                        <td><span class="risk-tag ${risk}">${riskLbl}</span></td>
                    </tr>
                `;
            }).join('');
        }

        function handleSearch() {
            const q = document.getElementById('stuSearch').value.toLowerCase();
            const filtered = allStudents.filter(s => 
                s.full_name.toLowerCase().includes(q) || 
                (s.roll_no || '').toLowerCase().includes(q)
            );
            renderStudents(filtered);
        }

        window.onload = init;
    </script>
</body>
</html>
