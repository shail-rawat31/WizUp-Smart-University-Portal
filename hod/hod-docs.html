<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Document Control - WizUP HOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/premium-dashboard.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; background: url("../assets/images/bg1.jpg") center/cover no-repeat fixed; color: #fff; font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; }
        .header { height: 70px; padding: 0 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(0, 150, 199, 0.2); background: rgba(5, 5, 20, 0.7); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6); position: sticky; top: 0; z-index: 1000; }
        
        .user-profile { display: flex; align-items: center; gap: 12px; padding: 6px 18px 6px 7px; background: rgba(255, 255, 255, 0.05); border-radius: 99px; border: 1px solid rgba(0, 150, 199, 0.25); cursor: pointer; transition: 0.3s; }
        .up-avatar { width: 32px; height: 32px; border-radius: 50%; background: #0096C7; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-family: 'Outfit'; font-size: 14px; }
        .up-name { font-size: 13px; font-weight: 700; color: #fff; font-family: 'Outfit'; }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .page-title { font-family: 'Outfit'; font-size: 32px; font-weight: 900; margin: 0; display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
        .page-sub { font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 20px; }

        .card { background: rgba(5, 5, 20, 0.65); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; overflow: hidden; }
        
        .doc-table { width: 100%; border-collapse: collapse; }
        .doc-table th { padding: 18px 24px; text-align: left; font-size: 11px; font-weight: 800; text-transform: uppercase; color: rgba(255,255,255,0.4); letter-spacing: 1.5px; border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.02); }
        .doc-table td { padding: 20px 24px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        .doc-table tr:hover td { background: rgba(0, 210, 255, 0.05); }

        .status-badge { padding: 6px 14px; border-radius: 99px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; border: 1px solid transparent; }
        .status-pending { background: rgba(234, 179, 8, 0.15); color: #facc15; border-color: rgba(234, 179, 8, 0.3); }
        .status-ready { background: rgba(34, 197, 94, 0.15); color: #4ade80; border-color: rgba(34, 197, 94, 0.3); }
        .status-rejected { background: rgba(239, 68, 68, 0.15); color: #f87171; border-color: rgba(239, 68, 68, 0.3); }

        .action-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(0, 210, 255, 0.2); color: #00d2ff; padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 700; cursor: pointer; transition: 0.2s; white-space: nowrap; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
        .action-btn:hover { background: #00d2ff; color: #000; transform: translateY(-2px); }

        .loading-shimmer { padding: 100px 0; text-align: center; color: rgba(255,255,255,0.2); font-size: 14px; }
    </style>
</head>
<body>
    <header class="header">
        <img src="../assets/images/LOGO1.png" alt="WizUP" style="width:44px" />
        <div class="h-actions" style="display:flex; gap:15px; align-items:center;">
            <a href="hod-dashboard.html" style="color:rgba(255,255,255,0.6); text-decoration:none; font-size:12px; font-weight:700;">Dashboard</a>
            <div class="user-profile">
                <div class="up-avatar" id="uInitial">H</div>
                <div class="up-name" id="uName">HOD Admin</div>
            </div>
        </div>
    </header>

    <div class="container">
        <h1 class="page-title"><i class="fa-solid fa-file-signature" style="color: #00d2ff;"></i> Document Controls</h1>
        <p class="page-sub">Verify and authorize institutional certificates, NOCs and official records for students.</p>

        <div class="card">
            <div id="loading" class="loading-shimmer"><i class="fa-solid fa-sync fa-spin"></i><br>Syncing Document Repository...</div>
            <table class="doc-table" id="docTable" style="display:none;">
                <thead>
                    <tr>
                        <th>Recipient Info</th>
                        <th>Document Detail</th>
                        <th>Submission Date</th>
                        <th>Auth Status</th>
                        <th>Certification Action</th>
                    </tr>
                </thead>
                <tbody id="docGrid">
                    <!-- Dynamic Data -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://vqxhbfbpqwpdbmgtdcik.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxeGhiZmJwcXdwZGJtZ3RkY2lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4MTY1MTMsImV4cCI6MjA4NzM5MjUxM30.U9wuwWRDsUqKef93fl0C1DLu9l_hQ5zKMT9KhOt24xE";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function init() {
            const { data: { session } } = await db.auth.getSession();
            if (!session) { window.location.href = "hod-signin.html"; return; }
            
            const { data: profile } = await db.from('profiles').select('*').eq('id', session.user.id).single();
            if(!profile || profile.role !== 'hod') { window.location.href = "../index.html"; return; }
            
            document.getElementById('uName').textContent = profile.full_name;
            document.getElementById('uInitial').textContent = profile.full_name[0].toUpperCase();
            
            loadDocuments();
        }

        async function loadDocuments() {
            const { data: docs, error } = await db.from('documents').select('*, profiles(full_name, roll_no)').order('created_at', { ascending: false });
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('docTable').style.display = 'table';
            
            const tbody = document.getElementById('docGrid');
            if(!docs || docs.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:40px; color:rgba(255,255,255,0.2);">No pending document authorizations detected.</td></tr>`;
                return;
            }

            tbody.innerHTML = docs.map(d => {
                const sCls = d.status === 'pending' ? 'status-pending' : (d.status === 'approved' ? 'status-ready' : 'status-rejected');
                return `
                    <tr>
                        <td>
                            <div style="font-weight:700; color:#fff;">${d.profiles?.full_name || 'Student Candidate'}</div>
                            <div style="font-size:11px; color:rgba(0,210,255,0.4); font-weight:800;">${d.profiles?.roll_no || 'SID-0402'}</div>
                        </td>
                        <td>
                            <div style="font-weight:600; font-size:13px;">${d.doc_type || 'Certificate'}</div>
                            <div style="font-size:11px; color:rgba(255,255,255,0.4);">Application ID #${d.id.substring(0,6)}</div>
                        </td>
                        <td><div style="font-size:12px; font-weight:600;">${new Date(d.created_at).toLocaleDateString()}</div></td>
                        <td><span class="status-badge ${sCls}">${d.status}</span></td>
                        <td>
                            ${d.status === 'pending' ? `
                                <div style="display:flex; gap:8px;">
                                    <button class="action-btn" onclick="updateDoc('${d.id}', 'ready')" style="color:#4ade80; border-color:rgba(34,197,94,0.3)">Authorize <i class="fa-solid fa-signature"></i></button>
                                    <button class="action-btn" onclick="updateDoc('${d.id}', 'rejected')" style="color:#f87171; border-color:rgba(239,68,68,0.3)">Inhibit <i class="fa-solid fa-ban"></i></button>
                                </div>
                            ` : '<span style="font-size:11px; color:rgba(255,255,255,0.2);">Authorized ✔</span>'}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function updateDoc(id, status) {
            const { error } = await db.from('documents').update({ status }).eq('id', id);
            if(error) { alert("Authorization Error: " + error.message); return; }
            loadDocuments();
        }

        window.onload = init;
    </script>
</body>
</html>
