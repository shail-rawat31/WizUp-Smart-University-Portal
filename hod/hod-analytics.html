<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Department Analytics - WizUP HOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/premium-dashboard.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { margin: 0; background: url("../assets/images/bg1.jpg") center/cover no-repeat fixed; color: #fff; font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; }
        .header { height: 70px; padding: 0 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(0, 150, 199, 0.2); background: rgba(5, 5, 20, 0.7); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6); position: sticky; top: 0; z-index: 1000; }
        
        .user-profile { display: flex; align-items: center; gap: 12px; padding: 6px 18px 6px 7px; background: rgba(255, 255, 255, 0.05); border-radius: 99px; border: 1px solid rgba(0, 150, 199, 0.25); cursor: pointer; transition: 0.3s; }
        .up-avatar { width: 32px; height: 32px; border-radius: 50%; background: #0096C7; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-family: 'Outfit'; font-size: 14px; }
        .up-name { font-size: 13px; font-weight: 700; color: #fff; font-family: 'Outfit'; }

        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .page-title { font-family: 'Outfit'; font-size: 32px; font-weight: 900; display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
        
        .grid-main { display: grid; grid-template-columns: 2fr 1fr; gap: 24px; }
        .card { background: rgba(5, 5, 20, 0.65); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 24px; }
        .card-hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 15px; }
        .card-hd h2 { font-family: 'Outfit'; font-size: 18px; font-weight: 800; margin: 0; display: flex; align-items: center; gap: 10px; color: #0096C7; }

        .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-box { background: rgba(255,255,255,0.03); padding: 20px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.05); text-align: center; transition: 0.3s; }
        .stat-box:hover { background: rgba(0, 150, 199, 0.08); border-color: rgba(0, 150, 199, 0.3); transform: translateY(-3px); }
        .stat-val { font-family: 'Outfit'; font-size: 24px; font-weight: 900; color: #0096C7; margin-bottom: 5px; }
        .stat-lbl { font-size: 11px; font-weight: 800; color: rgba(255,255,255,0.4); text-transform: uppercase; letter-spacing: 1px; }

        .loading-shimmer { padding: 100px 0; text-align: center; color: rgba(255,255,255,0.2); font-size: 14px; }
    </style>
</head>
<body>
    <header class="header">
        <img src="../assets/images/LOGO1.png" alt="WizUP" style="width:44px" />
        <div class="h-actions" style="display:flex; gap:15px; align-items:center;">
            <a href="hod-dashboard.html" style="color:rgba(255,255,255,0.6); text-decoration:none; font-size:12px; font-weight:700;">Dashboard</a>
            <div class="user-profile">
                <div class="up-avatar" id="uInitial">H</div>
                <div class="up-name" id="uName">HOD Admin</div>
            </div>
        </div>
    </header>

    <div class="container">
        <h1 class="page-title"><i class="fa-solid fa-chart-line" style="color: #0096C7;"></i> Department Performance</h1>

        <div class="stat-grid">
            <div class="stat-box"><div class="stat-val" id="totalFaculty">...</div><div class="stat-lbl">Active Faculty</div></div>
            <div class="stat-box"><div class="stat-val" id="totalStudents">...</div><div class="stat-lbl">Enrolled Students</div></div>
            <div class="stat-box"><div class="stat-val" id="avgAttendance">84%</div><div class="stat-lbl">Avg. Attendance</div></div>
            <div class="stat-box"><div class="stat-val" id="pendingLeaves">...</div><div class="stat-lbl">Pending Leaves</div></div>
        </div>

        <div class="grid-main">
            <div class="card">
                <div class="card-hd"><h2><i class="fa-solid fa-graduation-cap"></i> Academic Growth Trend</h2></div>
                <div style="height: 350px;"><canvas id="performanceChart"></canvas></div>
            </div>

            <div class="card">
                <div class="card-hd"><h2><i class="fa-solid fa-fire"></i> Subject Heatmap</h2></div>
                <div id="loadingHeat" class="loading-shimmer"><i class="fa-solid fa-spinner fa-spin"></i><br>Calculating Heatmap...</div>
                <div id="heatmapContainer" style="display:none; flex-direction:column; gap:12px;">
                    <!-- Static data for now, real dynamic heat later -->
                </div>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://vqxhbfbpqwpdbmgtdcik.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxeGhiZmJwcXdwZGJtZ3RkY2lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4MTY1MTMsImV4cCI6MjA4NzM5MjUxM30.U9wuwWRDsUqKef93fl0C1DLu9l_hQ5zKMT9KhOt24xE";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function init() {
            const { data: { session } } = await db.auth.getSession();
            if (!session) { window.location.href = "hod-signin.html"; return; }
            
            const { data: profile } = await db.from('profiles').select('*').eq('id', session.user.id).single();
            if(!profile || profile.role !== 'hod') { window.location.href = "../index.html"; return; }
            
            document.getElementById('uName').textContent = profile.full_name;
            document.getElementById('uInitial').textContent = profile.full_name[0].toUpperCase();
            
            loadStats(profile.department);
            renderPerformanceChart();
            renderHeatmap();
        }

        async function loadStats(dept) {
            const { data: faculty } = await db.from('profiles').select('id').eq('role', 'faculty').eq('department', dept);
            document.getElementById('totalFaculty').textContent = faculty ? faculty.length : 12;

            const { data: students } = await db.from('profiles').select('id').eq('role', 'student').eq('department', dept);
            document.getElementById('totalStudents').textContent = students ? students.length : 420;

            const { data: leaves } = await db.from('leaves').select('id').eq('status', 'pending');
            document.getElementById('pendingLeaves').textContent = leaves ? leaves.length : 0;
        }

        function renderPerformanceChart() {
            const ctx = document.getElementById('performanceChart').getContext('2d');
            new Chart(ctx, {
                type: 'line',
                data: {
                    labels: ['Week 1', 'Week 2', 'Week 3', 'Week 4', 'Week 5', 'Week 6'],
                    datasets: [{
                        label: 'Department Attendance Avg (%)',
                        data: [82, 85, 84, 88, 86, 89],
                        borderColor: '#0096C7',
                        backgroundGradient: 'rgba(0, 150, 199, 0.2)',
                        tension: 0.4,
                        fill: true
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        y: { beginAtZero: false, min: 70, max: 100, grid: { color: 'rgba(255,255,255,0.05)' } },
                        x: { grid: { color: 'rgba(255,255,255,0.05)' } }
                    }
                }
            });
        }

        function renderHeatmap() {
            const container = document.getElementById('heatmapContainer');
            document.getElementById('loadingHeat').style.display = 'none';
            container.style.display = 'flex';
            
            const subjects = [
                { name: 'Data Structures', heat: 92, color: '#4ade80' },
                { name: 'Operating Systems', heat: 78, color: '#facc15' },
                { name: 'Ethical Hacking', heat: 85, color: '#00d2ff' },
                { name: 'Database Systems', heat: 64, color: '#f87171' }
            ];

            container.innerHTML = subjects.map(s => `
                <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(255,255,255,0.02); padding:12px; border-radius:10px; border:1px solid rgba(255,255,255,0.05);">
                    <div style="font-size:13px; font-weight:700;">${s.name}</div>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <div style="width:100px; height:6px; background:rgba(255,255,255,0.05); border-radius:99px; overflow:hidden;">
                            <div style="width:${s.heat}%; height:100%; background:${s.color};"></div>
                        </div>
                        <span style="font-size:12px; font-weight:800; color:${s.color}">${s.heat}%</span>
                    </div>
                </div>
            `).join('');
        }

        window.onload = init;
    </script>
</body>
</html>
