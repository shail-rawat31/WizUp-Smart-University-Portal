<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Notification Hub - WizUP HOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/premium-dashboard.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; background: url("../assets/images/bg1.jpg") center/cover no-repeat fixed; color: #fff; font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; }
        .header { height: 70px; padding: 0 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(0, 150, 199, 0.2); background: rgba(5, 5, 20, 0.7); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6); position: sticky; top: 0; z-index: 1000; }
        
        .user-profile { display: flex; align-items: center; gap: 12px; padding: 6px 18px 6px 7px; background: rgba(255, 255, 255, 0.05); border-radius: 99px; border: 1px solid rgba(0, 150, 199, 0.25); cursor: pointer; transition: 0.3s; }
        .up-avatar { width: 32px; height: 32px; border-radius: 50%; background: #0096C7; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-family: 'Outfit'; font-size: 14px; }
        .up-name { font-size: 13px; font-weight: 700; color: #fff; font-family: 'Outfit'; }

        .container { max-width: 800px; margin: 40px auto; padding: 0 20px; }
        .page-header { margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 20px; }
        .page-title { font-family: 'Outfit'; font-size: 32px; font-weight: 900; margin: 0; display: flex; align-items: center; gap: 12px; }
        .page-sub { font-size: 13px; color: rgba(255,255,255,0.4); margin-top: 4px; }

        .notif-list { display: flex; flex-direction: column; gap: 16px; }
        .notif-item { background: rgba(5, 5, 20, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.06); border-radius: 16px; padding: 20px; display: flex; gap: 18px; transition: 0.3s; cursor: pointer; }
        .notif-item:hover { border-color: rgba(0, 150, 199, 0.4); transform: translateY(-3px); background: rgba(0, 150, 199, 0.05); }
        
        .icon-box { width: 44px; height: 44px; border-radius: 12px; background: rgba(0, 150, 199, 0.1); color: #00d2ff; display: flex; align-items: center; justify-content: center; font-size: 20px; }
        .notif-content { flex: 1; }
        .notif-hd { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .notif-title { font-family: 'Outfit'; font-size: 16px; font-weight: 800; color: #fff; }
        .notif-date { font-size: 11px; color: rgba(255,255,255,0.3); font-weight: 600; }
        .notif-body { font-size: 13px; color: rgba(255,255,255,0.6); line-height: 1.5; }
        .notif-sign { font-size: 10px; font-weight: 800; color: #ff9100; text-transform: uppercase; margin-top: 10px; border-top: 1px solid rgba(255,255,255,0.03); padding-top: 8px; }

        .loading-shimmer { padding: 80px 0; text-align: center; color: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <header class="header">
        <img src="../assets/images/LOGO1.png" alt="WizUP" style="width:44px" />
        <div class="h-actions" style="display:flex; gap:15px; align-items:center;">
            <a href="hod-dashboard.html" style="color:rgba(255,255,255,0.6); text-decoration:none; font-size:12px; font-weight:700;">Dashboard</a>
            <div class="user-profile">
                <div class="up-avatar" id="uInitial">H</div>
                <div class="up-name" id="uName">HOD Admin</div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <h1 class="page-title"><i class="fa-solid fa-bell" style="color: #00d2ff;"></i> Communication Archive</h1>
            <p class="page-sub">Chronological history of all departmental circulars and administrative alerts.</p>
        </div>

        <div id="loading" class="loading-shimmer"><i class="fa-solid fa-satellite-dish fa-spin" style="font-size:24px; margin-bottom:10px;"></i><br>Consulting Communication Nodes...</div>

        <div class="notif-list" id="notifArchive">
            <!-- Dynamic Data -->
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://vqxhbfbpqwpdbmgtdcik.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxeGhiZmJwcXdwZGJtZ3RkY2lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4MTY1MTMsImV4cCI6MjA4NzM5MjUxM30.U9wuwWRDsUqKef93fl0C1DLu9l_hQ5zKMT9KhOt24xE";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function init() {
            const { data: { session } } = await db.auth.getSession();
            if (!session) { window.location.href = "hod-signin.html"; return; }
            
            const { data: profile } = await db.from('profiles').select('*').eq('id', session.user.id).single();
            if(!profile || profile.role !== 'hod') { window.location.href = "../index.html"; return; }
            
            document.getElementById('uName').textContent = profile.full_name;
            document.getElementById('uInitial').textContent = profile.full_name[0].toUpperCase();
            
            loadArchive();
        }

        async function loadArchive() {
            const { data: announcements, error } = await db.from('announcements').select('*').order('created_at', { ascending: false });
            
            document.getElementById('loading').style.display = 'none';
            const list = document.getElementById('notifArchive');
            
            if(!announcements || announcements.length === 0) {
                list.innerHTML = `<div style="text-align:center; padding:100px; color:rgba(255,255,255,0.2);">Zero communication logs detected in the WizUP Cloud.</div>`;
                return;
            }

            list.innerHTML = announcements.map(m => {
                const date = new Date(m.created_at);
                const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                const dateStr = date.toLocaleDateString();
                
                let content = m.content || '';
                let sName = 'WizUP Broadcast';

                if(content.includes("::SIGN::")) {
                    const parts = content.split("::SIGN::");
                    content = parts[0];
                    sName = parts[1].split("|")[0];
                }

                return `
                    <div class="notif-item">
                        <div class="icon-box"><i class="fa-solid fa-bullhorn"></i></div>
                        <div class="notif-content">
                            <div class="notif-hd">
                                <div class="notif-title">${m.title}</div>
                                <div class="notif-date">${dateStr} • ${timeStr}</div>
                            </div>
                            <div class="notif-body">${content}</div>
                            <div class="notif-sign">Verified By: ${sName}</div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        window.onload = init;
    </script>
</body>
</html>
