<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>HOD Sign In – WizUP</title>
    <meta name="description" content="Head of Department login portal for WizUP University" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: rgba(20,20,22,0.70);
            --card-border: rgba(255,255,255,0.08);
            --text-main: #ffffff;
            --text-muted: #8892b0;
            --primary: #00d2ff;
            --primary-rgb: 0,210,255;
        }
        *{box-sizing:border-box;margin:0;padding:0}
        body{min-height:100vh;height:100vh;font-family:'Inter',system-ui,sans-serif;color:var(--text-main);background-color:var(--bg-color);background-image:url("../assets/images/bg1.jpg");background-size:cover;background-position:center;background-attachment:fixed;display:flex;align-items:center;overflow:hidden}
        .bg-overlay{position:fixed;inset:0;background:radial-gradient(circle at 15% 50%,rgba(5,5,10,0.55),rgba(0,0,0,0.72) 100%);pointer-events:none;z-index:0}
        .page-shell{position:relative;z-index:2;width:100%;height:100vh;display:flex;align-items:center;padding:24px 5vw}
        .signin-card{width:340px;flex-shrink:0;background:var(--card-bg);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid var(--card-border);border-radius:20px;padding:28px 26px;box-shadow:0 24px 48px rgba(0,0,0,0.5);transition:border-color 0.4s,box-shadow 0.4s}
        .signin-card:hover{border-color:rgba(var(--primary-rgb),0.3);box-shadow:0 24px 48px rgba(0,0,0,0.5),0 0 24px rgba(var(--primary-rgb),0.1)}
        .back-btn{display:inline-flex;align-items:center;gap:7px;color:var(--text-muted);text-decoration:none;font-size:12px;font-weight:500;margin-bottom:18px;transition:color 0.2s,transform 0.2s}
        .back-btn:hover{color:var(--text-main);transform:translateX(-4px)}
        .signin-header{text-align:center;margin-bottom:18px}
        .avatar{width:52px;height:52px;border-radius:50%;background:rgba(var(--primary-rgb),0.1);border:1px solid rgba(var(--primary-rgb),0.3);margin:0 auto 10px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--primary);box-shadow:0 0 18px rgba(var(--primary-rgb),0.2)}
        h1{font-family:'Outfit',sans-serif;font-size:20px;font-weight:800;background:linear-gradient(135deg,#fff,#a0aab2);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
        .subtitle{margin-top:5px;font-size:12px;color:var(--text-muted)}
        .form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
        label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.5px;color:var(--text-muted)}
        .input-wrap{position:relative}
        .input-wrap i{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:13px;color:var(--text-muted);transition:color 0.3s}
        .input-wrap:focus-within i{color:var(--primary)}
        input[type=email],input[type=password]{width:100%;padding:10px 12px 10px 36px;border:1px solid rgba(255,255,255,0.1);border-radius:10px;font-size:13px;background:rgba(0,0,0,0.2);color:var(--text-main);transition:border-color 0.3s,box-shadow 0.3s,background 0.3s;outline:none}
        input[type=email]:focus,input[type=password]:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(var(--primary-rgb),0.15);background:rgba(0,0,0,0.35)}
        input[type=checkbox]{accent-color:var(--primary)}
        .form-options{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:14px;color:var(--text-muted)}
        .remember{display:flex;align-items:center;gap:6px;cursor:pointer}
        .forgot{color:var(--primary);text-decoration:none;font-weight:500}
        .signin-btn{width:100%;padding:11px;border:none;border-radius:10px;background:var(--primary);color:#000;font-size:13px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;transition:transform 0.2s,box-shadow 0.2s;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 18px rgba(var(--primary-rgb),0.3)}
        .signin-btn:hover{transform:translateY(-2px);box-shadow:0 12px 22px rgba(var(--primary-rgb),0.4)}
        .signin-btn:disabled{opacity:0.6;cursor:not-allowed;transform:none}
        .error-msg{background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.3);border-radius:8px;padding:9px 13px;font-size:12px;color:#fca5a5;margin-bottom:12px;display:none}
        .spinner{width:15px;height:15px;border-radius:50%;border:2px solid rgba(0,0,0,0.3);border-top-color:#000;animation:spin 0.8s linear infinite}
        @keyframes spin{to{transform:rotate(360deg)}}
        .crest{position:absolute;right:12%;top:50%;transform:translateY(-50%);width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,0.02);border:1px solid rgba(255,255,255,0.05);backdrop-filter:blur(10px);box-shadow:0 30px 60px rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:2;transition:transform 0.5s}
        .crest::before{content:'';position:absolute;inset:-18px;border-radius:50%;border:1px dashed rgba(var(--primary-rgb),0.25);animation:spin 30s linear infinite}
        .crest:hover{transform:translateY(-50%) scale(1.05)}
        .crest img{max-width:62%;filter:drop-shadow(0 8px 16px rgba(0,0,0,0.5));transition:filter 0.5s,transform 0.5s}
        .crest:hover img{transform:scale(1.05);filter:drop-shadow(0 0 24px rgba(var(--primary-rgb),0.4))}
        @media(max-width:900px){.crest{display:none}.page-shell{justify-content:center;padding:20px}.signin-card{width:100%;max-width:360px}}
    </style>
</head>
<body>
    <div class="bg-overlay"></div>
    <div class="page-shell">
        <div class="signin-card">
            <a href="../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Portal</a>
            <div class="signin-header">
                <div class="avatar"><i class="fa-solid fa-crown"></i></div>
                <h1>HOD Sign In</h1>
                <p class="subtitle">Head of Department – Administrative Portal</p>
            </div>
            <div class="error-msg" id="errMsg"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" placeholder="hod@wizup.edu" required autocomplete="email" />
                    </div>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Enter your password" required />
                    </div>
                </div>
                <div class="form-options">
                    <label class="remember"><input type="checkbox" id="rememberMe" /> Remember me</label>
                    <a href="#" class="forgot">Forgot Password?</a>
                </div>
                <button type="submit" class="signin-btn" id="loginBtn">
                    <i class="fa-solid fa-right-to-bracket"></i> Sign In
                </button>
            </form>
        </div>
        <div class="crest"><img src="../assets/images/LOGO1.png" alt="WizUP Logo" /></div>
    </div>
    <script>
        const SUPABASE_URL="https://vqxhbfbpqwpdbmgtdcik.supabase.co";
        const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxeGhiZmJwcXdwZGJtZ3RkY2lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4MTY1MTMsImV4cCI6MjA4NzM5MjUxM30.U9wuwWRDsUqKef93fl0C1DLu9l_hQ5zKMT9KhOt24xE";
        const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
        const errMsg=document.getElementById("errMsg");
        const loginBtn=document.getElementById("loginBtn");
        db.auth.getSession().then(({data:{session}})=>{
            if(session) {
                db.from("profiles").select("role").eq("id", session.user.id).single()
                    .then(({data:profile}) => {
                        if(profile?.role === "hod") window.location.href = "hod-dashboard.html";
                        else if(profile?.role === "faculty") window.location.href = "../faculty/faculty-dashboard.html";
                        else db.auth.signOut().then(() => window.location.href = "../index.html");
                    });
            }
        });
        document.getElementById("loginForm").addEventListener("submit",async e=>{
            e.preventDefault();errMsg.style.display="none";loginBtn.disabled=true;
            loginBtn.innerHTML=`<span class="spinner"></span> Signing in...`;
            const{data,error}=await db.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});
            if(error){errMsg.textContent=error.message;errMsg.style.display="block";loginBtn.disabled=false;loginBtn.innerHTML=`<i class="fa-solid fa-right-to-bracket"></i> Sign In`;return;}
            const{data:p}=await db.from("profiles").select("role").eq("id",data.user.id).single();
            if(p?.role!=="hod"){await db.auth.signOut();errMsg.textContent="Access denied. HOD credentials required.";errMsg.style.display="block";loginBtn.disabled=false;loginBtn.innerHTML=`<i class="fa-solid fa-right-to-bracket"></i> Sign In`;return;}
            window.location.href="hod-dashboard.html";
        });
    </script>
</body>
</html>
