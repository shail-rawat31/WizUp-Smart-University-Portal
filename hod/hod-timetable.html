<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Academic Timetable - WizUP HOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/premium-dashboard.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; background: url("../assets/images/bg1.jpg") center/cover no-repeat fixed; color: #fff; font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; }
        .header { height: 70px; padding: 0 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(0, 150, 199, 0.2); background: rgba(5, 5, 20, 0.7); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6); position: sticky; top: 0; z-index: 1000; }
        
        .user-profile { display: flex; align-items: center; gap: 12px; padding: 6px 18px 6px 7px; background: rgba(255, 255, 255, 0.05); border-radius: 99px; border: 1px solid rgba(0, 150, 199, 0.25); cursor: pointer; transition: 0.3s; }
        .up-avatar { width: 32px; height: 32px; border-radius: 50%; background: #0096C7; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-family: 'Outfit'; font-size: 14px; }
        .up-name { font-size: 13px; font-weight: 700; color: #fff; font-family: 'Outfit'; }

        .container { max-width: 1250px; margin: 30px auto; padding: 0 20px; }
        .page-title { font-family: 'Outfit'; font-size: 32px; font-weight: 900; margin: 0; display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
        
        .timetable-card { background: rgba(5, 5, 20, 0.6); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; overflow-x: auto; }
        .tt-table { width: 100%; border-collapse: collapse; min-width: 900px; }
        .tt-table th { padding: 20px; background: rgba(255,255,255,0.03); color: rgba(255,255,255,0.4); font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .tt-table td { padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); border-right: 1px solid rgba(255,255,255,0.05); width: 14%; height: 110px; vertical-align: top; }
        
        .session-box { background: rgba(0, 150, 199, 0.1); border-left: 3px solid #00d2ff; padding: 10px; border-radius: 8px; margin-bottom: 8px; }
        .session-sub { font-size: 11px; font-weight: 800; color: #fff; margin-bottom: 3px; }
        .session-fac { font-size: 9px; color: rgba(255,255,255,0.4); font-weight: 700; text-transform: uppercase; }
        .session-room { font-size: 9px; color: #4ade80; font-weight: 800; margin-top: 4px; display: flex; align-items: center; gap: 4px; }

        .loading-shimmer { padding: 100px 0; text-align: center; color: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <header class="header">
        <img src="../assets/images/LOGO1.png" alt="WizUP" style="width:44px" />
        <div class="h-actions" style="display:flex; gap:15px; align-items:center;">
            <a href="hod-dashboard.html" style="color:rgba(255,255,255,0.6); text-decoration:none; font-size:12px; font-weight:700;">Dashboard</a>
            <div class="user-profile">
                <div class="up-avatar" id="uInitial">H</div>
                <div class="up-name" id="uName">HOD Admin</div>
            </div>
        </div>
    </header>

    <div class="container">
        <h1 class="page-title"><i class="fa-solid fa-calendar-days" style="color: #00d2ff;"></i> Departmental Time-Table</h1>

        <div class="timetable-card">
            <div id="loading" class="loading-shimmer"><i class="fa-solid fa-compass fa-spin" style="font-size:24px; margin-bottom:10px;"></i><br>Mapping Academic Sessions...</div>
            
            <table class="tt-table" id="ttTable" style="display:none;">
                <thead>
                    <tr>
                        <th>Time / Day</th>
                        <th>Monday</th>
                        <th>Tuesday</th>
                        <th>Wednesday</th>
                        <th>Thursday</th>
                        <th>Friday</th>
                        <th>Saturday</th>
                    </tr>
                </thead>
                <tbody id="ttGrid">
                    <!-- Dynamic Slots -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://vqxhbfbpqwpdbmgtdcik.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxeGhiZmJwcXdwZGJtZ3RkY2lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4MTY1MTMsImV4cCI6MjA4NzM5MjUxM30.U9wuwWRDsUqKef93fl0C1DLu9l_hQ5zKMT9KhOt24xE";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
        const times = ['09:00 AM', '10:00 AM', '11:15 AM', '12:15 PM', '02:00 PM', '03:00 PM'];

        async function init() {
            const { data: { session } } = await db.auth.getSession();
            if (!session) { window.location.href = "hod-signin.html"; return; }
            
            const { data: profile } = await db.from('profiles').select('*').eq('id', session.user.id).single();
            if(!profile || profile.role !== 'hod') { window.location.href = "../index.html"; return; }
            
            document.getElementById('uName').textContent = profile.full_name;
            document.getElementById('uInitial').textContent = profile.full_name[0].toUpperCase();
            
            loadSessions();
        }

        async function loadSessions() {
            const { data: tt, error } = await db.from('timetable').select('*');
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('ttTable').style.display = 'table';
            
            const tbody = document.getElementById('ttGrid');
            tbody.innerHTML = times.map(t => {
                const dayCols = days.map(d => {
                    const session = tt ? tt.find(s => s.day === d && s.time_slot === t) : null;
                    return `
                        <td>
                            ${session ? `
                                <div class="session-box">
                                    <div class="session-sub">${session.subject_name}</div>
                                    <div class="session-fac">${session.faculty_name || 'Dr. HOD Staff'}</div>
                                    <div class="session-room"><i class="fa-solid fa-location-dot"></i> Room ${session.room || 'LAB-02'}</div>
                                </div>
                            ` : '<div style="font-size:10px; color:rgba(255,255,255,0.1); text-align:center; padding-top:20px;">Free Slot</div>'}
                        </td>
                    `;
                }).join('');

                return `<tr><td style="font-weight:800; font-size:12px; color:#ff9100; text-align:center; background:rgba(255,255,255,0.01);">${t}</td>${dayCols}</tr>`;
            }).join('');
        }

        window.onload = init;
    </script>
</body>
</html>
