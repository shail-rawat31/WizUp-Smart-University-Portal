<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>SRMS Grievance Hub - WizUP HOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/premium-dashboard.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; background: url("../assets/images/bg1.jpg") center/cover no-repeat fixed; color: #fff; font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; }
        .header { height: 70px; padding: 0 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(0, 150, 199, 0.2); background: rgba(5, 5, 20, 0.7); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6); position: sticky; top: 0; z-index: 1000; }
        
        .user-profile { display: flex; align-items: center; gap: 12px; padding: 6px 18px 6px 7px; background: rgba(255, 255, 255, 0.05); border-radius: 99px; border: 1px solid rgba(0, 150, 199, 0.25); cursor: pointer; transition: 0.3s; }
        .up-avatar { width: 32px; height: 32px; border-radius: 50%; background: #0096C7; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-family: 'Outfit'; font-size: 14px; }
        .up-name { font-size: 13px; font-weight: 700; color: #fff; font-family: 'Outfit'; }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .page-title { font-family: 'Outfit'; font-size: 32px; font-weight: 900; margin: 0; display: flex; align-items: center; gap: 12px; margin-bottom: 30px; }
        .page-sub { font-size: 13px; color: rgba(255,255,255,0.4); margin-bottom: 20px; }

        .card { background: rgba(5, 5, 20, 0.65); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; overflow: hidden; }
        
        .ticket-table { width: 100%; border-collapse: collapse; }
        .ticket-table th { padding: 18px 24px; text-align: left; font-size: 11px; font-weight: 800; text-transform: uppercase; color: rgba(255,255,255,0.4); letter-spacing: 1.5px; border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.02); }
        .ticket-table td { padding: 20px 24px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; }
        .ticket-table tr:hover td { background: rgba(0, 150, 199, 0.05); }

        .pri-badge { padding: 4px 10px; border-radius: 6px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
        .pri-extreme { background: rgba(239, 68, 68, 0.15); color: #f87171; border: 1px solid rgba(239, 68, 68, 0.3); }
        .pri-regular { background: rgba(0, 150, 199, 0.15); color: #00d2ff; border: 1px solid rgba(0, 150, 199, 0.3); }

        .action-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 6px 14px; border-radius: 8px; font-size: 11px; font-weight: 800; font-family: 'Outfit'; cursor: pointer; transition: 0.2s; white-space: nowrap; }
        .action-btn:hover { background: #0096C7; border-color: #0096C7; color: #000; transform: translateY(-2px); }

        .loading-shimmer { padding: 100px 0; text-align: center; color: rgba(255,255,255,0.2); font-size: 14px; }
    </style>
</head>
<body>
    <header class="header">
        <img src="../assets/images/LOGO1.png" alt="WizUP" style="width:44px" />
        <div class="h-actions" style="display:flex; gap:15px; align-items:center;">
            <a href="hod-dashboard.html" style="color:rgba(255,255,255,0.6); text-decoration:none; font-size:12px; font-weight:700;">Dashboard</a>
            <div class="user-profile">
                <div class="up-avatar" id="uInitial">H</div>
                <div class="up-name" id="uName">HOD Admin</div>
            </div>
        </div>
    </header>

    <div class="container">
        <h1 class="page-title"><i class="fa-solid fa-headset" style="color: #0096C7;"></i> Grievance Hub (SRMS)</h1>
        <p class="page-sub">Departmental resolution system for student concerns, infrastructure issues and peer complaints.</p>

        <div class="card">
            <div id="loading" class="loading-shimmer"><i class="fa-solid fa-satellite fa-spin"></i><br>Consulting Support Databases...</div>
            <table class="ticket-table" id="ticketTable" style="display:none;">
                <thead>
                    <tr>
                        <th>Subject & Issue</th>
                        <th>Applicant</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Resolution Action</th>
                    </tr>
                </thead>
                <tbody id="ticketGrid">
                    <!-- Dynamic Data -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://vqxhbfbpqwpdbmgtdcik.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxeGhiZmJwcXdwZGJtZ3RkY2lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4MTY1MTMsImV4cCI6MjA4NzM5MjUxM30.U9wuwWRDsUqKef93fl0C1DLu9l_hQ5zKMT9KhOt24xE";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function init() {
            const { data: { session } } = await db.auth.getSession();
            if (!session) { window.location.href = "hod-signin.html"; return; }
            
            const { data: profile } = await db.from('profiles').select('*').eq('id', session.user.id).single();
            if(!profile || profile.role !== 'hod') { window.location.href = "../index.html"; return; }
            
            document.getElementById('uName').textContent = profile.full_name;
            document.getElementById('uInitial').textContent = profile.full_name[0].toUpperCase();
            
            loadTickets();
        }

        async function loadTickets() {
            // Using placeholder logic as 'complaints' table may not exist yet, 
            // but we use the general tickets schema seen in student portal
            const { data: tickets, error } = await db.from('tickets').select('*, profiles(full_name, role)').order('created_at', { ascending: false });
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('ticketTable').style.display = 'table';
            
            const tbody = document.getElementById('ticketGrid');
            if(!tickets || tickets.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" style="text-align:center; padding:40px; color:rgba(255,255,255,0.2);">No pending departmental grievances detected.</td></tr>`;
                return;
            }

            tbody.innerHTML = tickets.map(t => {
                const sCls = t.status === 'open' ? 'pri-extreme' : 'pri-regular' ;
                const pColor = t.priority === 'High' ? '#f87171' : (t.priority === 'Medium' ? '#facc15' : '#4ade80');
                
                return `
                    <tr>
                        <td>
                            <div style="font-weight:700; color:#fff;">${t.subject || 'Institutional Grievance'}</div>
                            <div style="font-size:11px; color:rgba(255,255,255,0.4); max-width:300px; overflow:hidden; text-overflow:ellipsis;">${t.message || 'Details not provided.'}</div>
                        </td>
                        <td>
                            <div style="font-weight:600;">${t.profiles?.full_name || 'Student Candidate'}</div>
                            <div style="font-size:10px; color:rgba(0,150,199,0.5); font-weight:800; text-transform:uppercase;">${t.profiles?.role || 'STUDENT'}</div>
                        </td>
                        <td>
                            <div style="font-size:11px; font-weight:800; color:${pColor};"><i class="fa-solid fa-circle"></i> ${t.priority.toUpperCase()}</div>
                        </td>
                        <td><span class="pri-badge ${t.status === 'open' ? 'pri-extreme' : 'pri-regular'}">${t.status.toUpperCase()}</span></td>
                        <td>
                            ${t.status === 'open' ? `
                                <button class="action-btn" onclick="resolveTicket('${t.id}')">Resolve Issue <i class="fa-solid fa-check-double"></i></button>
                            ` : '<span style="font-size:11px; color:rgba(255,255,255,0.2);">Closed ✔</span>'}
                        </td>
                    </tr>
                `;
            }).join('');
        }

        async function resolveTicket(id) {
            const { error } = await db.from('tickets').update({ status: 'resolved' }).eq('id', id);
            if(error) { alert("Resolution failed: " + error.message); return; }
            loadTickets();
        }

        window.onload = init;
    </script>
</body>
</html>
