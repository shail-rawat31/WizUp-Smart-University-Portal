<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Faculty Monitoring - WizUP HOD</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/premium-dashboard.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; background: url("../assets/images/bg1.jpg") center/cover no-repeat fixed; color: #fff; font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; }
        .header { height: 70px; padding: 0 30px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(0, 150, 199, 0.2); background: rgba(5, 5, 20, 0.7); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.6); position: sticky; top: 0; z-index: 1000; }
        
        .user-profile { display: flex; align-items: center; gap: 12px; padding: 6px 18px 6px 7px; background: rgba(255, 255, 255, 0.05); border-radius: 99px; border: 1px solid rgba(0, 150, 199, 0.25); cursor: pointer; transition: 0.3s; }
        .up-avatar { width: 32px; height: 32px; border-radius: 50%; background: #ff3366; color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 800; font-family: 'Outfit'; font-size: 14px; }
        .up-name { font-size: 13px; font-weight: 700; color: #fff; font-family: 'Outfit'; }

        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .page-header { margin-bottom: 30px; }
        .page-title { font-family: 'Outfit'; font-size: 32px; font-weight: 900; margin: 0; display: flex; align-items: center; gap: 12px; }
        .page-sub { font-size: 13px; color: rgba(255,255,255,0.4); margin-top: 4px; }

        .fac-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 24px; }
        .fac-card { background: rgba(5, 5, 20, 0.65); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; padding: 24px; position: relative; transition: 0.3s; }
        .fac-card:hover { transform: translateY(-5px); border-color: rgba(255,51,102,0.3); box-shadow: 0 10px 40px rgba(0,0,0,0.4); }
        
        .fac-avatar { width: 50px; height: 50px; border-radius: 12px; background: rgba(255,51,102,0.1); color: #ff3366; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800; font-family: 'Outfit'; margin-bottom: 15px; }
        .fac-name { font-family: 'Outfit'; font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 4px; }
        .fac-code { font-size: 11px; color: rgba(255,150,199,0.5); font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }

        .metric-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 20px; padding-top: 15px; border-top: 1px solid rgba(255,255,255,0.05); }
        .metric-box { text-align: center; }
        .metric-val { font-family: 'Outfit'; font-size: 18px; font-weight: 900; color: #ff3366; }
        .metric-lbl { font-size: 10px; font-weight: 800; color: rgba(255,255,255,0.3); text-transform: uppercase; letter-spacing: 1px; margin-top: 4px; }

        .warn-btn { width: 100%; margin-top: 20px; background: rgba(255,51,102,0.1); color: #ff3366; border: 1px solid rgba(255,51,102,0.2); padding: 10px; border-radius: 10px; font-size: 12px; font-weight: 800; font-family: 'Outfit'; cursor: pointer; transition: 0.2s; }
        .warn-btn:hover { background: #ff3366; color: #fff; transform: scale(1.02); }

        .loading-shimmer { padding: 100px 0; text-align: center; color: rgba(255,255,255,0.2); font-size: 14px; }
    </style>
</head>
<body>
    <header class="header">
        <img src="../assets/images/LOGO1.png" alt="WizUP" style="width:44px" />
        <div class="h-actions" style="display:flex; gap:15px; align-items:center;">
            <a href="hod-dashboard.html" style="color:rgba(255,255,255,0.6); text-decoration:none; font-size:12px; font-weight:700;">Dashboard</a>
            <div class="user-profile">
                <div class="up-avatar" id="uInitial">H</div>
                <div class="up-name" id="uName">HOD Admin</div>
            </div>
        </div>
    </header>

    <div class="container">
        <div class="page-header">
            <h1 class="page-title"><i class="fa-solid fa-chalkboard-user" style="color: #ff3366;"></i> Faculty Performance Monitor</h1>
            <p class="page-sub">Track active faculty sessions, engagement levels and departmental coordination.</p>
        </div>

        <div id="loading" class="loading-shimmer">
            <i class="fa-solid fa-radar fa-spin" style="font-size:24px; margin-bottom:10px;"></i><br>Scanning Faculty Roster...
        </div>

        <div class="fac-grid" id="facultyGrid">
            <!-- Dynamic Faculty Cards -->
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://vqxhbfbpqwpdbmgtdcik.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxeGhiZmJwcXdwZGJtZ3RkY2lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4MTY1MTMsImV4cCI6MjA4NzM5MjUxM30.U9wuwWRDsUqKef93fl0C1DLu9l_hQ5zKMT9KhOt24xE";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        async function init() {
            const { data: { session } } = await db.auth.getSession();
            if (!session) { window.location.href = "hod-signin.html"; return; }
            
            const { data: profile } = await db.from('profiles').select('*').eq('id', session.user.id).single();
            if(!profile || profile.role !== 'hod') { window.location.href = "../index.html"; return; }
            
            document.getElementById('uName').textContent = profile.full_name;
            document.getElementById('uInitial').textContent = profile.full_name[0].toUpperCase();
            
            loadFaculty(profile.department);
        }

        async function loadFaculty(dept) {
            const { data: faculty, error } = await db.from('profiles').select('*').eq('role', 'faculty').eq('department', dept);
            
            document.getElementById('loading').style.display = 'none';
            const grid = document.getElementById('facultyGrid');
            
            if(!faculty || faculty.length === 0) {
                grid.innerHTML = `<div style="grid-column:1/-1; text-align:center; padding:100px; color:rgba(255,255,255,0.2);">No active faculty members detected in your department.</div>`;
                return;
            }

            grid.innerHTML = faculty.map(f => `
                <div class="fac-card">
                    <div class="fac-avatar">${f.full_name[0]}</div>
                    <div class="fac-name">${f.full_name}</div>
                    <div class="fac-code">${f.employee_code || 'E-1025'} • ${f.department || 'GENERAL'}</div>
                    
                    <div class="metric-row">
                        <div class="metric-box">
                            <div class="metric-val">12</div>
                            <div class="metric-lbl">Total Batches</div>
                        </div>
                        <div class="metric-box">
                            <div class="metric-val" style="color:#4ade80">94.2%</div>
                            <div class="metric-lbl">Engagement</div>
                        </div>
                    </div>

                    <button class="warn-btn" onclick="issueWarning('${f.id}')"><i class="fa-solid fa-envelope"></i> Message Faculty</button>
                </div>
            `).join('');
        }

        function issueWarning(id) {
            alert("Secure Messenger initiated for Faculty ID: " + id + "\nDigital compliance monitoring enabled.");
        }

        window.onload = init;
    </script>
</body>
</html>
