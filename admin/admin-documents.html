<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Document Config – WizUP Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link rel="stylesheet" href="admin-shared.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<header class="adm-header">
  <img src="../assets/images/LOGO1.png" alt="WizUP" class="adm-logo"/>
  <div><div class="adm-title">Document Control</div><div class="adm-sub">Review all document requests across the university</div></div>
  <div class="adm-spacer"></div>
  <div class="adm-header-btns">
    <a href="admin-dashboard.html" class="ico-btn"><i class="fa-solid fa-house"></i></a>
    <div class="user-chip"><div class="user-avatar" id="userAvatar">A</div><div><div class="user-name" id="userName">Admin</div><div class="user-role">Super Admin</div></div></div>
    <button class="ico-btn danger" onclick="doSignOut()"><i class="fa-solid fa-power-off"></i></button>
  </div>
</header>
<div class="adm-wrap">
  <aside class="adm-sidebar" id="sidebar"></aside>
  <main class="adm-content">
    <div class="pg-head">
      <div><h1 class="pg-title"><i class="fa-solid fa-file-signature"></i>Document Control</h1><p class="pg-sub">Admin view of all document requests from students & faculty</p></div>
      <button class="btn btn-ghost btn-sm" onclick="loadDocs()"><i class="fa-solid fa-rotate-right"></i> Refresh</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card"><div class="sc-icon" style="background:rgba(245,158,11,.15);color:#fcd34d"><i class="fa-solid fa-hourglass-half"></i></div><div class="sc-val" id="sc-pend">—</div><div class="sc-lbl">Pending</div></div>
      <div class="stat-card"><div class="sc-icon" style="background:rgba(34,197,94,.15);color:#86efac"><i class="fa-solid fa-check-circle"></i></div><div class="sc-val" id="sc-ready">—</div><div class="sc-lbl">Ready / Approved</div></div>
      <div class="stat-card"><div class="sc-icon" style="background:rgba(239,68,68,.15);color:#fca5a5"><i class="fa-solid fa-ban"></i></div><div class="sc-val" id="sc-rej">—</div><div class="sc-lbl">Rejected</div></div>
      <div class="stat-card"><div class="sc-icon" style="background:rgba(56,189,248,.15);color:#7dd3fc"><i class="fa-solid fa-paperclip"></i></div><div class="sc-val" id="sc-files">—</div><div class="sc-lbl">With Attachments</div></div>
    </div>

    <div class="card">
      <div class="card-hd"><h3><i class="fa-solid fa-list"></i> All Document Requests</h3>
        <div style="display:flex;gap:10px;align-items:center">
          <select class="filter-sel" id="statusFilter" onchange="renderDocs()"><option value="">All Status</option><option value="pending">Pending</option><option value="ready">Ready</option><option value="approved">Approved</option><option value="rejected">Rejected</option></select>
          <select class="filter-sel" id="catFilter" onchange="renderDocs()"><option value="">All Categories</option><option value="student">Students</option><option value="faculty">Faculty</option></select>
          <div class="search-box"><i class="fa-solid fa-magnifying-glass"></i><input type="text" id="docSearch" placeholder="Search…" oninput="renderDocs()"/></div>
        </div>
      </div>
      <div style="overflow-x:auto">
        <table class="data-table"><thead><tr><th>Submitter</th><th>Role</th><th>Doc Type</th><th>Purpose</th><th>Date</th><th>Status</th><th>File</th><th>Action</th></tr></thead>
        <tbody id="docTable"><tr><td colspan="8" style="text-align:center;padding:24px;color:#555"><i class="fa-solid fa-spinner fa-spin"></i></td></tr></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<div id="toastWrap"></div>
<script src="admin-shared.js"></script>
<script>
document.getElementById("sidebar").innerHTML = SIDEBAR_HTML;
var allDocs=[];

window.onload = async function(){
  var ok = await requireAdmin(); if(!ok) return;
  initSidebar();
  loadDocs();
};

async function loadDocs(){
  var r = await db.from("document_requests")
    .select("*,profiles:requested_by(full_name,role,roll_no,employee_code)")
    .order("created_at",{ascending:false});

  if(r.error){
    document.getElementById("docTable").innerHTML='<tr><td colspan="8" style="text-align:center;padding:24px;color:#fca5a5">Error: '+r.error.message+' — Run sql/add_document_requests.sql first.</td></tr>';
    return;
  }

  allDocs = r.data||[];
  document.getElementById("sc-pend").textContent = allDocs.filter(function(d){ return d.status==="pending"; }).length;
  document.getElementById("sc-ready").textContent = allDocs.filter(function(d){ return d.status==="ready"||d.status==="approved"; }).length;
  document.getElementById("sc-rej").textContent = allDocs.filter(function(d){ return d.status==="rejected"; }).length;
  document.getElementById("sc-files").textContent = allDocs.filter(function(d){ return d.file_url; }).length;
  renderDocs();
}

function renderDocs(){
  var sf = document.getElementById("statusFilter").value;
  var cf = document.getElementById("catFilter").value;
  var q  = document.getElementById("docSearch").value.toLowerCase();
  var list = allDocs.filter(function(d){
    if(sf && d.status!==sf) return false;
    if(cf && d.category!==cf) return false;
    var p = Array.isArray(d.profiles)?d.profiles[0]:d.profiles;
    if(q && !(p?p.full_name:"").toLowerCase().includes(q) && !d.doc_type.includes(q)) return false;
    return true;
  });
  var SB={ pending:"b-pending", approved:"b-approved", ready:"b-approved", rejected:"b-rejected" };
  var tb = document.getElementById("docTable");
  if(!list.length){ tb.innerHTML='<tr><td colspan="8" style="text-align:center;padding:24px;color:#555">No records</td></tr>'; return; }
  tb.innerHTML = list.map(function(d){
    var p = Array.isArray(d.profiles)?d.profiles[0]:d.profiles;
    var docLabel = d.doc_type.replace(/_/g," ").replace(/\b\w/g,function(c){ return c.toUpperCase(); });
    return '<tr>'
      +'<td style="font-weight:700">'+(p?p.full_name:"—")+'</td>'
      +'<td>'+roleBadge(p?p.role:"—")+'</td>'
      +'<td style="font-size:12px;font-weight:600;color:#ff9100">'+docLabel+'</td>'
      +'<td style="font-size:12px;color:#94a3b8;max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(d.purpose||"—")+'</td>'
      +'<td style="font-size:12px;color:#94a3b8">'+fmtDate(d.created_at)+'</td>'
      +'<td><span class="badge '+(SB[d.status]||"b-gray")+'">'+d.status+'</span></td>'
      +'<td>'+(d.file_url?'<a href="'+d.file_url+'" target="_blank" class="btn btn-ghost btn-xs"><i class="fa-solid fa-eye"></i> View</a>':'<span style="font-size:11px;color:#555">—</span>')+'</td>'
      +'<td><div style="display:flex;gap:5px">'
      +(d.status==="pending"?'<button class="btn btn-sm" style="background:rgba(34,197,94,.15);color:#86efac;border:1px solid rgba(34,197,94,.3);padding:4px 10px;font-size:11px" onclick="updateDoc(\''+d.id+'\',\'ready\')"><i class="fa-solid fa-check"></i> Approve</button>'
      +'<button class="btn btn-danger btn-xs" onclick="updateDoc(\''+d.id+'\',\'rejected\')"><i class="fa-solid fa-xmark"></i></button>':"<span style='font-size:11px;color:#555'>—</span>")
      +'</div></td></tr>';
  }).join("");
}

async function updateDoc(id,status){
  var res = await db.from("document_requests").update({status, reviewed_by:adminProfile.id, reviewed_at:new Date().toISOString()}).eq("id",id);
  if(res.error){ showToast("Failed: "+res.error.message,"error"); return; }
  showToast("Document "+status,"success"); loadDocs();
}
</script>
</body>
</html>
