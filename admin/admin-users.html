<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>All Users Directory - WizUP Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/premium-dashboard.css" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { margin: 0; background: url("../assets/images/bg1.jpg") center/cover no-repeat fixed; color: #fff; font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; }
        .topbar { display: flex; align-items: center; justify-content: space-between; padding: 15px 40px; background: rgba(5, 5, 20, 0.7); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); border-bottom: 1px solid rgba(255, 145, 0, 0.2); position: sticky; top: 0; z-index: 100; height: 70px; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand i { font-size: 24px; color: #ff9100; filter: drop-shadow(0 0 10px rgba(255,145,0,0.4)); }
        .brand h1 { font-family: 'Outfit'; font-size: 18px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; color: #ff9100; margin: 0; }
        .back-btn { background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 145, 0, 0.2); color: #fff; text-decoration: none; font-size: 12px; font-weight: 700; padding: 8px 16px; border-radius: 99px; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .back-btn:hover { background: rgba(255, 145, 0, 0.15); border-color: #ff9100; transform: translateX(-5px); }
        
        .container { max-width: 1300px; margin: 30px auto; padding: 0 20px; }
        .page-header { margin-bottom: 30px; }
        .page-title { font-family: 'Outfit'; font-size: 28px; font-weight: 900; margin: 0; display: flex; align-items: center; gap: 12px; }
        .page-sub { font-size: 13px; color: rgba(255,255,255,0.4); margin-top: 4px; }
        
        /* Premium Card Overrides */
        .card { background: rgba(5, 5, 20, 0.65); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.08); border-radius: 16px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
        
        .filters { padding: 20px 24px; background: rgba(255,255,255,0.02); border-bottom: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; gap: 20px; }
        .search-box { flex: 1; position: relative; }
        .search-box i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,0.3); font-size: 14px; }
        .search-box input { width: 100%; height: 44px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 0 45px; color: #fff; font-family: inherit; font-size: 13px; outline: none; transition: 0.3s; }
        .search-box input:focus { background: rgba(0,0,0,0.4); border-color: #ff9100; box-shadow: 0 0 20px rgba(255,145,0,0.1); }
        
        .data-table { width: 100%; border-collapse: collapse; text-align: left; }
        .data-table th { padding: 18px 24px; color: rgba(255,255,255,0.4); font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; font-weight: 800; border-bottom: 1px solid rgba(255,255,255,0.1); background: rgba(255,255,255,0.02); }
        .data-table td { padding: 18px 24px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 13px; color: #e2e8f0; font-family: 'Inter', sans-serif; font-weight: 500; }
        .data-table tr:hover td { background: rgba(255, 145, 0, 0.05); }
        
        .badge { padding: 5px 12px; border-radius: 99px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; display: inline-flex; align-items: center; gap: 6px; }
        .badge::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
        
        .b-student { background: rgba(255,51,102,0.15); color: #ff3366; border: 1px solid rgba(255,51,102,0.3); }
        .b-faculty { background: rgba(0,230,118,0.15); color: #00e676; border: 1px solid rgba(0,230,118,0.3); }
        .b-hod { background: rgba(0,210,255,0.15); color: #00d2ff; border: 1px solid rgba(0,210,255,0.3); }
        .b-admin { background: rgba(255,145,0,0.15); color: #ff9100; border: 1px solid rgba(255,145,0,0.3); }
        
        .user-id { font-family: monospace; color: rgba(255,255,255,0.3); font-size: 11px; }
        .action-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; transition: 0.2s; }
        .action-btn:hover { background: rgba(255,145,0,0.2); border-color: #ff9100; }
        
        .loading-shimmer { padding: 100px 0; text-align: center; color: rgba(255,255,255,0.3); font-size: 14px; display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .fa-spin-modern { animation: fa-spin 1.5s linear infinite; }

        .btn-add { background: #ff9100; color: #000; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 800; font-family: 'Outfit'; font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .btn-add:hover { background: #ffb142; transform: translateY(-2px); box-shadow: 0 5px 20px rgba(255,145,0,0.3); }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="brand"><i class="fa-solid fa-users"></i><h1>WizUP Admin</h1></div>
        <a href="admin-dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Return to Console</a>
    </div>

    <div class="container">
        <div class="page-header">
            <h2 class="page-title"><i class="fa-solid fa-users-viewfinder" style="color: #ff9100;"></i> User Directory</h2>
            <p class="page-sub">Real-time oversight of all students, faculty members and administrative heads.</p>
        </div>

        <div class="card">
            <div class="filters">
                <div class="search-box">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="text" id="userSearch" placeholder="Search by name, email, department or ID..." oninput="handleSearch()">
                </div>
                <button class="btn-add"><i class="fa-solid fa-user-plus"></i> Provision New User</button>
            </div>
            
            <div id="loadingBox" class="loading-shimmer">
                <i class="fa-solid fa-circle-notch fa-spin-modern" style="font-size: 32px; color: #ff9100;"></i>
                Synchronizing with WizUP Cloud...
            </div>

            <table class="data-table" id="usersTable" style="display: none;">
                <thead>
                    <tr>
                        <th>Identity Info</th>
                        <th>Credentials</th>
                        <th>Institutional Role</th>
                        <th>Department</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="userTableBody">
                    <!-- Dynamic Rows -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://vqxhbfbpqwpdbmgtdcik.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxeGhiZmJwcXdwZGJtZ3RkY2lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4MTY1MTMsImV4cCI6MjA4NzM5MjUxM30.U9wuwWRDsUqKef93fl0C1DLu9l_hQ5zKMT9KhOt24xE";
        const db = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allUsers = [];

        async function loadUsers() {
            try {
                const { data: { session } } = await db.auth.getSession();
                if (!session) { window.location.href = "admin-signin.html"; return; }

                const { data: users, error } = await db.from('profiles').select('*').order('role', { ascending: false });
                
                if (error) throw error;
                
                allUsers = users || [];
                renderUsers(allUsers);
                
                document.getElementById('loadingBox').style.display = 'none';
                document.getElementById('usersTable').style.display = 'table';
            } catch (err) {
                console.error("Critical Sync Error:", err);
                document.getElementById('loadingBox').innerHTML = `<i class="fa-solid fa-triangle-exclamation" style="color:#ef4444; font-size:32px;"></i><br>Failed to sync user data.`;
            }
        }

        function renderUsers(list) {
            const tbody = document.getElementById('userTableBody');
            tbody.innerHTML = list.map(u => {
                const roleClass = `b-${u.role || 'student'}`;
                const roleLabel = (u.role || 'student').toUpperCase();
                
                return `
                    <tr>
                        <td>
                            <div style="font-weight:700; color:#fff; font-family:'Outfit'; font-size:14px;">${u.full_name || 'Legacy User'}</div>
                            <div class="user-id">${u.id.substring(0, 8)}...${u.id.substring(u.id.length - 4)}</div>
                        </td>
                        <td>
                            <div style="color:#ff9100; font-size:12px; font-weight:600;">${u.email || 'No email registered'}</div>
                        </td>
                        <td>
                            <span class="badge ${roleClass}">${roleLabel}</span>
                        </td>
                        <td>
                            <div style="font-size:12px; color:rgba(255,255,255,0.6); font-weight:700;">${u.department || 'General'}</div>
                        </td>
                        <td>
                            <button class="action-btn" onclick="editUser('${u.id}')">Manage <i class="fa-solid fa-sliders"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function handleSearch() {
            const q = document.getElementById('userSearch').value.toLowerCase();
            const filtered = allUsers.filter(u => 
                (u.full_name || '').toLowerCase().includes(q) || 
                (u.email || '').toLowerCase().includes(q) || 
                (u.role || '').toLowerCase().includes(q) ||
                (u.department || '').toLowerCase().includes(q) ||
                u.id.toLowerCase().includes(q)
            );
            renderUsers(filtered);
        }

        function editUser(id) {
            alert("User Management Module for Security ID: " + id + "\nFeature deployment in progress.");
        }

        // Initialize Live Feed
        window.onload = loadUsers;
    </script>
</body>
</html>
