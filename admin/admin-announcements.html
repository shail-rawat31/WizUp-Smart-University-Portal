<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Global Announcements - WizUP Admin</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/premium-dashboard.css" />
    <style>
        body { margin: 0; background-color: #050505; color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .topbar { display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; background: rgba(5, 5, 8, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(255, 145, 0, 0.2); position: sticky; top: 0; z-index: 100; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand i { font-size: 28px; color: #ff9100; text-shadow: 0 0 15px rgba(255,145,0,0.5); }
        .brand h1 { font-family: 'Outfit'; font-size: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .back-btn { color: #ff9100; text-decoration: none; font-size: 13px; font-weight: 700; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .back-btn:hover { color: #fff; transform: translateX(-5px); }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .page-title { font-family: 'Outfit'; font-size: 32px; font-weight: 900; margin-bottom: 30px; display: flex; align-items: center; gap: 12px; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
        .data-table { width: 100%; border-collapse: collapse; text-align: left; }
        .data-table th { padding: 15px 20px; color: #8892b0; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .data-table td { padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; color: #e2e8f0; }
        .data-table tr:hover td { background: rgba(255, 145, 0, 0.05); }
        
        .badge { padding: 6px 12px; border-radius: 99px; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; }
        .b-student { background: rgba(255,51,102,0.15); color: #ff3366; border: 1px solid rgba(255,51,102,0.3); }
        .b-faculty { background: rgba(0,230,118,0.15); color: #00e676; border: 1px solid rgba(0,230,118,0.3); }
        .b-hod { background: rgba(0,210,255,0.15); color: #00d2ff; border: 1px solid rgba(0,210,255,0.3); }
        .b-admin { background: rgba(255,145,0,0.15); color: #ff9100; border: 1px solid rgba(255,145,0,0.3); }
        
        
    </style>
</head>
<body>
    <div class="topbar">
        <div class="brand"><i class="fa-solid fa-bullhorn"></i><h1>WizUP Admin</h1></div>
        <a href="admin-dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Console</a>
    </div>
    <div class="container">
        <h2 class="page-title"><i class="fa-solid fa-bullhorn" style="color: #ff9100;"></i> Global Announcements</h2>
        <div class="card" style="padding: 30px;">
            <input type="text" placeholder="Announcement Title..." style="width: 100%; font-size: 18px; padding: 16px; margin-bottom: 20px;">
            <textarea placeholder="Write announcement details here in Markdown..." style="width: 100%; height: 200px; padding: 16px; margin-bottom: 20px; font-family: monospace;"></textarea>
            <div style="display: flex; gap: 16px; align-items: center;">
                <label style="font-size: 12px; font-weight: 700; color: #889;">Target Audience:</label>
                <select style="width: 200px;"><option>All Users</option><option>Students Only</option><option>Faculty & Staff</option></select>
                <div style="flex:1;"></div>
                <button style="padding: 14px 30px; border-radius: 8px; background: linear-gradient(135deg, #ff9100, #ff3d00) !important;"><i class="fa-solid fa-paper-plane"></i> Broadcast Now</button>
            </div>
        </div>
    </div>
</body>
</html>
