<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Announcements – WizUP Admin</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link rel="stylesheet" href="admin-shared.css"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
.ann-card{background:rgba(10,10,15,.82);border:1px solid rgba(255,145,0,.18);border-radius:12px;padding:18px;backdrop-filter:blur(12px);transition:.2s;display:flex;flex-direction:column;gap:8px}
.ann-card:hover{border-color:rgba(255,145,0,.4);transform:translateY(-2px)}
.ann-title{font-family:'Outfit',sans-serif;font-size:15px;font-weight:800;color:#fff}
.ann-content{font-size:13px;color:#94a3b8;line-height:1.6}
.ann-meta{display:flex;align-items:center;gap:10px;font-size:11px;color:#555;flex-wrap:wrap;margin-top:4px}
.target-tabs{display:flex;gap:8px;flex-wrap:wrap}
.target-pill{padding:6px 16px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.04);color:#94a3b8;transition:.2s;font-family:'Inter',sans-serif}
.target-pill.active{background:rgba(255,145,0,.15);border-color:rgba(255,145,0,.4);color:#ff9100}
</style>
</head>
<body>
<header class="adm-header">
  <img src="../assets/images/LOGO1.png" alt="WizUP" class="adm-logo"/>
  <div><div class="adm-title">Global Announcements</div><div class="adm-sub">Broadcast circulars to all users</div></div>
  <div class="adm-spacer"></div>
  <div class="adm-header-btns">
    <a href="admin-dashboard.html" class="ico-btn"><i class="fa-solid fa-house"></i></a>
    <div class="user-chip"><div class="user-avatar" id="userAvatar">A</div><div><div class="user-name" id="userName">Admin</div><div class="user-role">Super Admin</div></div></div>
    <button class="ico-btn danger" onclick="doSignOut()"><i class="fa-solid fa-power-off"></i></button>
  </div>
</header>
<div class="adm-wrap">
  <aside class="adm-sidebar" id="sidebar"></aside>
  <main class="adm-content">
    <div class="pg-head">
      <div><h1 class="pg-title"><i class="fa-solid fa-bullhorn"></i>Announcements</h1><p class="pg-sub">Create and manage university-wide communications</p></div>
    </div>

    <div style="display:grid;grid-template-columns:1fr 1.3fr;gap:20px;align-items:start">
      <!-- Compose -->
      <div class="card">
        <div class="card-hd"><h3><i class="fa-solid fa-pen-to-square"></i> Compose Announcement</h3></div>
        <div class="card-bd" style="display:flex;flex-direction:column;gap:14px">
          <div class="form-group" style="margin:0"><label>Title *</label><input class="form-control" id="annTitle" placeholder="e.g. University Holiday Notice"/></div>
          <div class="form-group" style="margin:0"><label>Message *</label><textarea class="form-control" id="annContent" rows="5" placeholder="Write the announcement content here…"></textarea></div>
          <div>
            <label style="display:block;font-size:11px;font-weight:700;color:#8892b0;text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px">Target Audience</label>
            <div class="target-tabs">
              <button class="target-pill active" onclick="setTarget('all',this)"><i class="fa-solid fa-globe"></i> All Users</button>
              <button class="target-pill" onclick="setTarget('student',this)"><i class="fa-solid fa-user-graduate"></i> Students</button>
              <button class="target-pill" onclick="setTarget('faculty',this)"><i class="fa-solid fa-chalkboard-user"></i> Faculty</button>
              <button class="target-pill" onclick="setTarget('hod',this)"><i class="fa-solid fa-user-tie"></i> HOD</button>
            </div>
            <input type="hidden" id="annTarget" value="all"/>
          </div>
          <button class="btn btn-primary" style="width:100%;justify-content:center;padding:12px" id="postBtn" onclick="postAnn()">
            <i class="fa-solid fa-tower-broadcast"></i> Broadcast Now
          </button>
        </div>
      </div>

      <!-- History -->
      <div class="card">
        <div class="card-hd"><h3><i class="fa-solid fa-clock-rotate-left"></i> Published Announcements</h3><button class="btn btn-ghost btn-sm" onclick="loadAnns()"><i class="fa-solid fa-rotate-right"></i></button></div>
        <div class="card-bd" style="display:flex;flex-direction:column;gap:12px;max-height:520px;overflow-y:auto" id="annList">
          <div class="empty"><i class="fa-solid fa-spinner fa-spin"></i><p>Loading…</p></div>
        </div>
      </div>
    </div>
  </main>
</div>
<div id="toastWrap"></div>
<script src="admin-shared.js"></script>
<script>
document.getElementById("sidebar").innerHTML = SIDEBAR_HTML;
var activeTarget = "all";

window.onload = async function(){
  var ok = await requireAdmin(); if(!ok) return;
  initSidebar();
  loadAnns();
};

function setTarget(t, btn){
  activeTarget = t;
  document.getElementById("annTarget").value = t;
  document.querySelectorAll(".target-pill").forEach(function(b){ b.classList.remove("active"); });
  btn.classList.add("active");
}

async function postAnn(){
  var title   = document.getElementById("annTitle").value.trim();
  var content = document.getElementById("annContent").value.trim();
  var target  = activeTarget;
  if(!title||!content){ showToast("Title and message are required","error"); return; }

  var btn = document.getElementById("postBtn");
  btn.disabled=true; btn.innerHTML='<i class="fa-solid fa-spinner fa-spin"></i> Broadcasting…';

  var res = await db.from("announcements").insert({
    title, content,
    posted_by: adminProfile.id,
    target_role: target
  });

  btn.disabled=false; btn.innerHTML='<i class="fa-solid fa-tower-broadcast"></i> Broadcast Now';
  if(res.error){ showToast("Failed: "+res.error.message,"error"); return; }
  showToast("Announcement published!","success");
  document.getElementById("annTitle").value="";
  document.getElementById("annContent").value="";
  loadAnns();
}

async function loadAnns(){
  var el = document.getElementById("annList");
  var res = await db.from("announcements").select("*,profiles:posted_by(full_name)").order("created_at",{ascending:false});
  var data = res.data||[];
  if(!data.length){
    el.innerHTML='<div class="empty"><i class="fa-solid fa-inbox"></i><p>No announcements yet</p></div>'; return;
  }
  var TARGET_LABELS={ all:"All Users", student:"Students", faculty:"Faculty", hod:"HOD" };
  var TARGET_BADGE={ all:"b-orange", student:"b-student", faculty:"b-faculty", hod:"b-hod" };
  el.innerHTML = data.map(function(a){
    var poster = Array.isArray(a.profiles)?a.profiles[0]:a.profiles;
    var content = (a.content||"").split("::SIGN::")[0];
    return '<div class="ann-card">'
      +'<div style="display:flex;align-items:start;justify-content:space-between;gap:10px">'
      +'<div class="ann-title">'+a.title+'</div>'
      +'<button class="btn btn-danger btn-xs" onclick="deleteAnn(\''+a.id+'\')"><i class="fa-solid fa-trash"></i></button>'
      +'</div>'
      +'<div class="ann-content">'+content+'</div>'
      +'<div class="ann-meta">'
      +'<span class="badge '+(TARGET_BADGE[a.target_role]||"b-orange")+'"><i class="fa-solid fa-users"></i> '+(TARGET_LABELS[a.target_role]||"All")+'</span>'
      +'<span>By '+(poster?poster.full_name:"Admin")+'</span>'
      +'<span>'+fmtDate(a.created_at)+'</span>'
      +'</div></div>';
  }).join("");
}

async function deleteAnn(id){
  if(!confirm("Delete this announcement permanently?")) return;
  var res = await db.from("announcements").delete().eq("id",id);
  if(res.error){ showToast("Failed: "+res.error.message,"error"); return; }
  showToast("Announcement deleted","info"); loadAnns();
}
</script>
</body>
</html>
