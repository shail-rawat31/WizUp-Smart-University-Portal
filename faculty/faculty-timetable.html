<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>My Timetable – WizUP Faculty</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="faculty-shared.css"/>
<style>
.day-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.day-tab{padding:8px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.09);background:none;color:#8892b0;cursor:pointer;font-size:12px;font-weight:700;transition:.2s;font-family:'Inter',sans-serif}
.day-tab.active{background:rgba(229,56,59,.15);border-color:rgba(229,56,59,.4);color:#fca5a5}
.day-tab.today{border-color:rgba(34,197,94,.4);color:#86efac}
.day-tab.today.active{background:rgba(34,197,94,.15)}
.slot{padding:18px 20px;border-radius:14px;margin-bottom:12px;border:1px solid rgba(255,255,255,.07);background:rgba(0,0,0,.2);position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;transition:.2s}
.slot:hover{border-color:rgba(229,56,59,.3);background:rgba(229,56,59,.05)}
.slot.current{border-color:rgba(229,56,59,.5);background:rgba(229,56,59,.08)}
.slot-time{font-family:'Outfit',sans-serif;font-size:15px;font-weight:800;min-width:110px;color:#fca5a5}
.slot-body{flex:1}
.slot-subject{font-size:16px;font-weight:700;margin-bottom:3px}
.slot-room{font-size:12px;color:#8892b0}
.slot-badge{padding:4px 10px;border-radius:99px;font-size:10px;font-weight:700;background:rgba(229,56,59,.15);color:#fca5a5;border:1px solid rgba(229,56,59,.3)}
.free-slot{text-align:center;padding:16px;color:rgba(255,255,255,.25);font-size:13px;border:1px dashed rgba(255,255,255,.08);border-radius:14px;margin-bottom:12px}
/* Weekly overview table */
.tt-week{width:100%;border-collapse:collapse;font-size:12px}
.tt-week th{padding:10px 12px;background:rgba(0,0,0,.3);color:#8892b0;font-size:10px;text-transform:uppercase;letter-spacing:.8px;border-bottom:1px solid rgba(255,255,255,.08);text-align:left}
.tt-week td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.04);vertical-align:top}
.tt-week tr:hover td{background:rgba(229,56,59,.03)}
.tt-pill{display:inline-block;padding:4px 10px;border-radius:8px;font-size:11px;font-weight:700;background:rgba(229,56,59,.15);color:#fca5a5;border:1px solid rgba(229,56,59,.25);margin:2px}
</style>
</head>
<body>
<header class="header">
  <img src="../assets/images/LOGO1.png" alt="WizUP" class="logo"/>
  <div class="h-search"><i class="fa-solid fa-magnifying-glass"></i><input type="text" placeholder="Search schedule…"/></div>
  <div class="h-actions">
    <div id="clock" style="font-family:'Outfit',sans-serif;font-weight:800;font-size:17px;color:#e5383b;margin-right:6px">00:00</div>
    <a href="faculty-dashboard.html" class="h-btn"><i class="fa-solid fa-house"></i></a>
    <a href="faculty-notifications.html" class="h-btn"><i class="fa-solid fa-bell"></i></a>
    <div class="user-profile"><div class="up-avatar" id="uAvatar">F</div><div class="up-info"><span class="up-name" id="uName">Faculty</span><span class="up-role">Faculty Hub</span></div></div>
    <button class="h-btn" onclick="doSignOut()"><i class="fa-solid fa-right-from-bracket"></i></button>
  </div>
</header>
<div class="main-container">
  <aside class="sidebar">
    <div class="sidebar-section open"><div class="sidebar-header">ATTENDANCE<i class="fa-solid fa-chevron-down ch"></i></div><div class="sidebar-menu"><a href="faculty-attendance.html">Mark Attendance</a></div></div>
    <div class="sidebar-section open"><div class="sidebar-header">ACADEMICS<i class="fa-solid fa-chevron-down ch"></i></div><div class="sidebar-menu"><a href="faculty-timetable.html" class="active">My Timetable</a><a href="faculty-marks.html">Internal Marks</a><a href="faculty-assignments.html">Assignments</a><a href="faculty-subjects.html">Course Materials</a></div></div>
    <div class="sidebar-section open"><div class="sidebar-header">STUDENTS<i class="fa-solid fa-chevron-down ch"></i></div><div class="sidebar-menu"><a href="faculty-students.html">Student Monitoring</a><a href="faculty-leave-approvals.html">Leave Approvals</a></div></div>
    <div class="sidebar-section"><div class="sidebar-header">PERSONAL<i class="fa-solid fa-chevron-down ch"></i></div><div class="sidebar-menu"><a href="faculty-profile.html">My Profile</a><a href="faculty-leave.html">Apply Leave</a></div></div>
  </aside>
  <main class="content">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
      <h2 style="font-family:'Outfit',sans-serif;font-size:26px;font-weight:900;display:flex;align-items:center;gap:10px"><i class="fa-regular fa-calendar-days" style="color:#e5383b"></i> My Timetable</h2>
      <a href="faculty-dashboard.html" style="color:#8892b0;text-decoration:none;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
    </div>

    <div class="card">
      <div class="card-hd"><h3><i class="fa-solid fa-calendar-day" style="color:#fca5a5"></i> Daily View</h3><span style="font-size:12px;color:#8892b0" id="todayDateLabel"></span></div>
      <div class="card-bd">
        <div class="day-tabs" id="dayTabs"></div>
        <div id="daySlots"></div>
      </div>
    </div>

    <div class="card">
      <div class="card-hd"><h3><i class="fa-solid fa-table-cells" style="color:#fca5a5"></i> Weekly Overview</h3></div>
      <div class="card-bd" style="padding:0;overflow-x:auto">
        <table class="tt-week" id="weekTable">
          <thead><tr><th>Time</th><th>Monday</th><th>Tuesday</th><th>Wednesday</th><th>Thursday</th><th>Friday</th></tr></thead>
          <tbody id="weekBody"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>
<div id="toast-wrap"></div>
<script src="faculty-shared.js"></script>
<script>
const DAYS_FULL=["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const DAYS_SHORT=["Mon","Tue","Wed","Thu","Fri"];
const TIMETABLE={
  Monday:[{time:"09:00–10:00",subject:"Java Programming",room:"Lab 3",code:"MCA201"},{time:"11:00–12:00",subject:"Software Engineering",room:"Room 201",code:"MCA203"}],
  Tuesday:[{time:"09:00–10:00",subject:"Deep Learning",room:"Room 301",code:"MCA205"},{time:"02:00–03:00",subject:"Java Programming",room:"Lab 3",code:"MCA201"}],
  Wednesday:[{time:"10:00–11:00",subject:"Java Programming",room:"Lab 2",code:"MCA201"},{time:"12:00–01:00",subject:"Software Engineering",room:"Room 201",code:"MCA203"}],
  Thursday:[{time:"11:00–12:00",subject:"Software Engineering",room:"Room 201",code:"MCA203"}],
  Friday:[{time:"09:00–10:00",subject:"Java Programming",room:"Lab 3",code:"MCA201"},{time:"11:00–12:00",subject:"Deep Learning",room:"Room 301",code:"MCA205"}],
};

let activeDay=null;

document.addEventListener("DOMContentLoaded",async()=>{
  await requireAuth(["faculty","hod"]);
  const todayName=DAYS_FULL[new Date().getDay()];
  activeDay=todayName in TIMETABLE?todayName:"Monday";
  document.getElementById("todayDateLabel").textContent=new Date().toDateString();
  renderDayTabs();renderDaySlots();renderWeek();
});

function renderDayTabs(){
  const container=document.getElementById("dayTabs");
  const todayName=DAYS_FULL[new Date().getDay()];
  container.innerHTML=Object.keys(TIMETABLE).map(day=>`<button class="day-tab ${day===todayName?"today":""} ${day===activeDay?"active":""}" onclick="switchDay('${day}')">${day.substring(0,3)} <span style="font-size:9px;opacity:.7">(${TIMETABLE[day].length})</span></button>`).join("");
}

function switchDay(day){activeDay=day;renderDayTabs();renderDaySlots();}

function renderDaySlots(){
  const el=document.getElementById("daySlots");
  const slots=TIMETABLE[activeDay]||[];
  const todayName=DAYS_FULL[new Date().getDay()];
  if(!slots.length){el.innerHTML=`<div class="free-slot"><i class="fa-regular fa-circle" style="display:block;font-size:24px;margin-bottom:8px;opacity:.3"></i>No classes scheduled</div>`;return;}
  el.innerHTML=slots.map(s=>`<div class="slot ${activeDay===todayName?"current":""}">
    <div class="slot-time">${s.time}</div>
    <div class="slot-body">
      <div class="slot-subject">${s.subject}</div>
      <div class="slot-room"><i class="fa-solid fa-location-dot" style="margin-right:4px"></i>${s.room}</div>
    </div>
    <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px">
      <span class="slot-badge">${s.code}</span>
      <a href="faculty-attendance.html" style="font-size:11px;color:#86efac;font-weight:700;text-decoration:none"><i class="fa-solid fa-clipboard-check" style="margin-right:4px"></i>Mark Attendance</a>
    </div>
  </div>`).join("");
}

function renderWeek(){
  const TIMES=["09:00","10:00","11:00","12:00","02:00","03:00"];
  document.getElementById("weekBody").innerHTML=TIMES.map(t=>`<tr><td style="color:#8892b0;font-weight:700;white-space:nowrap">${t}</td>${["Monday","Tuesday","Wednesday","Thursday","Friday"].map(day=>{
    const slot=(TIMETABLE[day]||[]).find(s=>s.time.startsWith(t));
    return`<td>${slot?`<span class="tt-pill">${slot.subject.split(" ")[0]}<br><span style="font-size:9px;font-weight:400">${slot.room}</span></span>`:`<span style="color:rgba(255,255,255,.2);font-size:11px">—</span>`}</td>`;
  }).join("")}</tr>`).join("");
}
</script>
</body>
</html>
