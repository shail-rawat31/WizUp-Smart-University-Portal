<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>My Timetable - WizUP Faculty</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/premium-dashboard.css" />
    <style>
        body { margin: 0; background-color: #050505; color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .topbar { display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; background: rgba(5, 5, 8, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0, 230, 118, 0.2); position: sticky; top: 0; z-index: 100; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand i { font-size: 28px; color: #00e676; text-shadow: 0 0 15px rgba(0,230,118,0.5); }
        .brand h1 { font-family: 'Outfit'; font-size: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .back-btn { color: #00e676; text-decoration: none; font-size: 13px; font-weight: 700; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .back-btn:hover { color: #fff; transform: translateX(-5px); }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .page-title { font-family: 'Outfit'; font-size: 32px; font-weight: 900; margin-bottom: 30px; display: flex; align-items: center; gap: 12px; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
        .data-table { width: 100%; border-collapse: collapse; text-align: left; }
        .data-table th { padding: 15px 20px; color: #8892b0; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .data-table td { padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; color: #e2e8f0; }
        .data-table tr:hover td { background: rgba(0, 230, 118, 0.05); }
        
        .slot { padding: 16px; border-radius: 12px; margin-bottom: 16px; position:relative; overflow:hidden; } .slot.active { background: rgba(0,210,255,0.15); border: 1px solid rgba(0,210,255,0.4); }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="brand"><i class="fa-regular fa-calendar"></i><h1>WizUP Faculty Hub</h1></div>
        <a href="faculty-dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Hub</a>
    </div>
    <div class="container">
        <h2 class="page-title"><i class="fa-regular fa-calendar" style="color: #00e676;"></i> My Timetable</h2>
        <div class="card" style="padding: 0;">
            <div style="display:flex; justify-content:space-between; padding: 20px; border-bottom: 1px solid rgba(255,255,255,0.1);">
                <h3 style="margin:0; font-family:'Outfit';">Monday, April 5</h3>
                <button style="padding: 8px 16px;">Change Day</button>
            </div>
            <div style="padding: 30px;">
                <div class="slot active">
                    <h4 style="margin:0 0 5px; font-size:18px; color:#00d2ff; font-family:'Outfit';">09:00 AM - 10:30 AM</h4>
                    <p style="margin:0; font-size:14px; font-weight:700;">Object Oriented Programming <span style="font-size:11px; color:#889; font-weight:400;">(MCA Sem 1)</span></p>
                    <p style="margin:5px 0 0; font-size:12px; color:#ccc;">Room 402 - Main Block</p>
                </div>
                <div class="slot" style="background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);">
                    <h4 style="margin:0 0 5px; font-size:18px; color:#fff; font-family:'Outfit';">11:00 AM - 12:30 PM</h4>
                    <p style="margin:0; font-size:14px; font-weight:700;">Data Structures Lab <span style="font-size:11px; color:#889; font-weight:400;">(MCA Sem 2)</span></p>
                    <p style="margin:5px 0 0; font-size:12px; color:#ccc;">Computer Lab A</p>
                </div>
            </div>
        </div>
    </div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", async () => {
        // Enforce DB role requirement preventing unauthorized navigation
        await requireAuth(['faculty']);
    });
</script>

</body>
</html>
