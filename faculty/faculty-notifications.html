<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Notifications – WizUP Faculty</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="faculty-shared.css"/>
<style>
.notif-item{display:flex;align-items:flex-start;gap:14px;padding:16px;border:1px solid rgba(255,255,255,.07);border-radius:14px;background:rgba(0,0,0,.2);margin-bottom:10px;transition:.2s;cursor:pointer;position:relative}
.notif-item:hover{border-color:rgba(229,56,59,.25);background:rgba(229,56,59,.04)}
.notif-item.unread{border-left:3px solid #e5383b}
.notif-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.notif-title{font-size:14px;font-weight:700;margin-bottom:3px}
.notif-body{font-size:12px;color:rgba(255,255,255,.6);line-height:1.5}
.notif-meta{font-size:11px;color:#8892b0;margin-top:5px;display:flex;align-items:center;gap:6px}
.unread-dot{width:8px;height:8px;border-radius:50%;background:#e5383b;position:absolute;top:16px;right:16px;flex-shrink:0}
.filter-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-tab{padding:6px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:none;color:#8892b0;cursor:pointer;font-size:12px;font-weight:700;transition:.2s;font-family:'Inter',sans-serif}
.filter-tab.active{background:rgba(229,56,59,.12);border-color:rgba(229,56,59,.35);color:#fca5a5}
</style>
</head>
<body>
<header class="header">
  <img src="../assets/images/LOGO1.png" alt="WizUP" class="logo"/>
  <div class="h-search"><i class="fa-solid fa-magnifying-glass"></i><input type="text" placeholder="Search notifications…" oninput="searchNotifs(this.value)"/></div>
  <div class="h-actions">
    <div id="clock" style="font-family:'Outfit',sans-serif;font-weight:800;font-size:17px;color:#e5383b;margin-right:6px">00:00</div>
    <a href="faculty-dashboard.html" class="h-btn"><i class="fa-solid fa-house"></i></a>
    <div class="user-profile"><div class="up-avatar" id="uAvatar">F</div><div class="up-info"><span class="up-name" id="uName">Faculty</span><span class="up-role">Faculty Hub</span></div></div>
    <button class="h-btn" onclick="doSignOut()"><i class="fa-solid fa-right-from-bracket"></i></button>
  </div>
</header>
<div class="main-container">
  <aside class="sidebar">
    <div class="sidebar-section open"><div class="sidebar-header">ATTENDANCE<i class="fa-solid fa-chevron-down ch"></i></div><div class="sidebar-menu"><a href="faculty-attendance.html">Mark Attendance</a></div></div>
    <div class="sidebar-section open"><div class="sidebar-header">ACADEMICS<i class="fa-solid fa-chevron-down ch"></i></div><div class="sidebar-menu"><a href="faculty-timetable.html">My Timetable</a><a href="faculty-marks.html">Internal Marks</a><a href="faculty-assignments.html">Assignments</a><a href="faculty-subjects.html">Courses Assigned</a></div></div>
    <div class="sidebar-section open"><div class="sidebar-header">STUDENTS<i class="fa-solid fa-chevron-down ch"></i></div><div class="sidebar-menu"><a href="faculty-students.html">Student Monitoring</a></div></div>
    <div class="sidebar-section open"><div class="sidebar-header">INSIGHTS<i class="fa-solid fa-chevron-down ch"></i></div><div class="sidebar-menu"><a href="faculty-analytics.html">Analytics</a></div></div>
    <div class="sidebar-section open"><div class="sidebar-header">PERSONAL<i class="fa-solid fa-chevron-down ch"></i></div><div class="sidebar-menu"><a href="faculty-profile.html">My Profile</a><a href="faculty-leave.html">Apply Leave</a><a href="faculty-notifications.html">Notifications</a></div></div>
  </aside>
  <main class="content">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
      <h2 style="font-family:'Outfit',sans-serif;font-size:26px;font-weight:900;display:flex;align-items:center;gap:10px">
        <i class="fa-solid fa-bell" style="color:#e5383b"></i> Notifications
        <span id="unreadBadge" style="font-family:'Inter';font-size:13px;background:#e5383b;padding:3px 10px;border-radius:99px;vertical-align:middle;display:none"></span>
      </h2>
      <button class="btn btn-outline btn-sm" onclick="markAllRead()"><i class="fa-solid fa-check-double"></i> Mark all read</button>
    </div>

    <div class="filter-tabs">
      <button class="filter-tab active" onclick="filterNotifs('all',this)">All</button>
      <button class="filter-tab" onclick="filterNotifs('leave',this)">Leave</button>
      <button class="filter-tab" onclick="filterNotifs('academic',this)">Academic</button>
      <button class="filter-tab" onclick="filterNotifs('admin',this)">Admin</button>
      <button class="filter-tab" onclick="filterNotifs('alert',this)">Alerts</button>
    </div>

    <div id="notifList"><div style="text-align:center;padding:32px;color:#8892b0"><i class="fa-solid fa-spinner fa-spin" style="font-size:24px;display:block;margin-bottom:12px"></i>Loading notifications…</div></div>
  </main>
</div>
<div id="toast-wrap"></div>
<script src="faculty-shared.js"></script>
<script>
// LOCAL_NOTIFS: always shown as a curated set of relevant faculty notifications
var LOCAL_NOTIFS = [
  {id:"l1",type:"leave",icon:"fa-solid fa-calendar-check",iconBg:"rgba(34,197,94,.15)",iconColor:"#86efac",title:"Leave Request Approved",body:"Your Casual Leave application (15–16 Jan) has been approved by HOD.",time:"2 hours ago",unread:true},
  {id:"l2",type:"alert",icon:"fa-solid fa-triangle-exclamation",iconBg:"rgba(239,68,68,.15)",iconColor:"#fca5a5",title:"Attendance Deadline Reminder",body:"Attendance for today's session is still pending. Please mark before 5 PM.",time:"3 hours ago",unread:true},
  {id:"l3",type:"academic",icon:"fa-solid fa-star",iconBg:"rgba(245,158,11,.15)",iconColor:"#fcd34d",title:"Marks Submission Deadline",body:"Internal marks (MST) must be uploaded by 20th April 2026.",time:"1 day ago",unread:true},
  {id:"l4",type:"admin",icon:"fa-solid fa-building-columns",iconBg:"rgba(56,189,248,.15)",iconColor:"#7dd3fc",title:"Faculty Senate Meeting",body:"Monthly faculty meeting scheduled for 10 April 2026 at 11 AM.",time:"2 days ago",unread:false},
  {id:"l5",type:"academic",icon:"fa-solid fa-book",iconBg:"rgba(167,139,250,.15)",iconColor:"#c4b5fd",title:"Syllabus Revision Notice",body:"Curriculum updated for next batch. Please review the revised syllabus.",time:"4 days ago",unread:false},
  {id:"l6",type:"admin",icon:"fa-solid fa-award",iconBg:"rgba(34,197,94,.15)",iconColor:"#86efac",title:"Best Faculty Nomination Open",body:"Nominations for Best Faculty Award 2025–26 are open till 15th April.",time:"5 days ago",unread:false}
];

var allNotifs = LOCAL_NOTIFS.slice();
var readSet = new Set(JSON.parse(localStorage.getItem("wizup.fac.readNotifs")||"[]"));
var activeType = "all";
var searchQ = "";

document.addEventListener("DOMContentLoaded", async function(){
  var prof = await requireAuth(["faculty","hod"]);
  if(!prof) return;

  // Fetch DB notifications addressed to this user
  var res = await db.from("notifications").select("*").eq("user_id", prof.id).order("created_at", {ascending:false}).limit(30);
  if(res.data && res.data.length){
    var dbNotifs = res.data.map(function(n){
      return {
        id:"db_"+n.id,
        type:"admin",
        icon:"fa-solid fa-bell",
        iconBg:"rgba(56,189,248,.15)",
        iconColor:"#7dd3fc",
        title:"System Notification",
        body:n.message,
        time:fmtDate(n.created_at),
        unread:!n.is_read
      };
    });
    allNotifs = dbNotifs.concat(LOCAL_NOTIFS);
  }

  // Also fetch system-wide announcements targeting faculty
  var annRes = await db.from("announcements").select("*").in("target_role",["faculty","all"]).order("created_at",{ascending:false}).limit(10);
  if(annRes.data && annRes.data.length){
    var annNotifs = annRes.data.map(function(a){
      return {
        id:"ann_"+a.id,
        type:"academic",
        icon:"fa-solid fa-bullhorn",
        iconBg:"rgba(245,158,11,.15)",
        iconColor:"#fcd34d",
        title:a.title,
        body:a.content,
        time:fmtDate(a.created_at),
        unread:true
      };
    });
    allNotifs = annNotifs.concat(allNotifs);
  }

  render();

  // Real-time subscription to personal notifications
  db.channel("faculty_notifs_"+prof.id)
    .on("postgres_changes", {event:"INSERT", schema:"public", table:"notifications", filter:"user_id=eq."+prof.id}, function(payload){
      var n = payload.new;
      allNotifs.unshift({
        id:"db_"+n.id,
        type:"admin",
        icon:"fa-solid fa-bell",
        iconBg:"rgba(56,189,248,.15)",
        iconColor:"#7dd3fc",
        title:"New Notification",
        body:n.message,
        time:"Just now",
        unread:true
      });
      render();
      showToast("New notification received", "info");
    })
    .subscribe();
});

function filterNotifs(type, btn){
  activeType = type;
  document.querySelectorAll(".filter-tab").forEach(function(b){ b.classList.remove("active"); });
  btn.classList.add("active");
  render();
}

function searchNotifs(q){ searchQ = q.toLowerCase(); render(); }

function markAllRead(){
  allNotifs.forEach(function(n){ readSet.add(n.id); });
  localStorage.setItem("wizup.fac.readNotifs", JSON.stringify([...readSet]));
  render();
}

function markRead(id, el){
  readSet.add(id);
  localStorage.setItem("wizup.fac.readNotifs", JSON.stringify([...readSet]));
  if(el){ el.classList.remove("unread"); var dot=el.querySelector(".unread-dot"); if(dot) dot.remove(); }
  render();
}

function render(){
  var filtered = activeType==="all" ? allNotifs : allNotifs.filter(function(n){ return n.type===activeType; });
  if(searchQ) filtered = filtered.filter(function(n){ return n.title.toLowerCase().includes(searchQ)||n.body.toLowerCase().includes(searchQ); });
  var unread = filtered.filter(function(n){ return !readSet.has(n.id); }).length;
  var ub = document.getElementById("unreadBadge");
  ub.style.display = unread>0?"inline-flex":"none";
  ub.textContent = unread;

  if(!filtered.length){
    document.getElementById("notifList").innerHTML = '<div style="text-align:center;padding:40px;color:#8892b0"><i class="fa-solid fa-bell-slash" style="font-size:32px;display:block;margin-bottom:12px;opacity:.4"></i>No notifications here</div>';
    return;
  }

  document.getElementById("notifList").innerHTML = filtered.map(function(n){
    var unreadClass = !readSet.has(n.id) ? "unread" : "";
    var dot = !readSet.has(n.id) ? '<div class="unread-dot"></div>' : "";
    return '<div class="notif-item '+unreadClass+'" onclick="markRead(\''+n.id+'\',this)">'
      +'<div class="notif-icon" style="background:'+n.iconBg+'"><i class="'+n.icon+'" style="color:'+n.iconColor+'"></i></div>'
      +'<div style="flex:1;min-width:0">'
      +'<div class="notif-title">'+n.title+'</div>'
      +'<div class="notif-body">'+n.body+'</div>'
      +'<div class="notif-meta"><i class="fa-regular fa-clock"></i>'+n.time+'</div>'
      +'</div>'
      +dot
      +'</div>';
  }).join("");
}
</script>
</body>
</html>
