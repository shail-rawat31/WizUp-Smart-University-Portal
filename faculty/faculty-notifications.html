<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Notifications – WizUP Faculty</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="faculty-shared.css"/>
<style>
.notif-item{display:flex;align-items:flex-start;gap:14px;padding:16px;border:1px solid rgba(255,255,255,.07);border-radius:14px;background:rgba(0,0,0,.2);margin-bottom:10px;transition:.2s;cursor:pointer;position:relative}
.notif-item:hover{border-color:rgba(229,56,59,.25);background:rgba(229,56,59,.04)}
.notif-item.unread{border-left:3px solid #e5383b}
.notif-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.notif-title{font-size:14px;font-weight:700;margin-bottom:3px}
.notif-body{font-size:12px;color:rgba(255,255,255,.6);line-height:1.5}
.notif-meta{font-size:11px;color:#8892b0;margin-top:5px;display:flex;align-items:center;gap:8px}
.unread-dot{width:8px;height:8px;border-radius:50%;background:#e5383b;position:absolute;top:16px;right:16px}
.filter-tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.filter-tab{padding:6px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.08);background:none;color:#8892b0;cursor:pointer;font-size:12px;font-weight:700;transition:.2s;font-family:'Inter',sans-serif}
.filter-tab.active{background:rgba(229,56,59,.12);border-color:rgba(229,56,59,.35);color:#fca5a5}
</style>
</head>
<body>
<header class="header">
  <img src="../assets/images/LOGO1.png" alt="WizUP" class="logo"/>
  <div class="h-search"><i class="fa-solid fa-magnifying-glass"></i><input type="text" placeholder="Search notifications…"/></div>
  <div class="h-actions">
    <div id="clock" style="font-family:'Outfit',sans-serif;font-weight:800;font-size:17px;color:#e5383b;margin-right:6px">00:00</div>
    <a href="faculty-dashboard.html" class="h-btn"><i class="fa-solid fa-house"></i></a>
    <div class="user-profile"><div class="up-avatar" id="uAvatar">F</div><div class="up-info"><span class="up-name" id="uName">Faculty</span><span class="up-role">Faculty Hub</span></div></div>
    <button class="h-btn" onclick="doSignOut()"><i class="fa-solid fa-right-from-bracket"></i></button>
  </div>
</header>
<div class="main-container">
  <aside class="sidebar">
    <div class="sidebar-section open"><div class="sidebar-header">PERSONAL<i class="fa-solid fa-chevron-down ch"></i></div><div class="sidebar-menu"><a href="faculty-profile.html">My Profile</a><a href="faculty-leave.html">Apply Leave</a><a href="faculty-notifications.html" class="active">Notifications</a></div></div>
    <div class="sidebar-section"><div class="sidebar-header">ACADEMICS<i class="fa-solid fa-chevron-down ch"></i></div><div class="sidebar-menu"><a href="faculty-attendance.html">Attendance</a><a href="faculty-marks.html">Marks</a></div></div>
  </aside>
  <main class="content">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
      <h2 style="font-family:'Outfit',sans-serif;font-size:26px;font-weight:900;display:flex;align-items:center;gap:10px">
        <i class="fa-solid fa-bell" style="color:#e5383b"></i>
        Notifications
        <span id="unreadBadge" style="font-family:'Inter';font-size:13px;background:#e5383b;padding:3px 10px;border-radius:99px;vertical-align:middle;display:none"></span>
      </h2>
      <button class="btn btn-outline btn-sm" onclick="markAllRead()"><i class="fa-solid fa-check-double"></i> Mark all read</button>
    </div>

    <div class="filter-tabs">
      <button class="filter-tab active" onclick="filterNotifs('all',this)">All</button>
      <button class="filter-tab" onclick="filterNotifs('leave',this)">Leave</button>
      <button class="filter-tab" onclick="filterNotifs('academic',this)">Academic</button>
      <button class="filter-tab" onclick="filterNotifs('admin',this)">Admin</button>
      <button class="filter-tab" onclick="filterNotifs('alert',this)">Alerts</button>
    </div>

    <div id="notifList"></div>
  </main>
</div>
<div id="toast-wrap"></div>
<script src="faculty-shared.js"></script>
<script>
const NOTIFS=[
  {id:1,type:"leave",icon:"fa-solid fa-calendar-check",iconBg:"rgba(34,197,94,.15)",iconColor:"#86efac",title:"Leave Request Approved",body:"Your Casual Leave application (15–16 Jan) has been approved by HOD Dr. Rajan Kumar.",time:"2 hours ago",unread:true},
  {id:2,type:"alert",icon:"fa-solid fa-triangle-exclamation",iconBg:"rgba(239,68,68,.15)",iconColor:"#fca5a5",title:"Attendance Not Marked — CS101",body:"Attendance for today's 9 AM Java Programming class is still pending. Please mark before 5 PM.",time:"3 hours ago",unread:true},
  {id:3,type:"academic",icon:"fa-solid fa-star",iconBg:"rgba(245,158,11,.15)",iconColor:"#fcd34d",title:"Marks Submission Deadline",body:"Internal marks (MST) for CS201 must be uploaded by 20th April 2026. 12 students pending.",time:"1 day ago",unread:true},
  {id:4,type:"admin",icon:"fa-solid fa-building-columns",iconBg:"rgba(56,189,248,.15)",iconColor:"#7dd3fc",title:"Faculty Senate Meeting",body:"Monthly faculty meeting scheduled for 10 April 2026 at 11 AM in the Conference Hall.",time:"2 days ago",unread:false},
  {id:5,type:"leave",icon:"fa-solid fa-clock",iconBg:"rgba(245,158,11,.15)",iconColor:"#fcd34d",title:"New Leave Request — Arjun Sharma",body:"Student Arjun Sharma has applied for 3-day Medical Leave (10–12 Apr). Awaiting your approval.",time:"3 days ago",unread:false},
  {id:6,type:"academic",icon:"fa-solid fa-book",iconBg:"rgba(167,139,250,.15)",iconColor:"#c4b5fd",title:"Syllabus Revision Notice",body:"The CS301 curriculum has been updated for the next batch. Please review the revised syllabus document.",time:"4 days ago",unread:false},
  {id:7,type:"admin",icon:"fa-solid fa-award",iconBg:"rgba(34,197,94,.15)",iconColor:"#86efac",title:"Best Faculty Nomination Open",body:"Nominations for 'Best Faculty Award 2025–26' are open. Students can vote till 15th April.",time:"5 days ago",unread:false},
];
let readSet=new Set(JSON.parse(localStorage.getItem("wizup.fac.readNotifs")||"[]"));
let activeType="all";

function filterNotifs(type,btn){
  activeType=type;
  document.querySelectorAll(".filter-tab").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  render();
}

function markAllRead(){
  NOTIFS.forEach(n=>readSet.add(n.id));
  localStorage.setItem("wizup.fac.readNotifs",JSON.stringify([...readSet]));
  render();
}

function render(){
  const filtered=activeType==="all"?NOTIFS:NOTIFS.filter(n=>n.type===activeType);
  const unread=filtered.filter(n=>!readSet.has(n.id)).length;
  const ub=document.getElementById("unreadBadge");
  ub.style.display=unread>0?"inline-flex":"none";
  ub.textContent=unread;
  document.getElementById("notifList").innerHTML=filtered.map(n=>`
  <div class="notif-item ${!readSet.has(n.id)?"unread":""}" onclick="markRead(${n.id};this)">
    <div class="notif-icon" style="background:${n.iconBg}"><i class="${n.icon}" style="color:${n.iconColor}"></i></div>
    <div style="flex:1;min-width:0">
      <div class="notif-title">${n.title}</div>
      <div class="notif-body">${n.body}</div>
      <div class="notif-meta"><i class="fa-regular fa-clock"></i>${n.time}</div>
    </div>
    ${!readSet.has(n.id)?'<div class="unread-dot"></div>':""}
  </div>`).join("").replace(/onclick="markRead\((\d+);/g,'onclick="markRead($1,');
}

function markRead(id,el){
  readSet.add(id);
  localStorage.setItem("wizup.fac.readNotifs",JSON.stringify([...readSet]));
  if(el){el.classList.remove("unread");const dot=el.querySelector(".unread-dot");if(dot)dot.remove();}
  render();
}

document.addEventListener("DOMContentLoaded",async()=>{
  await requireAuth(["faculty","hod"]);
  // Pull live announcements and prepend
  const {data:anns}=await db.from("announcements").select("*").order("created_at",{ascending:false}).limit(3);
  if(anns&&anns.length){
    // They're already shown in the static list above for demo; skip duplicating
  }
  render();
});
</script>
</body>
</html>
