<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Student Monitoring - WizUP Faculty</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/premium-dashboard.css" />
    <style>
        body { margin: 0; background-color: #050505; color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .topbar { display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; background: rgba(5, 5, 8, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0, 230, 118, 0.2); position: sticky; top: 0; z-index: 100; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand i { font-size: 28px; color: #00e676; text-shadow: 0 0 15px rgba(0,230,118,0.5); }
        .brand h1 { font-family: 'Outfit'; font-size: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .back-btn { color: #00e676; text-decoration: none; font-size: 13px; font-weight: 700; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .back-btn:hover { color: #fff; transform: translateX(-5px); }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .page-title { font-family: 'Outfit'; font-size: 32px; font-weight: 900; margin-bottom: 30px; display: flex; align-items: center; gap: 12px; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
        .data-table { width: 100%; border-collapse: collapse; text-align: left; }
        .data-table th { padding: 15px 20px; color: #8892b0; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .data-table td { padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; color: #e2e8f0; }
        .data-table tr:hover td { background: rgba(0, 230, 118, 0.05); }
        
        
    </style>
</head>
<body>
    <div class="topbar">
        <div class="brand"><i class="fa-solid fa-users-viewfinder"></i><h1>WizUP Faculty Hub</h1></div>
        <a href="faculty-dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Hub</a>
    </div>
    <div class="container">
        <h2 class="page-title"><i class="fa-solid fa-users-viewfinder" style="color: #00e676;"></i> Student Monitoring</h2>
        <div class="card" style="padding: 30px;">
            <div style="margin-bottom: 20px;"><input type="text" placeholder="Search a student by name or roll number..." style="width:100%;"></div>
            <div style="border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; display:flex; gap: 20px; align-items:center;">
                <div style="width:60px; height:60px; border-radius:50%; background: #00d2ff; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:800; color:#000;">A</div>
                <div style="flex:1;">
                    <h3 style="margin:0; font-family:'Outfit';">Alice Smith</h3>
                    <p style="margin:4px 0 0; font-size:12px; color:#889;">Roll: MCA101 | Attendance: <span style="color:#00e676;">92%</span></p>
                </div>
                <button style="padding: 8px 16px; font-size:11px;">View Detailed Analytics</button>
            </div>
        </div>
    </div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", async () => {
        const fac = await requireAuth(['faculty']);
        if(!fac) return;
        const { data: stds } = await db.from('profiles').select('*').eq('role', 'student');
        
        const container = document.querySelector('.card');
        if(!container) return;
        let html = `<div style="margin-bottom: 20px;"><input type="text" id="searchStu" placeholder="Search direct students by live database name..." style="width:100%; padding:14px; border-radius:8px;"></div><div id="stuList">`;
        if(stds) {
            stds.forEach(s => {
                html += `
                <div class="stu-card" style="border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; display:flex; gap: 20px; align-items:center; margin-bottom:15px; background: rgba(0,0,0,0.2);">
                    <div style="width:50px; height:50px; border-radius:50%; background: #00d2ff; display:flex; align-items:center; justify-content:center; font-size:24px; font-weight:800; color:#000;">${s.full_name[0].toUpperCase()}</div>
                    <div style="flex:1;">
                        <h3 style="margin:0; font-family:'Outfit';">${s.full_name}</h3>
                        <p style="margin:4px 0 0; font-size:12px; color:#889;">Auth ID: ${s.id.substring(0,8)}... | Roll: ${s.roll_no || 'Not Assigned'}</p>
                    </div>
                     <button style="padding: 8px 16px; font-size:11px;" onclick="showToast('View feature syncing with DB')">View Detailed Analytics</button>
                </div>`;
            });
        }
        html += `</div>`;
        container.innerHTML = html;
        
        document.getElementById('searchStu').addEventListener('keyup', (e) => {
            const v = e.target.value.toLowerCase();
            document.querySelectorAll('.stu-card').forEach(card => {
                const text = card.innerText.toLowerCase();
                if(text.includes(v)) card.style.display = 'flex';
                else card.style.display = 'none';
            });
        });
    });
</script>

</body>
</html>
