<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Internal Marks Entry - WizUP Faculty</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/premium-dashboard.css" />
    <style>
        body { margin: 0; background-color: #050505; color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .topbar { display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; background: rgba(5, 5, 8, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0, 230, 118, 0.2); position: sticky; top: 0; z-index: 100; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand i { font-size: 28px; color: #00e676; text-shadow: 0 0 15px rgba(0,230,118,0.5); }
        .brand h1 { font-family: 'Outfit'; font-size: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .back-btn { color: #00e676; text-decoration: none; font-size: 13px; font-weight: 700; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .back-btn:hover { color: #fff; transform: translateX(-5px); }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .page-title { font-family: 'Outfit'; font-size: 32px; font-weight: 900; margin-bottom: 30px; display: flex; align-items: center; gap: 12px; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
        .data-table { width: 100%; border-collapse: collapse; text-align: left; }
        .data-table th { padding: 15px 20px; color: #8892b0; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .data-table td { padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; color: #e2e8f0; }
        .data-table tr:hover td { background: rgba(0, 230, 118, 0.05); }
        
        
    </style>
</head>
<body>
    <div class="topbar">
        <div class="brand"><i class="fa-solid fa-star"></i><h1>WizUP Faculty Hub</h1></div>
        <a href="faculty-dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Hub</a>
    </div>
    <div class="container">
        <h2 class="page-title"><i class="fa-solid fa-star" style="color: #00e676;"></i> Internal Marks Entry</h2>
        <div class="card" style="padding: 30px;">
            <div style="display: flex; gap: 20px; margin-bottom: 20px; align-items: center;">
                <select id="subjectSelect" style="flex:1; padding:12px; background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;">
                    <option value="">Loading your subjects...</option>
                </select>
                <select id="examSelect" style="flex:1; padding:12px; background: rgba(255,255,255,0.05); color: #fff; border: 1px solid rgba(255,255,255,0.2); border-radius: 8px;">
                    <option value="mst_marks">MST (Mid Semester)</option>
                    <option value="assignment_marks">Assignment</option>
                    <option value="attendance_marks">Attendance Component</option>
                </select>
                <button id="loadRosterBtn" style="padding: 12px 24px; background:#475569; color:#fff; border:none; border-radius: 8px; cursor: pointer; font-weight: bold;">Load Roster</button>
            </div>
            <table class="data-table" id="marksTable">
                <tr><th>Roll Number</th><th>Student Name</th><th>Marks Obtained</th></tr>
                <tr><td colspan="3" style="text-align:center; padding:30px; color:#889;">Select a subject and click Load Roster to view students.</td></tr>
            </table>
            <div style="text-align: right; margin-top: 20px;">
                <button id="publishMarksBtn" style="padding: 12px 30px; background: rgba(0,230,118,0.2) !important; color:#00e676 !important; border: 1px solid #00e676 !important; border-radius: 8px; cursor: pointer; font-weight: bold; transition:0.3s; display:none;">Publish Marks</button>
            </div>
        </div>
    </div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase.js"></script>

<script>
    let currentFaculty = null;
    let enrolledStudents = [];

    document.addEventListener("DOMContentLoaded", async () => {
        currentFaculty = await requireAuth(['faculty']);
        if(!currentFaculty) return;
        
        // Fetch subjects assigned to faculty
        const { data: mySubjects } = await db.from('subjects').select('id, name, subject_code').eq('faculty_id', currentFaculty.id);
        const subSelect = document.getElementById('subjectSelect');
        
        if (mySubjects && mySubjects.length > 0) {
            subSelect.innerHTML = '<option value="">-- Select Subject --</option>' + mySubjects.map(s => 
                `<option value="${s.id}">${s.name} (${s.subject_code})</option>`
            ).join('');
        } else {
            subSelect.innerHTML = '<option value="">No subjects assigned</option>';
        }

        const loadBtn = document.getElementById('loadRosterBtn');
        const pubBtn = document.getElementById('publishMarksBtn');
        const table = document.getElementById('marksTable');
        const examSelect = document.getElementById('examSelect');

        loadBtn.addEventListener('click', async () => {
            const subId = subSelect.value;
            const examType = examSelect.value;
            if (!subId) return showToast('Select a subject first', 'error');

            table.innerHTML = `<tr><td colspan="3" style="text-align:center;"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</td></tr>`;
            pubBtn.style.display = 'none';

            // Get allocations
            const { data: allocations, error } = await db.from('subject_allocations')
                .select('student_id, profiles(id, full_name, roll_no)')
                .eq('subject_id', subId);
                
            if (error) console.error("Allocations error:", error);
                
            enrolledStudents = allocations ? allocations.map(a => a.profiles) : [];

            // Get existing marks if any
            const { data: existingMarks } = await db.from('marks')
                .select('*')
                .eq('subject_id', subId)
                .eq('exam_type', examType);
                
            const marksMap = {};
            if (existingMarks) {
                existingMarks.forEach(m => marksMap[m.student_id] = m.marks_obtained);
            }
            
            // Render table
            if(enrolledStudents.length > 0) {
                const maxVal = examType === 'mst_marks' ? 30 : examType === 'assignment_marks' ? 10 : 5;
                table.innerHTML = `<tr><th>Roll Number</th><th>Student Name</th><th>Marks Obtained (Out of ${maxVal})</th></tr>`;
                
                enrolledStudents.forEach(s => {
                    const prevMark = marksMap[s.id] !== undefined ? marksMap[s.id] : '';
                    table.innerHTML += `
                    <tr class="mark-row">
                        <td style="color:#889;">${s.roll_no || 'N/A'}</td>
                        <td style="font-weight:600;">${s.full_name}</td>
                        <td><input type="number" class="mark-input" data-sid="${s.id}" placeholder="0" value="${prevMark}" max="${maxVal}" min="0" 
                            style="width: 80px; padding: 10px; border: 1px solid rgba(255,255,255,0.1); border-radius:6px; background: rgba(0,0,0,0.5); color:#00e676; font-weight:bold;"></td>
                    </tr>`;
                });
                pubBtn.style.display = 'inline-block';
            } else {
                table.innerHTML = `<tr><td colspan="3" style="text-align:center; color:#ff3366;">No students found in this course.</td></tr>`;
            }
        });

        pubBtn.addEventListener('click', async () => {
            const subId = subSelect.value;
            const examType = examSelect.value;
            if (!subId) return;

            pubBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Uploading...';
            const inputs = document.querySelectorAll('.mark-input');
            let promises = [];
            const maxVal = examType === 'mst_marks' ? 30 : examType === 'assignment_marks' ? 10 : 5;

            inputs.forEach(inp => {
                const val = inp.value;
                if(val !== '') {
                    promises.push(db.from('marks').upsert({
                        student_id: inp.getAttribute('data-sid'),
                        subject_id: subId,
                        exam_type: examType,
                        marks_obtained: parseFloat(val),
                        max_marks: maxVal
                    }, { onConflict: 'student_id,subject_id,exam_type' }));
                }
            });

            try {
                const results = await Promise.all(promises);
                const errors = results.filter(r => r.error);
                
                if (errors.length > 0) {
                    console.error("Some upserts failed:", errors);
                    showToast(`${errors.length} marks failed to save. Please try again.`, 'error');
                    pubBtn.innerHTML = 'Retry Publish';
                } else {
                    showToast(`Marks for ${examType} have been successfully published!`, 'success');
                    pubBtn.innerHTML = '<i class="fa-solid fa-check"></i> Published';
                }
            } catch (err) {
                console.error(err);
                showToast("A network error occurred. Please check your connection.", "error");
                pubBtn.innerHTML = 'Retry Publish';
            }
        });
    });
</script>

</body>
</html>
