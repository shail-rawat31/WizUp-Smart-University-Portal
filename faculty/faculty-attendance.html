<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Attendance Matrix – WizUP Faculty</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/premium-dashboard.css" />
    <style>
        :root {
            --glass: rgba(15, 23, 42, 0.7);
            --border: rgba(255, 255, 255, 0.08);
            --primary: #00e676;
            --danger: #ef4444;
            --warning: #f59e0b;
        }
        body { margin: 0; background: url("../assets/images/bg1.jpg") center/cover no-repeat fixed; color: #fff; font-family: 'Inter', sans-serif; min-height: 100vh; }
        .overlay { position: fixed; inset: 0; background: radial-gradient(circle at 60% 40%, rgba(0,0,0,0.1), rgba(0,0,0,0.9)); pointer-events: none; z-index: 0; }
        
        .topbar { display: flex; align-items: center; justify-content: space-between; padding: 15px 40px; background: rgba(0,0,0,0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand h1 { font-family: 'Outfit'; font-size: 18px; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px; margin: 0; }
        
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; position: relative; z-index: 1; }
        
        /* Header Info */
        .page-hd { text-align: left; margin-bottom: 25px; }
        .page-hd h2 { font-family: 'Outfit'; font-size: 32px; font-weight: 900; margin: 0; display: flex; align-items: center; gap: 15px; }
        .page-mode-badge { padding: 4px 12px; border-radius: 100px; font-size: 10px; font-weight: 800; background: rgba(0,230,118,0.2); color: var(--primary); text-transform: uppercase; letter-spacing: 1px; }

        /* Unified Card */
        .glass-panel { background: var(--glass); backdrop-filter: blur(24px); border: 1px solid var(--border); padding: 30px; border-radius: 28px; box-shadow: 0 24px 60px rgba(0,0,0,0.5); }
        
        /* Control Section */
        .controls { display: grid; grid-template-columns: 1fr auto; gap: 20px; margin-bottom: 30px; align-items: flex-end; }
        .input-group { display: flex; flex-direction: column; gap: 8px; }
        .input-group label { font-size: 11px; font-weight: 800; text-transform: uppercase; color: rgba(255,255,255,0.4); letter-spacing: 1px; padding-left: 4px; }
        
        select, input[type="date"] { padding: 16px; background: rgba(0,0,0,0.5); border: 1px solid var(--border); border-radius: 16px; color: #fff; font-family: inherit; font-size: 14px; transition: 0.3s; width: 100%; box-sizing: border-box; }
        select:focus, input[type="date"]:focus { border-color: var(--primary); outline: none; box-shadow: 0 0 0 4px rgba(0,230,118,0.1); }
        
        input[type="date"]:disabled { opacity: 0.5; background: rgba(255,255,255,0.02); color: rgba(255,255,255,0.6); border-color: transparent; }

        .rectify-btn { height: 50px; padding: 0 20px; background: rgba(245,158,11,0.1); border: 1px solid var(--warning); color: var(--warning); border-radius: 16px; font-family: 'Outfit'; font-weight: 800; font-size: 12px; text-transform: uppercase; cursor: pointer; transition: 0.3s; display: flex; align-items: center; gap: 8px; margin-bottom: 2px; }
        .rectify-btn:hover { background: var(--warning); color: #000; }
        .rectify-btn.active { background: var(--primary); border-color: var(--primary); color: #000; }

        /* Stats Bar */
        .live-stats { display: flex; gap: 30px; margin-bottom: 25px; padding: 15px 25px; background: rgba(255,255,255,0.03); border-radius: 18px; border: 1px solid var(--border); }
        .stat-item { display: flex; flex-direction: column; }
        .stat-val { font-family: 'Outfit'; font-size: 20px; font-weight: 900; }
        .stat-lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.5px; opacity: 0.5; }

        /* Roster */
        .roster-list { max-height: 450px; overflow-y: auto; padding-right: 10px; margin-bottom: 20px; }
        .stu-row { display: flex; align-items: center; justify-content: space-between; padding: 14px 18px; background: rgba(255,255,255,0.02); border-radius: 16px; margin-bottom: 10px; border: 1px solid transparent; transition: 0.2s; }
        .stu-row:hover { background: rgba(255,255,255,0.05); border-color: var(--border); transform: translateX(5px); }
        
        .stu-info { display: flex; flex-direction: column; }
        .stu-name { font-weight: 700; font-size: 15px; }
        .stu-roll { font-size: 11px; opacity: 0.5; }

        .btn-group { display: flex; gap: 8px; }
        .btn-att { width: 44px; height: 44px; border-radius: 14px; border: 1px solid var(--border); background: rgba(0,0,0,0.3); color: rgba(255,255,255,0.3); font-weight: 900; cursor: pointer; transition: 0.3s; }
        .btn-att.p-active { background: var(--primary) !important; color: #000 !important; border-color: var(--primary) !important; box-shadow: 0 4px 15px rgba(0,230,118,0.3); }
        .btn-att.a-active { background: var(--danger) !important; color: #fff !important; border-color: var(--danger) !important; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.3); }

        .submit-btn { width: 100%; padding: 20px; border-radius: 18px; border: none; background: linear-gradient(135deg, #00e676, #00c853); color: #000; font-family: 'Outfit'; font-weight: 900; font-size: 17px; text-transform: uppercase; cursor: pointer; box-shadow: 0 10px 40px rgba(0, 230, 118, 0.2); transition: 0.3s; display: flex; align-items: center; justify-content: center; gap: 12px; }
        .submit-btn:hover { transform: translateY(-3px); box-shadow: 0 15px 50px rgba(0, 230, 118, 0.4); }
        .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; background: #333; color: #666; }

        .empty-state { text-align: center; padding: 40px; color: rgba(255,255,255,0.3); }
        .empty-state i { font-size: 48px; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="topbar">
        <div class="brand"><i class="fa-solid fa-clipboard-check" style="color:var(--primary)"></i><h1>WizUP Portal</h1></div>
        <a href="faculty-dashboard.html" style="color:rgba(255,255,255,0.6); text-decoration:none; font-size:13px; font-weight:700;"><i class="fa-solid fa-arrow-left"></i> Hub</a>
    </div>

    <div class="container">
        <div class="page-hd">
            <h2 id="page-title">Mark Today <span class="page-mode-badge" id="mode-badge">Live</span></h2>
        </div>

        <div class="glass-panel">
            <!-- Controls -->
            <div class="controls">
                <div class="input-group">
                    <label>Assigned Subject</label>
                    <select id="subjectSelect">
                        <option value="">Fetching your roster...</option>
                    </select>
                </div>
                <button id="rectifyToggle" class="rectify-btn" title="Edit Previous Attendance">
                    <i class="fa-solid fa-calendar-day"></i> Rectify
                </button>
                <div class="input-group" id="date-group" style="display:none; grid-column: 1 / span 2;">
                    <label>Select Date for Rectification</label>
                    <input type="date" id="dateFilter" disabled>
                </div>
            </div>

            <!-- Dashboard Stats -->
            <div class="live-stats">
                <div class="stat-item"><span class="stat-lbl">Strength</span><span class="stat-val" id="stat-tot">0</span></div>
                <div class="stat-item"><span class="stat-lbl" style="color:var(--primary)">Present</span><span class="stat-val" id="stat-pre">0</span></div>
                <div class="stat-item"><span class="stat-lbl" style="color:var(--danger)">Absent</span><span class="stat-val" id="stat-abs">0</span></div>
            </div>

            <!-- Student List -->
            <div class="roster-list" id="roster-list">
                <div class="empty-state">
                    <i class="fa-solid fa-users-viewfinder"></i>
                    <p>Select a subject to begin marking register</p>
                </div>
            </div>

            <button id="submitBtn" class="submit-btn" disabled>
                <i class="fa-solid fa-cloud-arrow-up"></i> <span>Submit Register</span>
            </button>
        </div>
    </div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase.js"></script>
<script>
    let currentFaculty = null;
    let students = [];
    let attendanceMap = {};
    let isRectifyMode = false;

    document.addEventListener("DOMContentLoaded", async () => {
        // Set date to today
        document.getElementById('dateFilter').valueAsDate = new Date();

        currentFaculty = await requireAuth(['faculty', 'hod']);
        if(!currentFaculty) return;

        await loadMySubjects();

        // Listeners
        document.getElementById('subjectSelect').addEventListener('change', refreshRoster);
        document.getElementById('dateFilter').addEventListener('change', refreshRoster);
        
        document.getElementById('rectifyToggle').onclick = function() {
            isRectifyMode = !isRectifyMode;
            const group = document.getElementById('date-group');
            const picker = document.getElementById('dateFilter');
            const badge = document.getElementById('mode-badge');
            const title = document.getElementById('page-title');

            if(isRectifyMode) {
                this.classList.add('active');
                this.innerHTML = '<i class="fa-solid fa-check-circle"></i> Marking Mode';
                group.style.display = 'flex';
                picker.disabled = false;
                badge.textContent = "Rectify";
                badge.style.background = "rgba(245,158,11,0.2)";
                badge.style.color = "#f59e0b";
                title.firstChild.textContent = "Rectify Records ";
            } else {
                this.classList.remove('active');
                this.innerHTML = '<i class="fa-solid fa-calendar-day"></i> Rectify';
                group.style.display = 'none';
                picker.disabled = true;
                picker.valueAsDate = new Date();
                badge.textContent = "Live";
                badge.style.background = "rgba(0,230,118,0.2)";
                badge.style.color = "#00e676";
                title.firstChild.textContent = "Mark Today ";
                refreshRoster();
            }
        };
    });

    async function loadMySubjects() {
        // Strictly fetch only assigned subjects
        const { data: subs } = await db.from('subjects')
            .select('id, name, subject_code')
            .eq('faculty_id', currentFaculty.id);
            
        const select = document.getElementById('subjectSelect');
        if (subs && subs.length > 0) {
            select.innerHTML = '<option value="">-- Choose Subject --</option>' + 
                subs.map(s => `<option value="${s.id}">${s.name} (${s.subject_code})</option>`).join('');
        } else {
            select.innerHTML = '<option value="">No subjects assigned to you</option>';
        }
    }

    async function refreshRoster() {
        const subId = document.getElementById('subjectSelect').value;
        const date = document.getElementById('dateFilter').value;
        const listEl = document.getElementById('roster-list');
        const submitBtn = document.getElementById('submitBtn');

        if(!subId) {
            listEl.innerHTML = '<div class="empty-state"><i class="fa-solid fa-users-viewfinder"></i><p>Select a subject to begin</p></div>';
            submitBtn.disabled = true;
            return;
        }

        listEl.innerHTML = '<div class="empty-state"><i class="fa-solid fa-spinner fa-spin"></i><p>Loading class list...</p></div>';
        attendanceMap = {};

        // 1. Get allocated students
        const { data: alloc } = await db.from('subject_allocations')
            .select('profiles:student_id(id, full_name, roll_no)')
            .eq('subject_id', subId);

        students = (alloc || []).map(a => Array.isArray(a.profiles) ? a.profiles[0] : a.profiles).filter(p => p);

        // 2. Get existing records
        const { data: existing } = await db.from('attendance')
            .select('student_id, status')
            .eq('subject_id', subId)
            .eq('date', date);

        if (existing) {
            existing.forEach(e => attendanceMap[e.student_id] = e.status);
        }

        renderStudents();
        submitBtn.disabled = false;
    }

    function renderStudents() {
        const listEl = document.getElementById('roster-list');
        let p = 0, a = 0;

        if(students.length === 0) {
            listEl.innerHTML = '<div class="empty-state" style="color:var(--danger)"><i class="fa-solid fa-ban"></i><p>No students enrolled</p></div>';
            return;
        }

        listEl.innerHTML = students.map(s => {
            const status = attendanceMap[s.id];
            if(status === 'present') p++; else if(status === 'absent') a++;
            return `
                <div class="stu-row">
                    <div class="stu-info">
                        <span class="stu-name">${s.full_name}</span>
                        <span class="stu-roll">${s.roll_no || 'No Roll #'}</span>
                    </div>
                    <div class="btn-group">
                        <button class="btn-att ${status === 'present' ? 'p-active' : ''}" onclick="window.mark('${s.id}', 'present', this)">P</button>
                        <button class="btn-att ${status === 'absent' ? 'a-active' : ''}" onclick="window.mark('${s.id}', 'absent', this)">A</button>
                    </div>
                </div>
            `;
        }).join('');

        document.getElementById('stat-tot').textContent = students.length;
        document.getElementById('stat-pre').textContent = p;
        document.getElementById('stat-abs').textContent = a;
    }

    window.mark = (id, status, btn) => {
        attendanceMap[id] = status;
        const parent = btn.parentElement;
        parent.querySelectorAll('.btn-att').forEach(b => b.classList.remove('p-active', 'a-active'));
        btn.classList.add(status === 'present' ? 'p-active' : 'a-active');
        
        // Update stats bar
        let p = 0, a = 0;
        Object.values(attendanceMap).forEach(v => { if(v === 'present') p++; else if(v === 'absent') a++; });
        document.getElementById('stat-pre').textContent = p;
        document.getElementById('stat-abs').textContent = a;
    };

    document.getElementById('submitBtn').onclick = async () => {
        const subId = document.getElementById('subjectSelect').value;
        const date = document.getElementById('dateFilter').value;
        const btn = document.getElementById('submitBtn');
        const keys = Object.keys(attendanceMap);

        if(keys.length === 0) return showToast("Mark at least one student", "error");

        btn.disabled = true;
        btn.querySelector('span').textContent = 'Synchronizing...';

        const promises = keys.map(uid => db.from('attendance').upsert({
            student_id: uid, subject_id: subId, date: date,
            status: attendanceMap[uid], marked_by: currentFaculty.id
        }, { onConflict: 'student_id,subject_id,date' }));

        try {
            const res = await Promise.all(promises);
            const errs = res.filter(r => r.error);
            if(errs.length > 0) {
                showToast("Failed to sync some records", "error");
                btn.disabled = false;
                btn.querySelector('span').textContent = 'Retry Submit';
            } else {
                showToast("Register Uploaded Successfully!", "success");
                btn.querySelector('span').textContent = 'Submit Register';
                btn.disabled = false;
            }
        } catch(e) {
            showToast("Network Error", "error");
            btn.disabled = false;
        }
    };
</script>
</body>
</html>
