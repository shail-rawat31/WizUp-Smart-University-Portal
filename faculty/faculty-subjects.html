<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Course Materials – WizUP Faculty</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="faculty-shared.css"/>
<style>
.file-card{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid rgba(255,255,255,.07);border-radius:12px;background:rgba(0,0,0,.2);transition:.25s;margin-bottom:10px}
.file-card:hover{border-color:rgba(229,56,59,.25);background:rgba(229,56,59,.04)}
.file-icon{width:42px;height:42px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.file-name{font-size:14px;font-weight:600;margin-bottom:2px}
.file-meta{font-size:11px;color:#8892b0}
.upload-zone{border:2px dashed rgba(229,56,59,.35);border-radius:14px;padding:32px;text-align:center;cursor:pointer;transition:.25s;background:rgba(229,56,59,.03)}
.upload-zone:hover{border-color:rgba(229,56,59,.6);background:rgba(229,56,59,.07)}
.subject-tab{padding:8px 16px;border-radius:10px;border:1px solid rgba(255,255,255,.09);background:none;color:#8892b0;cursor:pointer;font-size:12px;font-weight:700;transition:.2s;font-family:'Inter',sans-serif}
.subject-tab.active{background:rgba(229,56,59,.12);border-color:rgba(229,56,59,.35);color:#fca5a5}
</style>
</head>
<body>
<header class="header">
  <img src="../assets/images/LOGO1.png" alt="WizUP" class="logo"/>
  <div class="h-search"><i class="fa-solid fa-magnifying-glass"></i><input type="text" placeholder="Search materials…"/></div>
  <div class="h-actions">
    <div id="clock" style="font-family:'Outfit',sans-serif;font-weight:800;font-size:17px;color:#e5383b;margin-right:6px">00:00</div>
    <a href="faculty-dashboard.html" class="h-btn"><i class="fa-solid fa-house"></i></a>
    <div class="user-profile"><div class="up-avatar" id="uAvatar">F</div><div class="up-info"><span class="up-name" id="uName">Faculty</span><span class="up-role">Faculty Hub</span></div></div>
    <button class="h-btn" onclick="doSignOut()"><i class="fa-solid fa-right-from-bracket"></i></button>
  </div>
</header>
<div class="main-container">
  <aside class="sidebar">
    <div class="sidebar-section open"><div class="sidebar-header">ACADEMICS<i class="fa-solid fa-chevron-down ch"></i></div><div class="sidebar-menu"><a href="faculty-timetable.html">My Timetable</a><a href="faculty-marks.html">Internal Marks</a><a href="faculty-assignments.html">Assignments</a><a href="faculty-subjects.html" class="active">Course Materials</a></div></div>
    <div class="sidebar-section"><div class="sidebar-header">STUDENTS<i class="fa-solid fa-chevron-down ch"></i></div><div class="sidebar-menu"><a href="faculty-students.html">Student Monitoring</a></div></div>
  </aside>
  <main class="content">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
      <h2 style="font-family:'Outfit',sans-serif;font-size:26px;font-weight:900;display:flex;align-items:center;gap:10px"><i class="fa-solid fa-folder-open" style="color:#e5383b"></i> Course Materials</h2>
      <a href="faculty-dashboard.html" style="color:#8892b0;text-decoration:none;font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
    </div>

    <div class="grid2">
      <!-- File listing -->
      <div class="card">
        <div class="card-hd">
          <h3><i class="fa-solid fa-file-lines" style="color:#fca5a5"></i> Repository</h3>
        </div>
        <div class="card-bd">
          <!-- Subject filter tabs -->
          <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px">
            <button class="subject-tab active" onclick="setSubjFilter('all',this)">All Subjects</button>
            <button class="subject-tab" onclick="setSubjFilter('MCA201',this)">Java (MCA201)</button>
            <button class="subject-tab" onclick="setSubjFilter('MCA203',this)">SE (MCA203)</button>
            <button class="subject-tab" onclick="setSubjFilter('MCA205',this)">DL (MCA205)</button>
          </div>
          <div id="fileList"></div>
        </div>
      </div>

      <!-- Upload panel -->
      <div class="card">
        <div class="card-hd"><h3><i class="fa-solid fa-cloud-arrow-up" style="color:#fca5a5"></i> Upload Material</h3></div>
        <div class="card-bd">
          <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
            <i class="fa-solid fa-cloud-arrow-up" style="font-size:36px;color:#fca5a5;margin-bottom:12px;display:block"></i>
            <div style="font-family:'Outfit',sans-serif;font-size:16px;font-weight:700;color:#fca5a5;margin-bottom:4px">Click to Upload</div>
            <div style="font-size:12px;color:#8892b0">PDF, PPTX, DOCX · Max 50MB</div>
            <input type="file" id="fileInput" accept=".pdf,.pptx,.docx,.zip" style="display:none" onchange="handleFile(this)"/>
          </div>
          <div class="form-group" style="margin-top:16px"><label>Subject</label>
            <select id="uploadSubject">
              <option value="MCA201">Java Programming (MCA201)</option>
              <option value="MCA203">Software Engineering (MCA203)</option>
              <option value="MCA205">Deep Learning (MCA205)</option>
            </select>
          </div>
          <div class="form-group"><label>Unit / Module</label><input type="text" id="uploadUnit" placeholder="e.g. Unit 3 – Exception Handling"/></div>
          <div class="form-group"><label>Description</label><input type="text" id="uploadDesc" placeholder="Brief description for students…"/></div>
          <button class="btn btn-brand" style="width:100%;justify-content:center" onclick="addMaterial()"><i class="fa-solid fa-plus"></i> Add to Repository</button>
        </div>
      </div>
    </div>
  </main>
</div>
<div id="toast-wrap"></div>
<script src="faculty-shared.js"></script>
<script>
const KEY="wizup.faculty.materials.v1";
const FILE_ICONS={pdf:"fa-solid fa-file-pdf",pptx:"fa-solid fa-file-powerpoint",docx:"fa-solid fa-file-word",zip:"fa-solid fa-file-zipper"};
const FILE_COLORS={pdf:"rgba(239,68,68,.2)",pptx:"rgba(245,158,11,.2)",docx:"rgba(56,189,248,.2)",zip:"rgba(167,139,250,.2)"};
const FILE_TEXT={pdf:"#fca5a5",pptx:"#fcd34d",docx:"#7dd3fc",zip:"#c4b5fd"};
let materials=[];
try{materials=JSON.parse(localStorage.getItem(KEY)||"[]")}catch{}
if(!materials.length){
  materials=[
    {id:1,name:"Unit 1 – OOP Fundamentals.pdf",subject:"MCA201",unit:"Unit 1",desc:"Core Java OOP concepts",ext:"pdf",size:"2.1 MB",date:"Jan 15, 2026"},
    {id:2,name:"Design Patterns PPTX.pptx",subject:"MCA203",unit:"Unit 2",desc:"Gang of Four design patterns",ext:"pptx",size:"4.8 MB",date:"Feb 10, 2026"},
    {id:3,name:"Neural Networks Introduction.pdf",subject:"MCA205",unit:"Unit 1",desc:"Intro to deep learning",ext:"pdf",size:"3.2 MB",date:"Mar 1, 2026"},
    {id:4,name:"Lab Manual – Data Structures.pdf",subject:"MCA201",unit:"Lab",desc:"Practical exercises",ext:"pdf",size:"1.4 MB",date:"Mar 12, 2026"},
  ];
  localStorage.setItem(KEY,JSON.stringify(materials));
}
let activeSubj="all";

document.addEventListener("DOMContentLoaded",async()=>{
  await requireAuth(["faculty","hod"]);
  render();
});

function setSubjFilter(subj,btn){
  activeSubj=subj;
  document.querySelectorAll(".subject-tab").forEach(b=>b.classList.remove("active"));
  btn.classList.add("active");
  render();
}

function render(){
  const filtered=activeSubj==="all"?materials:materials.filter(m=>m.subject===activeSubj);
  const el=document.getElementById("fileList");
  el.innerHTML=filtered.length?filtered.map(m=>`
  <div class="file-card">
    <div class="file-icon" style="background:${FILE_COLORS[m.ext]||"rgba(229,56,59,.15)"}"><i class="${FILE_ICONS[m.ext]||"fa-solid fa-file"}" style="color:${FILE_TEXT[m.ext]||"#fca5a5"}"></i></div>
    <div style="flex:1;min-width:0">
      <div class="file-name" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m.name}</div>
      <div class="file-meta">${m.subject} · ${m.unit} · ${m.size} · ${m.date}</div>
    </div>
    <button class="btn btn-sm btn-red" onclick="deleteMaterial(${m.id})" title="Delete"><i class="fa-solid fa-trash"></i></button>
  </div>`).join("")
  :`<div style="text-align:center;padding:32px;color:#8892b0"><i class="fa-solid fa-folder-open" style="font-size:28px;display:block;margin-bottom:10px;opacity:.3"></i>No materials uploaded yet</div>`;
}

function handleFile(input){if(input.files[0])showToast("File selected: "+input.files[0].name,"info");}

function addMaterial(){
  const unit=document.getElementById("uploadUnit").value.trim();
  if(!unit){showToast("Enter unit/module name","error");return;}
  const fi=document.getElementById("fileInput");
  const fname=fi.files[0]?fi.files[0].name:"Sample Material.pdf";
  const ext=fname.split(".").pop().toLowerCase();
  const size=fi.files[0]?Math.round(fi.files[0].size/1024)+"KB":"—";
  materials.unshift({id:Date.now(),name:fname,subject:document.getElementById("uploadSubject").value,unit,desc:document.getElementById("uploadDesc").value,ext,size,date:new Date().toLocaleDateString("en-IN",{day:"2-digit",month:"short",year:"numeric"})});
  localStorage.setItem(KEY,JSON.stringify(materials));
  render();showToast("Material added to repository");
  document.getElementById("uploadUnit").value="";document.getElementById("uploadDesc").value="";fi.value="";
}

function deleteMaterial(id){
  if(!confirm("Remove this material?"))return;
  materials=materials.filter(m=>m.id!==id);
  localStorage.setItem(KEY,JSON.stringify(materials));
  render();showToast("Removed","info");
}
</script>
</body>
</html>
