<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Leave Approvals - WizUP Faculty</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/premium-dashboard.css" />
    <style>
        body { margin: 0; background-color: #050505; color: #fff; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .topbar { display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; background: rgba(5, 5, 8, 0.9); backdrop-filter: blur(20px); border-bottom: 1px solid rgba(0, 230, 118, 0.2); position: sticky; top: 0; z-index: 100; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand i { font-size: 28px; color: #00e676; text-shadow: 0 0 15px rgba(0,230,118,0.5); }
        .brand h1 { font-family: 'Outfit'; font-size: 20px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
        .back-btn { color: #00e676; text-decoration: none; font-size: 13px; font-weight: 700; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .back-btn:hover { color: #fff; transform: translateX(-5px); }
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .page-title { font-family: 'Outfit'; font-size: 32px; font-weight: 900; margin-bottom: 30px; display: flex; align-items: center; gap: 12px; text-shadow: 0 4px 20px rgba(0,0,0,0.5); }
        
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; }
        .data-table { width: 100%; border-collapse: collapse; text-align: left; }
        .data-table th { padding: 15px 20px; color: #8892b0; font-size: 11px; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .data-table td { padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 14px; color: #e2e8f0; }
        .data-table tr:hover td { background: rgba(0, 230, 118, 0.05); }
        
        .stat { padding:4px 10px; border-radius:99px; font-size:10px; font-weight:800; text-transform:uppercase; } .s-pend { background:rgba(255,145,0,0.2); color:#ff9100; }
    </style>
</head>
<body>
    <div class="topbar">
        <div class="brand"><i class="fa-solid fa-file-signature"></i><h1>WizUP Faculty Hub</h1></div>
        <a href="faculty-dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Hub</a>
    </div>
    <div class="container">
        <h2 class="page-title"><i class="fa-solid fa-file-signature" style="color: #00e676;"></i> Leave Approvals</h2>
        <div class="card" style="padding: 0;">
            <table class="data-table">
                <tr><th>Student</th><th>Leave Type</th><th>Dates</th><th>Status</th><th>Actions</th></tr>
                <tr><td>Bob Johnson</td><td>Medical Leave</td><td>15 Apr - 18 Apr</td><td><span class="stat s-pend">Pending</span></td><td>
                    <button style="font-size:10px; padding:6px 10px; background:rgba(0,230,118,0.2)!important; color:#00e676!important; border-color:#00e676!important; margin-right:5px;">Approve</button>
                    <button style="font-size:10px; padding:6px 10px; background:rgba(255,51,102,0.2)!important; color:#ff3366!important; border-color:#ff3366!important;">Reject</button>
                </td></tr>
            </table>
        </div>
    </div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/js/supabase.js"></script>

<script>
    document.addEventListener("DOMContentLoaded", async () => {
        const fac = await requireAuth(['faculty']);
        if(!fac) return;
        
        // Fetch actual pending leaves from database joined with profiles (students)
        const { data: leaves, error } = await db.from('leave_requests').select('*, profiles:requested_by (full_name, roll_no)').eq('status', 'pending');
        const table = document.querySelector('.data-table');
        
        if(table) {
            table.innerHTML = `<tr><th>Student</th><th>Leave Type</th><th>Dates</th><th>Status</th><th>Actions</th></tr>`;
            if(!leaves || leaves.length === 0) {
                table.innerHTML += `<tr><td colspan="5" style="text-align:center; padding: 20px;">No pending leave applications in queue.</td></tr>`;
            } else {
                leaves.forEach(l => {
                    const profileName = l.profiles ? l.profiles.full_name : 'Unknown';
                    const rollName = l.profiles ? l.profiles.roll_no : 'N/A';
                    
                    table.innerHTML += `
                    <tr>
                        <td><b>${profileName}</b> <br><span style="font-size:10px;color:#889;">${rollName}</span></td>
                        <td>${l.type.toUpperCase()} <br><span style="font-size:10px;color:#889;">${l.reason}</span></td>
                        <td>${fmtDate(l.start_date)} - ${fmtDate(l.end_date)}</td>
                        <td><span class="stat s-pend">Pending Request</span></td>
                        <td>
                            <button onclick="approveLeave('${l.id}', 'approved')" style="font-size:10px; padding:6px 10px; background:rgba(0,230,118,0.2)!important; color:#00e676!important; border-color:#00e676!important; margin-right:5px; cursor:pointer;">Approve</button>
                            <button onclick="approveLeave('${l.id}', 'rejected')" style="font-size:10px; padding:6px 10px; background:rgba(255,51,102,0.2)!important; color:#ff3366!important; border-color:#ff3366!important; cursor:pointer;">Deny</button>
                        </td>
                    </tr>`;
                });
            }
        }
    });
    
    window.approveLeave = async (id, stat) => {
        await db.from('leave_requests').update({ status: stat }).eq('id', id);
        showToast('Request ' + stat.toUpperCase(), stat === 'approved' ? 'success' : 'error');
        setTimeout(()=>location.reload(), 1000);
    };
</script>

</body>
</html>
