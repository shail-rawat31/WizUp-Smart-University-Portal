<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Faculty Sign In – WizUP</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--primary:#e5383b;--pr-rgb:229,56,59}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:'Inter',sans-serif;color:#fff;background:url("../assets/images/bg1.jpg") center/cover no-repeat fixed;background-color:#050505;display:flex;align-items:center;overflow:hidden}
.overlay{position:fixed;inset:0;background:radial-gradient(circle at 15% 50%,rgba(5,5,10,.55),rgba(0,0,0,.78));pointer-events:none;z-index:0}
.page{position:relative;z-index:2;width:100%;height:100vh;display:flex;align-items:center;padding:24px 5vw;gap:60px}
/* Card */
.signin-card{width:345px;flex-shrink:0;background:rgba(18,18,22,.78);backdrop-filter:blur(22px);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:30px 28px;box-shadow:0 24px 48px rgba(0,0,0,.5);transition:border-color .4s,box-shadow .4s}
.signin-card:hover{border-color:rgba(var(--pr-rgb),.3);box-shadow:0 24px 48px rgba(0,0,0,.5),0 0 24px rgba(var(--pr-rgb),.1)}
.back-btn{display:inline-flex;align-items:center;gap:7px;color:#8892b0;text-decoration:none;font-size:12px;font-weight:500;margin-bottom:20px;transition:.2s}
.back-btn:hover{color:#fff;transform:translateX(-4px)}
.signin-hd{text-align:center;margin-bottom:20px}
.avatar{width:54px;height:54px;border-radius:50%;background:rgba(var(--pr-rgb),.12);border:1px solid rgba(var(--pr-rgb),.35);margin:0 auto 12px;display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--primary);box-shadow:0 0 20px rgba(var(--pr-rgb),.2)}
h1{font-family:'Outfit',sans-serif;font-size:21px;font-weight:800;background:linear-gradient(135deg,#fff,#a0aab2);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.subtitle{margin-top:5px;font-size:12px;color:#8892b0}
/* Role tabs */
.role-tabs{display:flex;gap:6px;margin-bottom:18px;padding:4px;background:rgba(0,0,0,.3);border-radius:12px}
.role-tab{flex:1;padding:8px;border-radius:9px;border:none;background:none;color:#8892b0;font-size:12px;font-weight:700;cursor:pointer;transition:.2s;display:flex;align-items:center;justify-content:center;gap:6px}
.role-tab.active{background:rgba(var(--pr-rgb),.18);color:#fca5a5;box-shadow:0 2px 8px rgba(0,0,0,.3)}
/* Form */
.form-group{margin-bottom:13px}
label{display:block;margin-bottom:6px;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:#8892b0}
.input-wrap{position:relative}
.input-wrap i{position:absolute;left:13px;top:50%;transform:translateY(-50%);font-size:13px;color:#8892b0;transition:.3s}
.input-wrap:focus-within i{color:var(--primary)}
input[type=email],input[type=password]{width:100%;padding:11px 12px 11px 38px;border:1px solid rgba(255,255,255,.1);border-radius:11px;font-size:13px;background:rgba(0,0,0,.25);color:#fff;transition:.3s;outline:none;font-family:'Inter',sans-serif}
input[type=email]:focus,input[type=password]:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(var(--pr-rgb),.15);background:rgba(0,0,0,.4)}
.form-opts{display:flex;justify-content:space-between;align-items:center;font-size:11px;margin-bottom:14px;color:#8892b0}
.remember{display:flex;align-items:center;gap:6px;cursor:pointer}
input[type=checkbox]{accent-color:var(--primary)}
.forgot{color:var(--primary);text-decoration:none;font-weight:600;transition:opacity .2s}
.forgot:hover{opacity:.8}
.signin-btn{width:100%;padding:12px;border:none;border-radius:11px;background:var(--primary);color:#fff;font-size:14px;font-weight:700;letter-spacing:.5px;cursor:pointer;transition:.25s;display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 8px 20px rgba(var(--pr-rgb),.3)}
.signin-btn:hover{background:#c42d30;transform:translateY(-2px);box-shadow:0 12px 24px rgba(var(--pr-rgb),.4)}
.signin-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.err-msg{background:rgba(239,68,68,.1);border:1px solid rgba(239,68,68,.3);border-radius:8px;padding:9px 13px;font-size:12px;color:#fca5a5;margin-bottom:12px;display:none}
.spinner{width:15px;height:15px;border-radius:50%;border:2px solid rgba(255,255,255,.3);border-top-color:#fff;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
/* Crest */
.crest{position:absolute;right:12%;top:50%;transform:translateY(-50%);width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.02);border:1px solid rgba(255,255,255,.05);backdrop-filter:blur(10px);box-shadow:0 30px 60px rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:2;transition:transform .5s}
.crest::before{content:'';position:absolute;inset:-18px;border-radius:50%;border:1px dashed rgba(var(--pr-rgb),.25);animation:spin 30s linear infinite}
.crest:hover{transform:translateY(-50%) scale(1.05)}
.crest img{max-width:62%;filter:drop-shadow(0 8px 16px rgba(0,0,0,.5));transition:filter .5s,transform .5s}
.crest:hover img{transform:scale(1.05);filter:drop-shadow(0 0 24px rgba(var(--pr-rgb),.5))}
/* Info pills below card */
.info-pills{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.pill{padding:5px 12px;border-radius:99px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);font-size:11px;color:#8892b0;display:flex;align-items:center;gap:6px}
@media(max-width:900px){.crest{display:none}.page{justify-content:center;padding:20px}.signin-card{width:100%;max-width:360px}}
</style>
</head>
<body>
<div class="overlay"></div>
<div class="page">
  <div class="signin-card">
    <a href="../index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Back to Portal</a>
    <div class="signin-hd">
      <div class="avatar"><i class="fa-solid fa-chalkboard-user"></i></div>
      <h1>Faculty Sign In</h1>
      <p class="subtitle">Access your Faculty Hub & Services</p>
    </div>

    <div class="role-tabs">
      <button class="role-tab active" id="tab-fac" onclick="setRole('faculty',this)"><i class="fa-solid fa-chalkboard-user"></i> Faculty</button>
      <button class="role-tab" id="tab-hod" onclick="setRole('hod',this)"><i class="fa-solid fa-user-tie"></i> HOD</button>
    </div>

    <div class="err-msg" id="errMsg"></div>
    <form id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-wrap"><i class="fa-solid fa-envelope"></i><input type="email" id="email" placeholder="faculty@wizup.edu" required autocomplete="email"/></div>
      </div>
      <div class="form-group">
        <label>Password</label>
        <div class="input-wrap"><i class="fa-solid fa-lock"></i><input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password"/></div>
      </div>
      <div class="form-opts">
        <label class="remember"><input type="checkbox" id="rememberMe"/> Remember me</label>
        <a href="#" class="forgot">Forgot Password?</a>
      </div>
      <button type="submit" class="signin-btn" id="loginBtn"><i class="fa-solid fa-right-to-bracket"></i> Sign In</button>
    </form>

    <div class="info-pills" style="margin-top:16px">
      <div class="pill"><i class="fa-solid fa-shield-halved" style="color:#86efac"></i> Secure Supabase Auth</div>
      <div class="pill"><i class="fa-solid fa-lock" style="color:#7dd3fc"></i> Role-protected access</div>
    </div>
  </div>
  <div class="crest"><img src="../assets/images/LOGO1.png" alt="WizUP"/></div>
</div>

<script>
const SUPABASE_URL="https://vqxhbfbpqwpdbmgtdcik.supabase.co";
const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxeGhiZmJwcXdwZGJtZ3RkY2lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4MTY1MTMsImV4cCI6MjA4NzM5MjUxM30.U9wuwWRDsUqKef93fl0C1DLu9l_hQ5zKMT9KhOt24xE";
const db=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);
let selectedRole='faculty';

db.auth.getSession().then(({data:{session}})=>{
  if(session){db.from("profiles").select("role").eq("id",session.user.id).single().then(({data:p})=>{
    if(p?.role==="faculty")window.location.href="faculty-dashboard.html";
    else if(p?.role==="hod")window.location.href="../hod/hod-dashboard.html";
  });}
});

function setRole(role,btn){
  selectedRole=role;
  document.querySelectorAll('.role-tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('email').placeholder=role==='hod'?'hod@wizup.edu':'faculty@wizup.edu';
}

document.getElementById("loginForm").addEventListener("submit",async e=>{
  e.preventDefault();
  const errEl=document.getElementById("errMsg");
  const btn=document.getElementById("loginBtn");
  errEl.style.display="none";
  btn.disabled=true;
  btn.innerHTML=`<span class="spinner"></span> Signing in…`;
  const {data,error}=await db.auth.signInWithPassword({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value});
  if(error){errEl.textContent=error.message;errEl.style.display="block";btn.disabled=false;btn.innerHTML=`<i class="fa-solid fa-right-to-bracket"></i> Sign In`;return;}
  const {data:profile}=await db.from("profiles").select("role").eq("id",data.user.id).single();
  if(!profile||!["faculty","hod"].includes(profile.role)){await db.auth.signOut();errEl.textContent="Access denied. This portal is for Faculty & HOD only.";errEl.style.display="block";btn.disabled=false;btn.innerHTML=`<i class="fa-solid fa-right-to-bracket"></i> Sign In`;return;}
  window.location.href=profile.role==="hod"?"../hod/hod-dashboard.html":"faculty-dashboard.html";
});
</script>
</body>
</html>
