<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Projects & Internships – WizUP Student</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: rgba(20, 20, 25, 0.7);
            --card-border: rgba(229, 56, 59, 0.15);
            --text-main: #ffffff;
            --text-muted: #8892b0;
            --brand: #e5383b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: 'Inter', sans-serif;
            background: url("../assets/images/bg1.jpg") center/cover no-repeat fixed;
            color: var(--text-main);
            position: relative;
        }

        .overlay {
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 70% 40%, rgba(0, 0, 0, .15), rgba(0, 0, 0, .80));
            pointer-events: none;
            z-index: 0;
        }

        .container, .topbar {
            position: relative;
            z-index: 1;
        }

        .topbar {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 24px;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--card-border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            width: 44px;
            height: 44px;
            background: #000;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow: hidden;
        }

        .logo img { width: 75%; }

        .t-title h1 {
            margin: 0; font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 800; letter-spacing: 1px;
        }
        .t-title p {
            margin: 0; font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;
        }

        .spacer { flex: 1; }

        .nav-link {
            color: #fca5a5; text-decoration: none; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 8px; transition: 0.2s;
        }
        .nav-link:hover { color: #fff; }

        .container {
            width: min(1200px, 95vw);
            margin: 30px auto;
        }

        .header-flex {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
        }

        .page-title {
            font-family: 'Outfit', sans-serif;
            font-size: 28px;
            font-weight: 800;
            color: #fff;
        }

        .btn-new {
            background: var(--brand);
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .btn-new:hover { background: #b21f2d; }

        /* Grid */
        .section-title {
            font-size: 18px;
            font-weight: 700;
            color: #fca5a5;
            margin-bottom: 16px;
            border-bottom: 1px solid rgba(229, 56, 59, 0.2);
            padding-bottom: 8px;
            display: inline-block;
        }

        .grid-layout {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 40px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 16px;
            padding: 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: 0.3s;
        }
        
        .card:hover { transform: translateY(-5px); border-color: rgba(229, 56, 59, 0.4); }

        .c-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .c-badge {
            font-size: 10px;
            font-weight: 800;
            text-transform: uppercase;
            padding: 4px 10px;
            border-radius: 6px;
            background: rgba(255, 255, 255, 0.1);
        }

        .badge-ongoing { background: rgba(34, 197, 94, 0.15); color: #86efac; border: 1px solid rgba(34, 197, 94, 0.3); }
        .badge-planning { background: rgba(245, 158, 11, 0.15); color: #fcd34d; border: 1px solid rgba(245, 158, 11, 0.3); }
        .badge-applied { background: rgba(56, 189, 248, 0.15); color: #7dd3fc; border: 1px solid rgba(56, 189, 248, 0.3); }

        .c-title {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 8px;
            font-family: 'Outfit';
        }

        .c-desc {
            font-size: 13px;
            color: var(--text-muted);
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .c-meta {
            display: flex;
            align-items: center;
            gap: 16px;
            font-size: 12px;
            color: #ccc;
            margin-bottom: 20px;
        }

        .c-meta i { color: #fca5a5; }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #fca5a5, #e5383b);
            border-radius: 10px;
        }

        .progress-text {
            font-size: 11px;
            color: var(--text-muted);
            text-align: right;
            font-weight: 600;
        }

    </style>
</head>

<body>
    <div class="overlay"></div>
    <div class="topbar">
        <div class="logo"><img src="../assets/images/LOGO1.png" alt="WizUP" /></div>
        <div class="t-title">
            <h1>Projects & Internships</h1>
            <p>Academic Explorer</p>
        </div>
        <div class="spacer"></div>
        <a href="student-dashboard.html" class="nav-link"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
    </div>

    <div class="container">
        <div class="header-flex">
            <h2 class="page-title">My Projects & Internships</h2>
            <button class="btn-new" onclick="alert('Submission portal opening soon!')"><i class="fa-solid fa-plus"></i> Submit New Proposal</button>
        </div>

        <div class="section-title"><i class="fa-solid fa-laptop-code"></i> Academic Projects</div>
        <div class="grid-layout" id="projectsGrid">
            <!-- Populated via JS -->
        </div>

        <div class="section-title"><i class="fa-solid fa-briefcase"></i> Internship Applications</div>
        <div class="grid-layout" id="internshipsGrid">
            <!-- Populated via JS -->
        </div>
    </div>

    <script>
        const SUPABASE_URL = "https://vqxhbfbpqwpdbmgtdcik.supabase.co";
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxeGhiZmJwcXdwZGJtZ3RkY2lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4MTY1MTMsImV4cCI6MjA4NzM5MjUxM30.U9wuwWRDsUqKef93fl0C1DLu9l_hQ5zKMT9KhOt24xE";
        const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const projects = [
            {
                type: "Minor Project",
                title: "AI Attendance System",
                desc: "Facial recognition based attendance system integrating with Supabase and Python OpenCV for real-time tracking.",
                guide: "Dr. Sharma",
                status: "Ongoing",
                badgeClass: "badge-ongoing",
                progress: 75
            },
            {
                type: "Major Project",
                title: "WizUP Enterprise Portal",
                desc: "A comprehensive university management system with modular design and role-based access control.",
                guide: "Prof. Gupta",
                status: "Planning",
                badgeClass: "badge-planning",
                progress: 15
            }
        ];

        const internships = [
            {
                company: "Google",
                role: "SWE Winter Intern",
                location: "Hyderabad",
                status: "Interview Phase",
                badgeClass: "badge-ongoing",
                appliedOn: "Feb 10, 2026"
            },
            {
                company: "Microsoft",
                role: "SDE Intern",
                location: "Remote",
                status: "Applied",
                badgeClass: "badge-applied",
                appliedOn: "Feb 14, 2026"
            }
        ];

        function renderProjects() {
            const grid = document.getElementById('projectsGrid');
            grid.innerHTML = projects.map(p => `
                <div class="card">
                    <div class="c-header">
                        <div class="c-badge" style="background: rgba(255,255,255,0.08); color: #ccc;">${p.type}</div>
                        <div class="c-badge ${p.badgeClass}">${p.status}</div>
                    </div>
                    <div class="c-title">${p.title}</div>
                    <div class="c-desc">${p.desc}</div>
                    <div class="c-meta">
                        <span><i class="fa-solid fa-chalkboard-user"></i> Guide: ${p.guide}</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" style="width: ${p.progress}%"></div>
                    </div>
                    <div class="progress-text">${p.progress}% Completed</div>
                </div>
            `).join('');
        }

        function renderInternships() {
            const grid = document.getElementById('internshipsGrid');
            grid.innerHTML = internships.map(i => `
                <div class="card">
                    <div class="c-header">
                        <div class="c-badge" style="background: rgba(255,255,255,0.08); color: #ccc;"><i class="fa-solid fa-building"></i> ${i.company}</div>
                        <div class="c-badge ${i.badgeClass}">${i.status}</div>
                    </div>
                    <div class="c-title">${i.role}</div>
                    <div class="c-desc">Location: ${i.location}</div>
                    <div class="c-meta">
                        <span><i class="fa-solid fa-calendar-check"></i> Applied: ${i.appliedOn}</span>
                    </div>
                </div>
            `).join('');
        }

        async function init() {
            renderProjects();
            renderInternships();
        }

        init();
    </script>
</body>
</html>
