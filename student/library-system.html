<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>E-Library Matrix – WizUP</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../assets/css/premium-dashboard.css" />
    <style>
        :root {
            --primary: #00d2ff;
            --glass: rgba(15, 23, 42, 0.7);
            --border: rgba(255, 255, 255, 0.1);
            --brand: #e5383b;
        }
        body { margin: 0; background: url("../assets/images/bg1.jpg") center/cover no-repeat fixed; color: #fff; font-family: 'Inter', sans-serif; min-height: 100vh; }
        .overlay { position: fixed; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(0,0,0,0.3), rgba(0,0,0,0.95)); pointer-events: none; z-index: 0; }
        
        .topbar { display: flex; align-items: center; justify-content: space-between; padding: 20px 40px; background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand h1 { font-family: 'Outfit'; font-size: 24px; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; }
        .badge { font-size: 10px; padding: 4px 10px; border-radius: 99px; background: rgba(0, 230, 118, 0.2); color: #00e676; border: 1px solid rgba(0,230,118,0.3); letter-spacing: 1px; font-weight: 800; margin-left: 10px; }
        
        .container { max-width: 1200px; margin: 40px auto; padding: 0 20px; position: relative; z-index: 1; }
        
        .library-hdr { text-align: center; margin-bottom: 50px; }
        .library-hdr h2 { font-family: 'Outfit'; font-size: 42px; font-weight: 900; margin-bottom: 20px; }
        
        .search-container { position: relative; max-width: 700px; margin: 0 auto 30px; }
        .search-container input { width: 100%; padding: 20px 30px; padding-right: 70px; background: rgba(255,255,255,0.05); border: 1px solid var(--primary); border-radius: 20px; color: #fff; font-family: 'Outfit'; font-size: 18px; transition: 0.3s; box-shadow: 0 10px 40px rgba(0, 210, 255, 0.1); }
        .search-container input:focus { border-color: #fff; box-shadow: 0 10px 50px rgba(0, 210, 255, 0.3); outline: none; }
        .search-container button { position: absolute; right: 10px; top: 10px; bottom: 10px; width: 60px; background: var(--primary); border: none; border-radius: 14px; color: #000; font-size: 20px; cursor: pointer; transition: 0.3s; }

        .cat-row { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-bottom: 30px; }
        .cat-btn { padding: 12px 24px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 14px; color: rgba(255,255,255,0.6); font-family: 'Outfit'; font-weight: 700; font-size: 13px; cursor: pointer; transition: 0.3s; }
        .cat-btn:hover, .cat-btn.active { background: rgba(0,210,255,0.2); border-color: var(--primary); color: #fff; transform: translateY(-3px); }

        /* Grid */
        .book-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 30px; min-height: 400px; }
        .book-card { background: var(--glass); backdrop-filter: blur(16px); border: 1px solid var(--border); border-radius: 24px; padding: 24px; display: flex; flex-direction: column; transition: 0.4s; cursor: pointer; position: relative; overflow: hidden; }
        .book-card:hover { border-color: var(--primary); transform: translateY(-10px); box-shadow: 0 20px 50px rgba(0, 210, 255, 0.15); }
        
        .book-cover { width: 100%; aspect-ratio: 2/3; background: #000; border-radius: 16px; overflow: hidden; margin-bottom: 18px; box-shadow: 10px 15px 30px rgba(0,0,0,0.6); transform: perspective(1000px) rotateY(-5deg); transition: 0.5s; border: 1px solid rgba(255,255,255,0.1); }
        .book-cover img { width: 100%; height: 100%; object-fit: cover; }
        .book-card:hover .book-cover { transform: perspective(1000px) rotateY(0deg) scale(1.05); }
        
        .book-title { font-family: 'Outfit'; font-size: 16px; font-weight: 800; margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; height: 42px; line-height: 1.3; }
        .book-author { font-size: 11px; color: #8892b0; text-transform: uppercase; font-weight: 700; letter-spacing: 1px; }
        
        .book-footer { margin-top: auto; padding-top: 18px; display: flex; align-items: center; justify-content: space-between; border-top: 1px solid rgba(255,255,255,0.05); }
        .view-btn { padding: 8px 16px; background: rgba(0,210,255,0.1); border: 1px solid var(--primary); color: var(--primary); border-radius: 10px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }

        /* Modal Details */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.92); backdrop-filter: blur(15px); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 25px; }
        .modal-card { background: #08080c; border: 1px solid var(--border); border-radius: 32px; max-width: 900px; width: 100%; display: grid; grid-template-columns: 1fr 1.5fr; gap: 40px; padding: 40px; position: relative; overflow-y: auto; max-height: 90vh; box-shadow: 0 40px 100px rgba(0,0,0,0.8); }
        .modal-close { position: absolute; top: 25px; right: 25px; width: 44px; height: 44px; border-radius: 50%; background: #1a1a1a; border: none; color: #fff; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 20px; transition: 0.3s; }
        .modal-close:hover { background: #e5383b; transform: rotate(90deg); }
        .modal-body h2 { font-family: 'Outfit'; font-size: 32px; font-weight: 900; margin-bottom: 12px; line-height: 1.2; }
        .modal-desc { margin: 25px 0; font-size: 15px; color: rgba(255,255,255,0.8); line-height: 1.8; }
        .modal-meta { display: flex; gap: 25px; font-size: 12px; font-weight: 800; color: #8892b0; text-transform: uppercase; letter-spacing: 1px; }
        .read-btn { display: inline-block; padding: 16px 32px; background: var(--primary); color: #000; border-radius: 14px; font-family: 'Outfit'; font-weight: 900; text-decoration: none; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
        .read-btn:hover { background: #fff; transform: translateY(-3px); box-shadow: 0 10px 30px rgba(0,210,255,0.3); }

        .loader { text-align: center; padding: 100px 0; grid-column: 1 / -1; }
        .loader i { font-size: 48px; color: var(--primary); margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="topbar">
        <div class="brand">
            <i class="fa-solid fa-book-atlas" style="color:var(--primary)"></i><h1>Digital Library</h1>
            <span class="badge" id="net-badge">Global Online</span>
        </div>
        <a href="student-dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Hub</a>
    </div>

    <div class="container">
        <div class="library-hdr">
            <h2>E-Library Matrix</h2>
            <div class="search-container">
                <input type="text" id="libInput" placeholder="Search title, author or ISBN..." />
                <button id="libSearchBtn"><i class="fa-solid fa-magnifying-glass"></i></button>
            </div>
            <div class="cat-row">
                <button class="cat-btn active" data-q="Data Structures">Data Structures</button>
                <button class="cat-btn" data-q="Cloud Computing">Cloud Hub</button>
                <button class="cat-btn" data-q="Cyber Security">Security</button>
                <button class="cat-btn" data-q="Software Design">Software Design</button>
                <button class="cat-btn" data-q="Machine Learning">AI Core</button>
            </div>
        </div>

        <div id="resultsGrid" class="book-grid"></div>
    </div>

    <div class="modal-overlay" id="bookModal">
        <div class="modal-card">
            <button class="modal-close" onclick="closeBook()"><i class="fa-solid fa-xmark"></i></button>
            <div class="modal-cover"><img id="mCover" src="" /></div>
            <div class="modal-body">
                <h2 id="mTitle">Title</h2>
                <div class="modal-meta">
                    <span>By <span id="mAuthor">Author</span></span>
                    <span>· <span id="mYear">Year</span></span>
                </div>
                <div class="modal-desc" id="mDesc">Description...</div>
                <div style="display:flex; gap:15px; flex-wrap:wrap;">
                    <a id="mPLink" href="#" target="_blank" class="read-btn">Read Digital</a>
                    <button class="read-btn" style="background:#1a1a1a; color:#fff; border:1px solid #333;" onclick="showToast('Issued to your account', 'success')">Reserve Hardcopy</button>
                </div>
            </div>
        </div>
    </div>

<script src="../assets/js/supabase.js"></script>
<script>
    const MOCK_BOOKS = [
        { id: "off1", volumeInfo: { title: "Introduction to Algorithms", authors: ["T. Cormen"], publishedDate: "2022", description: "The definitive guide to algorithmic complexity and data structures for university students.", imageLinks: { thumbnail: "https://m.media-amazon.com/images/I/41SN8axY6zL.jpg" }, previewLink: "#" }},
        { id: "off2", volumeInfo: { title: "Clean Code", authors: ["R. C. Martin"], publishedDate: "2008", description: "A handbook of agile software craftsmanship written by industry legend Uncle Bob.", imageLinks: { thumbnail: "https://m.media-amazon.com/images/I/41xShlnTZTL.jpg" }, previewLink: "#" }},
        { id: "off3", volumeInfo: { title: "Artificial Intelligence: A Modern Approach", authors: ["S. Russell"], publishedDate: "2020", description: "The world's most widely used AI textbook, providing a complete overview of the field.", imageLinks: { thumbnail: "https://m.media-amazon.com/images/I/51296v647TL.jpg" }, previewLink: "#" }},
        { id: "off4", volumeInfo: { title: "Design Patterns", authors: ["Gang of Four"], publishedDate: "1994", description: "The foundational catalog of reusable object-oriented software patterns and solutions.", imageLinks: { thumbnail: "https://m.media-amazon.com/images/I/81gtKoapHFL.jpg" }, previewLink: "#" }}
    ];

    document.addEventListener("DOMContentLoaded", () => {
        fetchBooks("Data Structures");
        document.getElementById('libSearchBtn').onclick = () => fetchBooks(document.getElementById('libInput').value);
        document.getElementById('libInput').onkeyup = (e) => { if(e.key === 'Enter') fetchBooks(e.target.value); };
        
        document.querySelectorAll('.cat-btn').forEach(btn => {
            btn.onclick = function() {
                document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                fetchBooks(this.dataset.q);
            };
        });
    });

    async function fetchBooks(q) {
        const grid = document.getElementById('resultsGrid');
        const badge = document.getElementById('net-badge');
        grid.innerHTML = '<div class="loader"><i class="fa-solid fa-spinner fa-spin"></i><p style="font-size:13px; margin-top:20px; opacity:0.5;">Connecting to Global Hub...</p></div>';

        try {
            const res = await fetch("https://www.googleapis.com/books/v1/volumes?maxResults=20&q=" + encodeURIComponent(q || "Academic"));
            const data = await res.json();
            
            if (data.items) {
                badge.textContent = "Global Online";
                badge.style.background = "rgba(0, 230, 118, 0.2)";
                badge.style.color = "#00e676";
                render(data.items);
            } else {
                useFallback("No exact matches found. Showing core library.");
            }
        } catch (e) {
            useFallback("Network restricted. Showing Core Offline Library.");
        }
    }

    function useFallback(msg) {
        const badge = document.getElementById('net-badge');
        badge.textContent = "Offline Mode";
        badge.style.background = "rgba(229, 56, 59, 0.2)";
        badge.style.color = "#fca5a5";
        showToast(msg, "info");
        render(MOCK_BOOKS);
    }

    function render(books) {
        document.getElementById('resultsGrid').innerHTML = books.map(b => {
            const info = b.volumeInfo;
            const thumb = info.imageLinks ? info.imageLinks.thumbnail.replace('http:', 'https:') : 'https://via.placeholder.com/150';
            return `
                <div class="book-card" onclick="viewBook('${b.id}')">
                    <div class="book-cover"><img src="${thumb}"></div>
                    <div class="book-title">${info.title}</div>
                    <div class="book-author">${info.authors ? info.authors[0] : 'Various'}</div>
                    <div class="book-footer">
                        <span style="font-size:10px; color:var(--primary); font-weight:800;">WIZUP-LIB</span>
                        <div class="view-btn">Inspect</div>
                    </div>
                </div>
            `;
        }).join('');
    }

    async function viewBook(id) {
        if(id.startsWith('off')) {
            const b = MOCK_BOOKS.find(x => x.id === id);
            fillModal(b.volumeInfo);
            return;
        }

        try {
            const res = await fetch("https://www.googleapis.com/books/v1/volumes/" + id);
            const b = await res.json();
            fillModal(b.volumeInfo);
        } catch (e) {
            showToast("Details unavailable offline", "error");
        }
    }

    function fillModal(info) {
        document.getElementById('mTitle').textContent = info.title;
        document.getElementById('mAuthor').textContent = info.authors ? info.authors.join(', ') : 'Unknown';
        document.getElementById('mYear').textContent = info.publishedDate || 'N/A';
        document.getElementById('mDesc').innerHTML = info.description || 'Description currently unavailable.';
        document.getElementById('mCover').src = info.imageLinks ? info.imageLinks.thumbnail.replace('http:', 'https:') : '';
        document.getElementById('mPLink').href = info.previewLink;
        document.getElementById('bookModal').style.display = 'flex';
    }

    function closeBook() { document.getElementById('bookModal').style.display = 'none'; }
</script>
</body>
</html>
