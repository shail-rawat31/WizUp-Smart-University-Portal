<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>International Opportunities – WizUP Student</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
<style>
:root{--card:rgba(20,20,25,.72);--border:rgba(229,56,59,.15);--b2:rgba(255,255,255,.09);--muted:#8892b0;--brand:#e5383b}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:'Inter',sans-serif;background:url("../assets/images/bg1.jpg") center/cover no-repeat fixed;background-color:#050505;color:#fff}
.overlay{position:fixed;inset:0;background:radial-gradient(circle at 70% 40%,rgba(0,0,0,.15),rgba(0,0,0,.84));pointer-events:none;z-index:0}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 24px;background:rgba(0,0,0,.82);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
.logo{width:44px;height:44px;background:#000;border-radius:12px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.1);overflow:hidden}
.logo img{width:75%}
.t-title h1{margin:0;font-family:'Outfit',sans-serif;font-size:16px;font-weight:800;letter-spacing:1px}
.t-title p{margin:0;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.spacer{flex:1}
.nav-link{color:#fca5a5;text-decoration:none;font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px;transition:.2s}
.nav-link:hover{color:#fff}
.container{width:min(1100px,95vw);margin:30px auto;position:relative;z-index:1}
.page-title{font-family:'Outfit',sans-serif;font-size:26px;font-weight:800;margin-bottom:24px}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;backdrop-filter:blur(20px);box-shadow:0 10px 30px rgba(0,0,0,.3);overflow:hidden;margin-bottom:20px}
.card-hd{padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;background:rgba(229,56,59,.05)}
.card-hd h2{font-family:'Outfit',sans-serif;font-size:15px;font-weight:800;display:flex;align-items:center;gap:8px}
.card-bd{padding:20px}
.opp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
.opp-card{padding:20px;border:1px solid var(--b2);border-radius:12px;background:rgba(0,0,0,.3);transition:.25s}
.opp-card:hover{border-color:rgba(229,56,59,.4);background:rgba(229,56,59,.06);transform:translateY(-3px)}
.opp-flag{font-size:28px;margin-bottom:10px;display:block}
.opp-type{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:3px 9px;border-radius:99px;margin-bottom:8px;display:inline-flex}
.t-exchange{background:rgba(56,189,248,.15);color:#7dd3fc;border:1px solid rgba(56,189,248,.3)}
.t-research{background:rgba(167,139,250,.15);color:#c4b5fd;border:1px solid rgba(167,139,250,.3)}
.t-scholarship{background:rgba(251,191,36,.15);color:#fde68a;border:1px solid rgba(251,191,36,.3)}
.t-summer{background:rgba(34,197,94,.15);color:#86efac;border:1px solid rgba(34,197,94,.3)}
.opp-title{font-family:'Outfit',sans-serif;font-size:17px;font-weight:800;margin-bottom:4px}
.opp-uni{font-size:13px;font-weight:600;color:#fca5a5;margin-bottom:8px}
.opp-details{font-size:12px;color:var(--muted);line-height:1.7;margin-bottom:14px}
.btn{background:var(--brand);color:#fff;border:none;padding:8px 14px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;transition:.2s;display:inline-flex;align-items:center;gap:6px;font-family:'Inter',sans-serif}
.btn:hover{background:#b21f2d}
.tabs{display:flex;gap:8px;margin-bottom:20px;flex-wrap:wrap}
.tab{padding:8px 16px;border-radius:8px;border:1px solid var(--b2);background:none;color:var(--muted);cursor:pointer;font-size:12px;font-weight:700;transition:.2s;font-family:'Inter',sans-serif}
.tab.active{background:rgba(229,56,59,.15);border-color:rgba(229,56,59,.4);color:#fca5a5}
.eligibility-bar{display:flex;align-items:center;gap:10px;padding:12px;background:rgba(0,0,0,.3);border-radius:10px;margin-bottom:10px}
.elig-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.elig-ok{background:rgba(34,197,94,.15);color:#86efac}
.elig-warn{background:rgba(245,158,11,.15);color:#fcd34d}
</style>
</head>
<body>
<div class="overlay"></div>
<div class="topbar">
  <div class="logo"><img src="../assets/images/LOGO1.png" alt="WizUP"/></div>
  <div class="t-title"><h1>International Opportunities</h1><p>Exchange, research & scholarships</p></div>
  <div class="spacer"></div>
  <a href="student-dashboard.html" class="nav-link"><i class="fa-solid fa-arrow-left"></i> Dashboard</a>
</div>

<div class="container">
  <h2 class="page-title">Global Opportunities</h2>

  <div class="tabs">
    <button class="tab active" onclick="filterType('all',this)">All</button>
    <button class="tab" onclick="filterType('exchange',this)">Student Exchange</button>
    <button class="tab" onclick="filterType('research',this)">Research Internships</button>
    <button class="tab" onclick="filterType('scholarship',this)">Scholarships</button>
    <button class="tab" onclick="filterType('summer',this)">Summer Schools</button>
  </div>

  <div class="opp-grid" id="oppGrid"></div>

  <div class="card">
    <div class="card-hd"><h2><i class="fa-solid fa-circle-check" style="color:#fca5a5"></i>Eligibility Checklist</h2></div>
    <div class="card-bd">
      <div class="eligibility-bar"><div class="elig-icon elig-ok"><i class="fa-solid fa-check"></i></div><div><div style="font-size:13px;font-weight:600">CGPA ≥ 7.5</div><div style="font-size:11px;color:var(--muted)">Your CGPA: 8.4 ✓</div></div></div>
      <div class="eligibility-bar"><div class="elig-icon elig-ok"><i class="fa-solid fa-check"></i></div><div><div style="font-size:13px;font-weight:600">No active backlogs</div><div style="font-size:11px;color:var(--muted)">Status: Clear ✓</div></div></div>
      <div class="eligibility-bar"><div class="elig-icon elig-warn"><i class="fa-solid fa-triangle-exclamation"></i></div><div><div style="font-size:13px;font-weight:600">English Proficiency (IELTS/TOEFL)</div><div style="font-size:11px;color:var(--muted)">Not submitted — required for most programs</div></div></div>
      <div class="eligibility-bar"><div class="elig-icon elig-ok"><i class="fa-solid fa-check"></i></div><div><div style="font-size:13px;font-weight:600">Attendance ≥ 75%</div><div style="font-size:11px;color:var(--muted)">Your average: 82% ✓</div></div></div>
    </div>
  </div>
</div>

<script>
const OPPS=[
  {type:'exchange',flag:'🇩🇪',title:'Exchange Semester',uni:'TU Munich, Germany',details:'1 semester abroad. Courses fully credit-transferable.\nStipend: €450/month\nApplication: Apr 15, 2025',deadline:'Apr 15, 2025'},
  {type:'exchange',flag:'🇸🇬',title:'Student Exchange Program',uni:'NTU Singapore',details:'1 year exchange. Tuition waiver + SGD 800/month.\nApplication: Mar 30, 2025',deadline:'Mar 30, 2025'},
  {type:'research',flag:'🇺🇸',title:'MITACS Research Internship',uni:'MIT, USA',details:'12-week summer research internship.\nStipend: $3,500/month\nDomain: AI, Robotics, Data Sci\nDeadline: Apr 1, 2025',deadline:'Apr 1, 2025'},
  {type:'research',flag:'🇯🇵',title:'SAKURA Science Exchange',uni:'University of Tokyo',details:'Short-term research visit (14 days).\nAll expenses paid by JST Japan.\nDeadline: May 10, 2025',deadline:'May 10, 2025'},
  {type:'scholarship',flag:'🇬🇧',title:'Chevening Scholarship',uni:'UK Government',details:'Fully funded Masters in any UK university.\nIncludes tuition + living + flights.\nDeadline: Nov 5, 2025',deadline:'Nov 5, 2025'},
  {type:'scholarship',flag:'🇦🇺',title:'Endeavour Leadership',uni:'Australian Govt.',details:'Postgrad scholarship to Australia.\nAUD 4,500/month + tuition.\nDeadline: Jul 30, 2025',deadline:'Jul 30, 2025'},
  {type:'summer',flag:'🇰🇷',title:'POSTECH Summer School',uni:'POSTECH, South Korea',details:'2-week intensive summer school.\nTopics: ML, Semiconductors.\nFully funded + KRW allowance.',deadline:'Jun 1, 2025'},
  {type:'summer',flag:'🇨🇦',title:'Waterloo Summer Research',uni:'University of Waterloo',details:'8-week research program.\nCAD 2,000 stipend + accommodation.',deadline:'Mar 20, 2025'},
];
const typeClass={exchange:'t-exchange',research:'t-research',scholarship:'t-scholarship',summer:'t-summer'};
const typeLabel={exchange:'Student Exchange',research:'Research Internship',scholarship:'Scholarship',summer:'Summer School'};
let activeFilter='all';

function filterType(t,btn){
  activeFilter=t;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  render();
}
function render(){
  const filtered=activeFilter==='all'?OPPS:OPPS.filter(o=>o.type===activeFilter);
  document.getElementById('oppGrid').innerHTML=filtered.map(o=>`
  <div class="opp-card">
    <span class="opp-flag">${o.flag}</span>
    <div class="opp-type ${typeClass[o.type]}">${typeLabel[o.type]}</div>
    <div class="opp-title">${o.title}</div>
    <div class="opp-uni">${o.uni}</div>
    <div class="opp-details">${o.details.replace(/\n/g,'<br>')}</div>
    <div style="display:flex;justify-content:space-between;align-items:center">
      <span style="font-size:11px;color:var(--muted)">Deadline: ${o.deadline}</span>
      <button class="btn" onclick="alert('Opening application portal for:\\n${o.title} – ${o.uni}')"><i class="fa-solid fa-arrow-up-right-from-square"></i> Apply</button>
    </div>
  </div>`).join('');
}
render();
</script>
</body>
</html>
