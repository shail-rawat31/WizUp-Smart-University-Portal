<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Detailed Reports – WizUP Student</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--card:rgba(10,12,18,.82);--border:rgba(229,56,59,.18);--b2:rgba(255,255,255,.09);--muted:#8892b0;--brand:#e5383b;--success:#22c55e}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;font-family:'Inter',sans-serif;background:url("../assets/images/bg1.jpg") center/cover no-repeat fixed;background-color:#050505;color:#fff}
.overlay{position:fixed;inset:0;background:radial-gradient(circle at 70% 40%,rgba(0,0,0,.15),rgba(0,0,0,.88));pointer-events:none;z-index:0}
.topbar{display:flex;align-items:center;gap:14px;padding:12px 24px;background:rgba(0,0,0,.85);backdrop-filter:blur(20px);border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100}
.logo{width:40px;height:40px;background:#000;border-radius:10px;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.1)}
.logo img{width:70%}
.t-title h1{margin:0;font-family:'Outfit',sans-serif;font-size:16px;font-weight:800;letter-spacing:1px}
.t-title p{margin:0;font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.spacer{flex:1}
.nav-link{color:#fca5a5;text-decoration:none;font-size:12px;font-weight:700;display:flex;align-items:center;gap:8px;transition:.2s}
.nav-link:hover{color:#fff}

.container{width:min(1100px,95vw);margin:30px auto;position:relative;z-index:1}
.page-title{font-family:'Outfit',sans-serif;font-size:28px;font-weight:900;margin-bottom:24px;display:flex;align-items:center;gap:12px}
.page-title i { color: var(--brand); font-size: 20px; }

.card{background:var(--card);border:1px solid var(--border);border-radius:20px;backdrop-filter:blur(24px);box-shadow:0 12px 40px rgba(0,0,0,.45);overflow:hidden;margin-bottom:22px}
.card-hd{padding:18px 24px;border-bottom:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-between;background:rgba(229,56,59,.04)}
.card-hd h2{font-family:'Outfit',sans-serif;font-size:15px;font-weight:800;display:flex;align-items:center;gap:10px;color:#fff}
.card-hd h2 i{color:#fca5a5}
.card-bd{padding:25px}

.stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:22px}
.stat-box{padding:20px;border:1px solid var(--b2);border-radius:16px;background:rgba(255,255,255,0.02);text-align:center;transition:0.3s;border-bottom:3px solid transparent}
.stat-box:hover { background: rgba(255,255,255,0.05); transform: translateY(-3px); }
.stat-box .sv{font-family:'Outfit',sans-serif;font-size:32px;font-weight:900;margin-bottom:4px}
.stat-box .sl{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;font-weight:700}

.subject-row{display:flex;align-items:center;gap:16px;padding:16px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.subject-row:last-child{border-bottom:none}
.sub-info{flex:1.2;min-width:0}
.sub-name{font-size:15px;font-weight:700;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub-code{font-size:11px;color:var(--muted);font-weight:600}
.sub-bar-wrap{flex:2;display:flex;align-items:center;gap:12px}
.bar-track{flex:1;height:8px;background:rgba(255,255,255,.05);border-radius:99px;overflow:hidden}
.bar-fill{height:100%;border-radius:99px;transition:width 0.8s cubic-bezier(0.4, 0, 0.2, 1)}
.sub-pct{font-family:'Outfit',sans-serif;font-size:16px;font-weight:900;min-width:55px;text-align:right}

.grid2{display:grid;grid-template-columns:1.2fr 1fr;gap:22px}
.chart-wrap{position:relative;height:240px}

.loading-overlay{position:absolute;inset:0;background:var(--card);display:flex;align-items:center;justify-content:center;z-index:5;flex-direction:column;gap:10px}
.loading-overlay i{font-size:30px;color:var(--brand)}

@media(max-width:850px){.grid2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="overlay"></div>
<div class="topbar">
  <div class="logo"><img src="../assets/images/LOGO1.png" alt="WizUP"/></div>
  <div class="t-title"><h1>Attendance Analyzer</h1><p>Student Performance Center</p></div>
  <div class="spacer"></div>
  <a href="student-dashboard.html" class="nav-link"><i class="fa-solid fa-arrow-left"></i> Hub</a>
</div>

<div class="container" id="content" style="opacity:0; transition:0.4s">
  <h2 class="page-title"><i class="fa-solid fa-chart-line"></i> Deep Attendance Analytics</h2>

  <div class="stats-row" id="statsRow"></div>

  <div class="grid2">
    <div class="card" style="position:relative">
      <div class="card-hd"><h2><i class="fa-solid fa-layer-group"></i> Course-wise Breakdown</h2></div>
      <div class="card-bd" id="subjectList" style="min-height:300px"></div>
    </div>
    <div class="card">
      <div class="card-hd"><h2><i class="fa-solid fa-chart-simple"></i> Attendance Trends</h2></div>
      <div class="card-bd"><div class="chart-wrap"><canvas id="trendChart"></canvas></div></div>
    </div>
  </div>

  <div class="card">
    <div class="card-hd"><h2><i class="fa-solid fa-calendar-check"></i> Monthly Engagement Timeline</h2></div>
    <div class="card-bd">
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px;text-align:center;font-size:11px;font-weight:800;color:rgba(255,255,255,0.4)">
        <div>SUN</div><div>MON</div><div>TUE</div><div>WED</div><div>THU</div><div>FRI</div><div>SAT</div>
      </div>
      <div id="calGrid" style="display:grid;grid-template-columns:repeat(7,1fr);gap:6px"></div>
      <div style="display:flex;gap:15px;flex-wrap:wrap;margin-top:20px;padding-top:15px;border-top:1px solid rgba(255,255,255,0.05)">
          <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,0.5)"><span style="width:12px;height:12px;border-radius:3px;background:rgba(34,197,94,0.4)"></span>Present</div>
          <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,0.5)"><span style="width:12px;height:12px;border-radius:3px;background:rgba(239,68,68,0.4)"></span>Absent</div>
          <div style="display:flex;align-items:center;gap:6px;font-size:11px;color:rgba(255,255,255,0.5)"><span style="width:12px;height:12px;border-radius:3px;background:rgba(245,158,11,0.25)"></span>Vacation</div>
      </div>
    </div>
  </div>
</div>

<script>
    const db = supabase.createClient(
        "https://vqxhbfbpqwpdbmgtdcik.supabase.co",
        "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZxeGhiZmJwcXdwZGJtZ3RkY2lrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE4MTY1MTMsImV4cCI6MjA4NzM5MjUxM30.U9wuwWRDsUqKef93fl0C1DLu9l_hQ5zKMT9KhOt24xE"
    );

    let currentUid = null;
    let myAttendance = [];
    let trendChart = null;

    async function init() {
        const { data: { session } } = await db.auth.getSession();
        if (!session) { window.location.href = "student-signin.html"; return; }
        currentUid = session.user.id;

        await loadRealtimeData();
        setupRealtime();
        
        document.getElementById('content').style.opacity = '1';
        renderCalendar();
    }

    async function loadRealtimeData() {
        const { data, error } = await db
            .from('attendance_summary')
            .select('*')
            .eq('student_id', currentUid);

        if (error) { console.error(error); return; }
        myAttendance = data || [];
        updateUI();
    }

    function setupRealtime() {
        db.channel('att-reports')
            .on('postgres_changes', { 
                event: '*', 
                schema: 'public', 
                table: 'attendance', 
                filter: `student_id=eq.${currentUid}` 
            }, async () => {
                console.log("⚡ Attendance synced. Updating reports...");
                await loadRealtimeData();
            })
            .subscribe();
    }

    function updateUI() {
        if (!myAttendance.length) {
            document.getElementById('subjectList').innerHTML = `<div style="padding:60px;text-align:center;color:var(--muted)"><i class="fa-solid fa-hourglass-empty fa-2x"></i><br>No attendance records found yet.</div>`;
            return;
        }

        // Stats
        const totClasses = myAttendance.reduce((a,b) => a + b.total_classes, 0);
        const totAtt = myAttendance.reduce((a,b) => a + b.attended, 0);
        const overallPct = totClasses > 0 ? ((totAtt/totClasses)*100).toFixed(1) : 0;
        const atRisk = myAttendance.filter(s => s.percentage < 75).length;

        document.getElementById('statsRow').innerHTML = `
            <div class="stat-box" style="border-bottom-color:${overallPct >= 75 ? 'var(--success)' : 'var(--brand)'}">
                <div class="sv" style="color:${overallPct >= 75 ? '#86efac' : '#fca5a5'}">${overallPct}%</div>
                <div class="sl">Overall Attendance</div>
            </div>
            <div class="stat-box"><div class="sv">${totAtt}</div><div class="sl">Total Present</div></div>
            <div class="stat-box"><div class="sv" style="color:var(--muted)">${totClasses - totAtt}</div><div class="sl">Total Absent</div></div>
            <div class="stat-box" style="border-bottom-color:${atRisk > 0 ? 'var(--brand)' : 'transparent'}">
                <div class="sv" style="color:#fcd34d">${atRisk}</div>
                <div class="sl">Shortage Subjects</div>
            </div>
        `;

        // Subjects
        document.getElementById('subjectList').innerHTML = myAttendance.map(s => {
            const clr = s.percentage >= 75 ? '#22c55e' : s.percentage >= 60 ? '#f59e0b' : '#ef4444';
            return `
                <div class="subject-row">
                    <div class="sub-info">
                        <div class="sub-name">${s.subject_name}</div>
                        <div class="sub-code">${s.attended} Present / ${s.total_classes} Held</div>
                    </div>
                    <div class="sub-bar-wrap">
                        <div class="bar-track"><div class="bar-fill" style="width:${s.percentage}%;background:${clr}"></div></div>
                        <div class="sub-pct" style="color:${clr}">${s.percentage}%</div>
                    </div>
                </div>
            `;
        }).join('');

        updateChart();
    }

    function updateChart() {
        const ctx = document.getElementById('trendChart').getContext('2d');
        if (trendChart) trendChart.destroy();

        trendChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: myAttendance.map(s => s.subject_name.substring(0, 10)),
                datasets: [{
                    label: 'Subject %',
                    data: myAttendance.map(s => s.percentage),
                    borderColor: '#fca5a5',
                    backgroundColor: 'rgba(229,56,59,0.1)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 5,
                    pointBackgroundColor: '#e5383b'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display:false } },
                scales: {
                    y: { min:0, max:100, grid: { color:'rgba(255,255,255,0.05)' }, ticks: { color: '#8892b0' } },
                    x: { grid: { display:false }, ticks: { color: '#8892b0' } }
                }
            }
        });
    }

    function renderCalendar() {
        const grid = document.getElementById('calGrid');
        // Simple 35 day grid for March/April visualization
        grid.innerHTML = Array(35).fill(0).map((_, i) => {
            const day = (i % 31) + 1;
            const isWeekend = i % 7 === 0 || i % 7 === 6;
            const cls = isWeekend ? 'rgba(245,158,11,0.1)' : 'rgba(255,255,255,0.03)';
            const border = isWeekend ? 'rgba(245,158,11,0.2)' : 'rgba(255,255,255,0.08)';
            return `<div style="aspect-ratio:1;border:1px solid ${border};background:${cls};border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:rgba(255,255,255,0.3)">${day}</div>`;
        }).join('');
    }

    init();
</script>
</body>
</html>
